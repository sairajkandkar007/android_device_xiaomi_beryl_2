name: Beryl - Sync Stock Touch Files

on:
  workflow_dispatch:
    inputs:
      ROM_VERSION:
        description: "Xiaomi stock ROM version"
        required: true
        default: "OS1.0.4.0.UOQINXM"
      ROM_FILENAME:
        description: "Xiaomi recovery ROM filename"
        required: true
        default: "miui_BERYLINGlobal_OS1.0.4.0.UOQINXM_b51bc03ea2_14.0.zip"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 p7zip-full file binutils kmod lz4 erofs-utils
          python3 -m pip install --disable-pip-version-check --no-cache-dir android-payload-dumper
          payload-dumper --version

      - name: Find fastest Xiaomi CDN
        id: cdn
        env:
          ROM_VERSION: ${{ inputs.ROM_VERSION }}
          ROM_FILENAME: ${{ inputs.ROM_FILENAME }}
        run: |
          set -euo pipefail
          mkdir -p work/benchmark
          : > work/benchmark/results.txt

          candidates=(
            "https://bigota.d.miui.com/${ROM_VERSION}/${ROM_FILENAME}"
            "https://bn.d.miui.com/${ROM_VERSION}/${ROM_FILENAME}"
            "https://hugeota.d.miui.com/${ROM_VERSION}/${ROM_FILENAME}"
          )

          for url in "${candidates[@]}"; do
            name="$(echo "$url" | sed -E 's#https://([^./]+).*#\1#')"
            out="work/benchmark/${name}.bin"
            start_ns="$(date +%s%N)"

            if curl -L --fail --silent --show-error \
              --range 0-16777215 \
              --max-time 60 \
              -o "$out" "$url"; then
              end_ns="$(date +%s%N)"
              bytes="$(stat -c%s "$out")"
              elapsed_ns=$((end_ns-start_ns))

              if (( elapsed_ns > 0 )); then
                speed="$(awk -v b="$bytes" -v n="$elapsed_ns" \
                  'BEGIN { printf "%.4f", b/1048576/(n/1000000000) }')"
              else
                speed="0"
              fi

              echo "$speed $url" | tee -a work/benchmark/results.txt
            else
              echo "0 $url" | tee -a work/benchmark/results.txt
            fi
          done

          best="$(sort -nr work/benchmark/results.txt | head -n1)"
          speed="$(echo "$best" | awk '{print $1}')"
          url="$(echo "$best" | cut -d' ' -f2-)"

          [[ -n "$url" && "$speed" != "0" ]] || {
            echo "::error::No Xiaomi CDN responded."
            exit 1
          }

          echo "Selected $url at ${speed} MiB/s"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Download stock ROM
        env:
          ROM_URL: ${{ steps.cdn.outputs.url }}
          ROM_FILENAME: ${{ inputs.ROM_FILENAME }}
        run: |
          set -euo pipefail
          mkdir -p work/rom
          start_ns="$(date +%s%N)"

          aria2c \
            --allow-overwrite=true \
            --auto-file-renaming=false \
            --continue=true \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=1M \
            --file-allocation=none \
            --disk-cache=128M \
            --enable-http-pipelining=true \
            --reuse-uri=true \
            --summary-interval=5 \
            --timeout=30 \
            --connect-timeout=15 \
            --max-tries=8 \
            --retry-wait=1 \
            --out="$ROM_FILENAME" \
            --dir=work/rom \
            "$ROM_URL"

          end_ns="$(date +%s%N)"
          size="$(stat -c%s "work/rom/$ROM_FILENAME")"
          echo "Downloaded $((size/1048576)) MiB"
          awk -v b="$size" -v n="$((end_ns-start_ns))" \
            'BEGIN { printf "Average: %.2f MiB/s\n", b/1048576/(n/1000000000) }'
          sha256sum "work/rom/$ROM_FILENAME" | tee work/rom/SHA256SUMS

      - name: Extract payload.bin
        env:
          ROM_FILENAME: ${{ inputs.ROM_FILENAME }}
        run: |
          set -euo pipefail
          mkdir -p work/rom
          7z e "work/rom/$ROM_FILENAME" payload.bin -so > work/rom/payload.bin
          test -s work/rom/payload.bin
          ls -lh work/rom/payload.bin

      - name: Extract required partitions
        run: |
          set -euo pipefail
          mkdir -p work/partitions

          payload-dumper \
            work/rom/payload.bin \
            -o work/partitions \
            -p vendor vendor_dlkm odm_dlkm vendor_boot boot dtbo vbmeta vbmeta_system vbmeta_vendor \
            -j 8

          ls -lh work/partitions

      - name: Extract vendor and vendor_dlkm
        run: |
          set -euo pipefail
          mkdir -p work/vendor work/vendor_dlkm

          if [[ -f work/partitions/vendor.img ]]; then
            file work/partitions/vendor.img
            fsck.erofs --extract=work/vendor work/partitions/vendor.img
          else
            echo "::error::vendor.img was not extracted."
            exit 1
          fi

          if [[ -f work/partitions/vendor_dlkm.img ]]; then
            file work/partitions/vendor_dlkm.img
            fsck.erofs --extract=work/vendor_dlkm work/partitions/vendor_dlkm.img
          else
            echo "::error::vendor_dlkm.img was not extracted."
            exit 1
          fi

      - name: Verify exact stock touch files
        run: |
          set -euo pipefail

          mkdir -p work/required/modules work/required/firmware

          module_names=(
            fts_touch_i2c.ko
            xiaomi_tp.ko
            lct_tp.ko
            scp.ko
            mtk-afe-external.ko
            mtk_tinysys_ipi.ko
            mtk_rpmsg_mbox.ko
            mtk-mbox.ko
          )

          for name in "${module_names[@]}"; do
            src="$(find work/vendor_dlkm -type f -name "$name" -print -quit)"
            [[ -n "$src" ]] || {
              echo "::error::Missing required module: $name"
              exit 1
            }
            cp -L "$src" "work/required/modules/$name"
          done

          firmware_names=(
            Conf_MultipleTest_ft3519t.ini
            focaltech_ts_fw_samsung_ft3519t.bin
          )

          for name in "${firmware_names[@]}"; do
            src="$(find work/vendor -type f -name "$name" -print -quit)"
            [[ -n "$src" ]] || {
              echo "::error::Missing required firmware: $name"
              exit 1
            }
            cp -L "$src" "work/required/firmware/$name"
          done

          echo "===== SHA256 ====="
          find work/required -type f -print0 | sort -z | xargs -0 sha256sum

          echo "===== Module vermagic ====="
          for module in work/required/modules/*.ko; do
            echo "--- $(basename "$module")"
            modinfo -F vermagic "$module" || true
            modinfo -F depends "$module" || true
          done

          echo "===== Touch firmware ====="
          ls -lh work/required/firmware

      - name: Install verified files into device tree
        run: |
          set -euo pipefail

          mkdir -p device/xiaomi/beryl/prebuilt/modules
          mkdir -p device/xiaomi/beryl/prebuilt/firmware

          cp -Lf work/required/modules/*.ko \
            device/xiaomi/beryl/prebuilt/modules/

          cp -Lf work/required/firmware/*.bin \
            device/xiaomi/beryl/prebuilt/firmware/

          cp -Lf work/required/firmware/*.ini \
            device/xiaomi/beryl/prebuilt/firmware/

          # Keep a machine-readable provenance record.
          {
            echo "Source ROM: ${{ inputs.ROM_VERSION }}"
            echo "ROM: ${{ inputs.ROM_FILENAME }}"
            echo
            echo "Required stock touch files:"
            find device/xiaomi/beryl/prebuilt/modules \
              device/xiaomi/beryl/prebuilt/firmware \
              -maxdepth 1 -type f -print | sort
            echo
            echo "SHA256:"
            find device/xiaomi/beryl/prebuilt/modules \
              device/xiaomi/beryl/prebuilt/firmware \
              -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum
          } > device/xiaomi/beryl/prebuilt/STOCK_TOUCH_PROVENANCE.txt

      - name: Verify device.mk and files
        run: |
          set -euo pipefail

          grep -F 'TW_LOAD_VENDOR_MODULES := "fts_touch_i2c.ko xiaomi_tp.ko lct_tp.ko scp.ko mtk-afe-external.ko mtk_tinysys_ipi.ko mtk_rpmsg_mbox.ko mtk-mbox.ko"' \
            device/xiaomi/beryl/device.mk

          grep -F 'Conf_MultipleTest_ft3519t.ini' device/xiaomi/beryl/device.mk
          grep -F 'focaltech_ts_fw_samsung_ft3519t.bin' device/xiaomi/beryl/device.mk

          test -f device/xiaomi/beryl/prebuilt/modules/fts_touch_i2c.ko
          test -f device/xiaomi/beryl/prebuilt/modules/xiaomi_tp.ko
          test -f device/xiaomi/beryl/prebuilt/modules/lct_tp.ko
          test -f device/xiaomi/beryl/prebuilt/firmware/Conf_MultipleTest_ft3519t.ini
          test -f device/xiaomi/beryl/prebuilt/firmware/focaltech_ts_fw_samsung_ft3519t.bin

      - name: Create patch branch
        id: branch
        run: |
          set -euo pipefail
          branch="stock-touch-sync-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            device/xiaomi/beryl/device.mk \
            device/xiaomi/beryl/BoardConfig.mk \
            device/xiaomi/beryl/prebuilt/

          git diff --cached --stat

          git diff --cached --quiet && {
            echo "No changes to commit."
            exit 0
          }

          git commit -m "beryl: add stock FT3519T touch files"

      - name: Push patch branch
        run: |
          set -euo pipefail
          git push --set-upstream origin "${{ steps.branch.outputs.name }}"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "${{ steps.branch.outputs.name }}" \
            --title "beryl: add stock FT3519T touch files" \
            --body "Imports the verified stock beryl FT3519T touch modules and firmware from ${{ inputs.ROM_VERSION }}. No FBE/decryption changes."

      - name: Upload verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: beryl-stock-touch-verification
          path: |
            work/rom/SHA256SUMS
            work/benchmark/results.txt
            work/required/
            device/xiaomi/beryl/prebuilt/STOCK_TOUCH_PROVENANCE.txt
          compression-level: 9
