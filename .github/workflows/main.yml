name: Extract and Inject Touch Modules

on:
  workflow_dispatch:

jobs:
  extract-modules:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install EROFS Utilities
        run: |
          sudo apt update
          sudo apt install -y erofs-utils

      - name: Download vendor_dlkm.img
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch the vendor_dlkm image directly from your old repository's release
          gh release download "Berylstock" --pattern "vendor_dlkm.img" -R sairajkandkar007/android_device_xiaomi_beryl

      - name: Extract EROFS Image
        run: |
          mkdir -p vendor_dlkm_extracted
          # fsck.erofs is the native tool for unpacking EROFS images
          fsck.erofs --extract=vendor_dlkm_extracted vendor_dlkm.img

      - name: Stage Kernel Modules in Device Tree
        run: |
          # Create the standard vendor module directory for OrangeFox
          MODULES_DIR="recovery/root/vendor/lib/modules"
          mkdir -p "$MODULES_DIR"

          # Target touchscreen and dependency modules mapped in the handoff
          TARGET_MODULES=(
            "fts_touch_i2c.ko"
            "xiaomi_tp.ko"
            "lct_tp.ko"
            "scp.ko"
            "mtk-afe-external.ko"
            "mtk_tinysys_ipi.ko"
            "mtk_rpmsg_mbox.ko"
            "mtk-mbox.ko"
          )

          # Find and copy each required module into the recovery tree
          for mod in "${TARGET_MODULES[@]}"; do
            find vendor_dlkm_extracted -type f -name "$mod" -exec cp {} "$MODULES_DIR/" \;
            echo "Copied $mod"
          done

      - name: Commit Modules to Repository
        run: |
          # Clean up the heavy extraction folders before committing
          rm -rf vendor_dlkm_extracted vendor_dlkm.img
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add recovery/root/vendor/lib/modules/
          git commit -m "Inject stock touchscreen kernel modules" || echo "No changes to commit"
          git push
