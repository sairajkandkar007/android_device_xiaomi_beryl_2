name: Master Device Tree Generator

on:
  workflow_dispatch:

jobs:
  build-complete-tree:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y cpio liblzma-dev wget erofs-utils
          pip install twrpdtgen

      - name: Download All Stock Images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p stock
          cd stock
          gh release download "Berylstock" --pattern "vendor_boot.img" -R sairajkandkar007/android_device_xiaomi_beryl
          gh release download "Berylstock" --pattern "boot.img" -R sairajkandkar007/android_device_xiaomi_beryl
          gh release download "Berylstock" --pattern "vendor_dlkm.img" -R sairajkandkar007/android_device_xiaomi_beryl

      - name: Generate Scaffolding with twrpdtgen
        run: |
          mkdir -p output_tree
          python3 -m twrpdtgen stock/vendor_boot.img --output output_tree/

      - name: Extract Kernel and DTB
        continue-on-error: true
        run: |
          wget -qO magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk
          unzip -p magisk.apk lib/x86_64/libmagiskboot.so > magiskboot
          chmod a+x magiskboot
          
          # Swallows the VBMETA crash safely
          ./magiskboot unpack stock/boot.img || true

          TREE_DIR=$(find output_tree -mindepth 2 -maxdepth 2 -type d | head -n 1)
          mkdir -p "$TREE_DIR/prebuilt"
          
          if [ -f kernel ]; then mv kernel "$TREE_DIR/prebuilt/kernel"; fi
          if [ -f dtb ]; then mv dtb "$TREE_DIR/prebuilt/dtb"; fi

      - name: Extract and Inject All Kernel Modules
        run: |
          mkdir -p vendor_dlkm_extracted
          fsck.erofs --extract=vendor_dlkm_extracted stock/vendor_dlkm.img
          
          TREE_DIR=$(find output_tree -mindepth 2 -maxdepth 2 -type d | head -n 1)
          MODULES_DIR="$TREE_DIR/recovery/root/vendor/lib/modules"
          mkdir -p "$MODULES_DIR"
          
          # Inject all modules and dependency maps directly into the tree
          cp -r vendor_dlkm_extracted/lib/modules/* "$MODULES_DIR/"

      - name: Create vendorsetup.sh
        run: |
          TREE_DIR=$(find output_tree -mindepth 2 -maxdepth 2 -type d | head -n 1)
          {
            echo 'export FOX_BUILD_DEVICE="beryl"'
            echo 'export FOX_AB_DEVICE=1'
            echo 'export FOX_VIRTUAL_AB_DEVICE=1'
            echo 'export ALLOW_MISSING_DEPENDENCIES=true'
            echo 'export LC_ALL="C"'
            echo 'export OF_FORCE_PREBUILT_KERNEL=1'
            echo 'export OF_DEFAULT_KEYMASTER_VERSION=4.1'
          } > "$TREE_DIR/vendorsetup.sh"

      - name: Commit Complete Tree to Repository
        run: |
          TREE_DIR=$(find output_tree -mindepth 2 -maxdepth 2 -type d | head -n 1)
          cp -r $TREE_DIR/* ./
          
          # Clean up heavy binaries and temp files before committing
          rm -rf stock output_tree vendor_dlkm_extracted magiskboot magisk.apk kernel dtb ramdisk*
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initial commit: Complete device tree with kernel, dtb, and all vendor modules" || echo "No changes to commit"
          git push
