name: Generate Complete Device Tree

on:
  workflow_dispatch:

jobs:
  build-clean-tree:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y cpio liblzma-dev wget
          pip install twrpdtgen

      - name: Download Stock Images from Previous Repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p stock
          cd stock
          gh release download "Berylstock" --pattern "vendor_boot.img" -R sairajkandkar007/android_device_xiaomi_beryl
          gh release download "Berylstock" --pattern "boot.img" -R sairajkandkar007/android_device_xiaomi_beryl

      - name: Generate Scaffolding with twrpdtgen
        run: |
          mkdir -p output_tree
          python3 -m twrpdtgen stock/vendor_boot.img --output output_tree/

      - name: Extract Kernel using Official Magisk
        continue-on-error: true
        run: |
          wget -qO magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk
          unzip -p magisk.apk lib/x86_64/libmagiskboot.so > magiskboot
          chmod a+x magiskboot
          
          # Swallows the expected VBMETA crash
          ./magiskboot unpack stock/boot.img || true

          TREE_DIR=$(find output_tree -mindepth 2 -maxdepth 2 -type d | head -n 1)
          mkdir -p "$TREE_DIR/prebuilt"
          
          # Proper if statements prevent "exit code 1" if the dtb file doesn't exist
          if [ -f kernel ]; then 
            mv kernel "$TREE_DIR/prebuilt/kernel"
          fi
          
          if [ -f dtb ]; then 
            mv dtb "$TREE_DIR/prebuilt/dtb"
          fi

      - name: Create vendorsetup.sh
        run: |
          TREE_DIR=$(find output_tree -mindepth 2 -maxdepth 2 -type d | head -n 1)
          {
            echo 'export FOX_BUILD_DEVICE="beryl"'
            echo 'export FOX_AB_DEVICE=1'
            echo 'export FOX_VIRTUAL_AB_DEVICE=1'
            echo 'export ALLOW_MISSING_DEPENDENCIES=true'
            echo 'export LC_ALL="C"'
            echo 'export OF_FORCE_PREBUILT_KERNEL=1'
            echo 'export OF_DEFAULT_KEYMASTER_VERSION=4.1'
          } > "$TREE_DIR/vendorsetup.sh"

      - name: Commit Complete Tree to New Repository
        run: |
          TREE_DIR=$(find output_tree -mindepth 2 -maxdepth 2 -type d | head -n 1)
          cp -r $TREE_DIR/* ./
          rm -rf stock output_tree magiskboot magisk.apk kernel dtb ramdisk*
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initial commit: Generated complete OrangeFox device tree" || echo "No changes to commit"
          git push
          
