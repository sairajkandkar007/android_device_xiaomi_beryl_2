name: Integrate Beryl FBE Decryption

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  ROM_VERSION: "OS1.0.4.0.UOQINXM"
  ROM_FILENAME: "miui_BERYLINGlobal_OS1.0.4.0.UOQINXM_b51bc03ea2_14.0.zip"

jobs:
  integrate:
    runs-on: ubuntu-24.04

    steps:
      # ============================================================
      # 1. CHECKOUT ACTUAL MAIN TREE
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ============================================================
      # 2. INSTALL TOOLS
      # Same base tooling used by existing analysis workflow.
      # ============================================================
      - name: Install required tools
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            aria2 \
            unzip \
            zip \
            p7zip-full \
            file \
            lz4 \
            cpio \
            e2fsprogs \
            erofs-utils \
            android-sdk-libsparse-utils \
            binutils \
            grep \
            sed \
            jq \
            rsync \
            python3 \
            python3-pip

      # ============================================================
      # 3. PAYLOAD DUMPER
      # ============================================================
      - name: Install android-payload-dumper
        shell: bash
        run: |
          set -euxo pipefail

          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade \
            android-payload-dumper==2.3.0

      # ============================================================
      # 4. WORKSPACE
      # ============================================================
      - name: Prepare workspace
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf work

          mkdir -p \
            work/download \
            work/rom \
            work/payload \
            work/partitions \
            work/extracted \
            work/analysis \
            work/logs \
            work/integration \
            work/security

      # ============================================================
      # 5. PREPARE XIAOMI URLS
      # PRESERVED FROM EXISTING BASE
      # ============================================================
      - name: Prepare ROM URLs
        shell: bash
        run: |
          set -euo pipefail

          cat > work/cdn_urls.txt <<EOF
          https://bn.d.miui.com/${ROM_VERSION}/${ROM_FILENAME}
          https://bigota.d.miui.com/${ROM_VERSION}/${ROM_FILENAME}
          EOF

      # ============================================================
      # 6. BENCHMARK CDNs
      # ============================================================
      - name: Benchmark Xiaomi CDNs
        shell: bash
        run: |
          set -uo pipefail

          : > work/cdn_benchmark.txt

          while IFS= read -r URL; do
            RESULT=$(
              curl -L \
                --connect-timeout 15 \
                --max-time 30 \
                -r 0-10485759 \
                -o /dev/null \
                -sS \
                -w "%{http_code} %{speed_download}\n" \
                "$URL" 2>/dev/null
            ) || RESULT="000 0"

            CODE=$(echo "$RESULT" | awk '{print $1}')
            SPEED=$(echo "$RESULT" | awk '{print $2}')

            echo "$SPEED $CODE $URL" \
              | tee -a work/cdn_benchmark.txt

          done < work/cdn_urls.txt

      # ============================================================
      # 7. SELECT FASTEST CDN
      # ============================================================
      - name: Select fastest CDN
        shell: bash
        run: |
          set -euo pipefail

          BEST_URL=$(
            awk '
              $2 ~ /^2/ && $1 > 0 {
                print $1 "|" $3
              }
            ' work/cdn_benchmark.txt |
            sort -nr |
            head -1 |
            cut -d'|' -f2-
          )

          if [ -z "$BEST_URL" ]; then
            echo "No working Xiaomi CDN found"
            cat work/cdn_benchmark.txt
            exit 1
          fi

          echo "ROM_URL=$BEST_URL" >> "$GITHUB_ENV"

      # ============================================================
      # 8. DOWNLOAD STOCK ROM
      # PRESERVED
      # ============================================================
      - name: Download stock ROM
        shell: bash
        run: |
          set -euo pipefail

          aria2c \
            --file-allocation=none \
            --continue=true \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=10M \
            --max-tries=10 \
            --retry-wait=5 \
            --timeout=60 \
            --connect-timeout=30 \
            --dir=work/download \
            --out="$ROM_FILENAME" \
            "$ROM_URL"

      # ============================================================
      # 9. VERIFY ROM
      # ============================================================
      - name: Verify downloaded ROM
        shell: bash
        run: |
          set -euxo pipefail

          ROM="work/download/$ROM_FILENAME"

          test -s "$ROM"

          sha256sum "$ROM" \
            > work/logs/rom.sha256

          unzip -t "$ROM" \
            > work/logs/zip_test.txt

      # ============================================================
      # 10. COMPLETE ZIP EXTRACTION
      # PRESERVED
      # ============================================================
      - name: Extract ROM archive
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work/rom
          mkdir -p work/rom

          unzip -q \
            "work/download/$ROM_FILENAME" \
            -d work/rom

      # ============================================================
      # 11. FIND PAYLOAD.BIN
      # PRESERVED
      # ============================================================
      - name: Extract payload.bin
        shell: bash
        run: |
          set -euo pipefail

          PAYLOAD="$(find work/rom \
            -type f \
            -name payload.bin \
            -print -quit)"

          if [ -z "$PAYLOAD" ]; then
            echo "payload.bin not found"
            exit 1
          fi

          cp "$PAYLOAD" \
            work/payload/payload.bin

          sha256sum work/payload/payload.bin \
            > work/logs/payload.sha256

      # ============================================================
      # 12. LIST PAYLOAD
      # PRESERVED
      # ============================================================
      - name: List payload partitions
        shell: bash
        run: |
          set -euo pipefail

          python3 -m payload_dumper \
            work/payload/payload.bin \
            -l \
            > work/logs/payload_partitions.txt

      # ============================================================
      # 13. EXTRACT EXACT SAME PARTITIONS / -j 8
      # ============================================================
      - name: Extract stock partitions
        shell: bash
        run: |
          set -euo pipefail

          python3 -m payload_dumper \
            work/payload/payload.bin \
            -o work/partitions \
            -p \
              vendor \
              vendor_dlkm \
              odm_dlkm \
              system \
              system_ext \
              product \
              init_boot \
              boot \
              dtbo \
              vendor_boot \
              vbmeta \
              vbmeta_system \
              vbmeta_vendor \
            -j 8

      # ============================================================
      # 14. EXTRACT EROFS
      # ============================================================
      - name: Extract EROFS partitions
        shell: bash
        run: |
          set +e

          for PART in \
            vendor \
            vendor_dlkm \
            odm_dlkm \
            system \
            system_ext \
            product
          do
            IMG="work/partitions/${PART}.img"
            OUT="$PWD/work/extracted/${PART}"

            [ -f "$IMG" ] || continue

            mkdir -p "$OUT"

            if file "$IMG" | grep -qi EROFS; then
              fsck.erofs \
                --extract="$OUT" \
                "$IMG" \
                > "work/logs/${PART}_erofs.log" 2>&1
            fi
          done

          exit 0

      # ============================================================
      # 15. BUILD COMBINED STOCK ROOT
      # ============================================================
      - name: Build combined stock root
        shell: bash
        run: |
          set -euo pipefail

          for PART in \
            vendor \
            vendor_dlkm \
            odm_dlkm \
            system \
            system_ext \
            product
          do
            if [ -d "work/extracted/$PART" ]; then
              mkdir -p "work/security/$PART"

              rsync -a \
                "work/extracted/$PART/" \
                "work/security/$PART/"
            fi
          done

      # ============================================================
      # 16. EXTRACT VENDOR_BOOT RAMDISK
      # ============================================================
      - name: Extract vendor_boot ramdisk
        shell: bash
        run: |
          set -euo pipefail

          IMG=work/partitions/vendor_boot.img

          [ -f "$IMG" ] || exit 0

          mkdir -p work/security/vendor_boot

          python3 - "$IMG" <<'PY'
          import struct
          import sys

          img = sys.argv[1]

          with open(img, "rb") as f:
              data = f.read()

          if data[:8] != b"VNDRBOOT":
              raise SystemExit("Invalid vendor_boot image")

          page_size = struct.unpack_from("<I", data, 12)[0]
          ramdisk_size = struct.unpack_from("<I", data, 24)[0]

          header_size = 2112
          offset = ((header_size + page_size - 1) // page_size) * page_size

          ramdisk = data[offset:offset + ramdisk_size]

          with open("work/security/vendor_boot/vendor_ramdisk.cpio", "wb") as f:
              f.write(ramdisk)

          print(len(ramdisk))
          PY

          mkdir -p work/security/vendor_boot/ramdisk

          file work/security/vendor_boot/vendor_ramdisk.cpio

          if file work/security/vendor_boot/vendor_ramdisk.cpio |
             grep -qi gzip; then
            gzip -dc \
              work/security/vendor_boot/vendor_ramdisk.cpio |
              (cd work/security/vendor_boot/ramdisk &&
               cpio -idm --no-absolute-filenames)
          else
            (cd work/security/vendor_boot/ramdisk &&
             cpio -idm --no-absolute-filenames) \
              < work/security/vendor_boot/vendor_ramdisk.cpio
          fi

      # ============================================================
      # 17. DEFINE SECURITY ROOTS
      # ============================================================
      - name: Locate security roots
        shell: bash
        run: |
          set -euo pipefail

          ROOT=work/security

          : > work/analysis/security_roots.txt

          find "$ROOT" -type f \
            \( \
              -name 'android.hardware.security.keymint@1.0-service.mitee' \
              -o -name 'android.hardware.gatekeeper@1.0-service.mitee' \
              -o -name 'tee-supplicant' \
            \) \
            -print \
            | sort -u \
            | tee work/analysis/security_roots.txt

          # KeyMint is mandatory for this integration.
          grep -q \
            'android.hardware.security.keymint@1.0-service.mitee' \
            work/analysis/security_roots.txt \
            || {
              echo "KeyMint service not found"
              exit 1
            }

      # ============================================================
      # 18. RECURSIVE ELF DEPENDENCY RESOLUTION
      # ============================================================
      - name: Resolve security ELF dependency closure
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from collections import deque
          import subprocess
          import re

          root = Path("work/security").resolve()

          seeds = [
              Path(x.strip())
              for x in Path("work/analysis/security_roots.txt")
              .read_text()
              .splitlines()
              if x.strip()
          ]

          index = {}

          for f in root.rglob("*"):
              if f.is_file():
                  index.setdefault(f.name, []).append(f)

          platform = {
              "libc.so",
              "libm.so",
              "libdl.so",
              "liblog.so",
              "libc++.so",
              "libbase.so",
              "libutils.so",
              "libcutils.so",
              "libz.so",
              "libselinux.so",
              "libprocessgroup.so",
          }

          q = deque(seeds)
          seen = set()
          missing = []

          def deps(path):
              p = subprocess.run(
                  ["readelf", "-d", str(path)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.DEVNULL,
                  text=True,
              )

              result = []

              for line in p.stdout.splitlines():
                  m = re.search(
                      r"Shared library: \[(.+?)\]",
                      line
                  )

                  if m:
                      result.append(m.group(1))

              return result

          while q:
              f = q.popleft()

              try:
                  real = f.resolve()
              except Exception:
                  real = f

              key = str(real)

              if key in seen:
                  continue

              seen.add(key)

              for lib in deps(real):

                  if lib in platform:
                      continue

                  candidates = index.get(lib, [])

                  if not candidates:
                      missing.append(
                          f"{real} -> {lib}"
                      )
                      continue

                  def rank(x):
                      s = str(x)

                      if "/vendor/" in s:
                          return 0
                      if "/odm" in s:
                          return 1
                      if "/system_ext/" in s:
                          return 2
                      if "/product/" in s:
                          return 3
                      return 4

                  candidate = sorted(
                      candidates,
                      key=rank
                  )[0]

                  q.append(candidate)

          Path(
              "work/analysis/resolved_security_elf.txt"
          ).write_text(
              "\n".join(sorted(seen)) + "\n"
          )

          Path(
              "work/analysis/missing_security_elf.txt"
          ).write_text(
              "\n".join(sorted(set(missing))) + "\n"
          )

          print("Resolved:", len(seen))
          print("Missing:", len(set(missing)))
          PY

      # ============================================================
      # 19. COPY RESOLVED SECURITY ELF FILES
      # INTO THE EXISTING PREBUILT/RECOVERY STRUCTURE
      # ============================================================
      - name: Stage resolved security files
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$PWD/work/security"
          DEST="$PWD/work/integration/recovery/root"

          while IFS= read -r FILE; do
            [ -f "$FILE" ] || continue

            REL="${FILE#"$ROOT"/}"

            case "$REL" in
              vendor/*|odm/*)
                mkdir -p "$DEST/$(dirname "$REL")"
                cp -a "$FILE" "$DEST/$REL"
                ;;
            esac
          done < work/analysis/resolved_security_elf.txt

      # ============================================================
      # 20. RESOLVE TEE KERNEL MODULE CLOSURE
      # START WITH EXISTING ROOT MODULES
      # ============================================================
      - name: Resolve TEE kernel modules
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from collections import deque

          root = Path("work/security")

          target_names = {
              "gz_trusty_mod.ko",
              "gz_tz_system.ko",
          }

          module_paths = {}

          for p in root.rglob("*.ko"):
              module_paths[p.name] = p

          deps = {}

          for depfile in root.rglob("modules.dep"):
              for line in depfile.read_text(
                  errors="ignore"
              ).splitlines():

                  if ":" not in line:
                      continue

                  left, right = line.split(":", 1)

                  module = Path(left).name

                  deps[module] = [
                      Path(x).name
                      for x in right.split()
                  ]

          q = deque(target_names)
          selected = set()

          while q:
              name = q.popleft()

              if name in selected:
                  continue

              if name not in module_paths:
                  continue

              selected.add(name)

              for dep in deps.get(name, []):
                  q.append(dep)

          with open(
              "work/analysis/resolved_security_modules.txt",
              "w"
          ) as out:
              for name in sorted(selected):
                  out.write(
                      str(module_paths[name]) + "\n"
                  )

          print("Selected modules:")
          for name in sorted(selected):
              print(name)
          PY

      # ============================================================
      # 21. COPY MODULE CLOSURE
      # NOTE:
      # Existing tree already contains many recovery modules.
      # We add only modules required by the TEE roots.
      # ============================================================
      - name: Stage TEE modules
        shell: bash
        run: |
          set -euo pipefail

          DEST=work/integration/recovery/root/vendor/lib/modules

          mkdir -p "$DEST"

          while IFS= read -r FILE; do
            [ -f "$FILE" ] || continue
            cp -a "$FILE" "$DEST/"
          done < work/analysis/resolved_security_modules.txt

      # ============================================================
      # 22. EXACT SECURITY INIT FILES
      # ============================================================
      - name: Stage required security init files
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$PWD/work/security"
          DEST="$PWD/work/integration/recovery/root"

          find "$ROOT" \
            -type f \
            -name '*.rc' \
            -print0 |
          while IFS= read -r -d '' RC; do

            if grep -qE \
              'android\.hardware\.security\.keymint@1\.0-service\.mitee|android\.hardware\.gatekeeper@1\.0-service\.mitee|tee-supplicant' \
              "$RC"; then

              REL="${RC#"$ROOT"/}"

              mkdir -p "$DEST/$(dirname "$REL")"

              cp -a "$RC" "$DEST/$REL"

              echo "$REL" \
                >> work/analysis/security_init_files.txt
            fi

          done

      # ============================================================
      # 23. EXACT VINTF SECURITY DECLARATIONS
      # ============================================================
      - name: Stage required VINTF files
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$PWD/work/security"
          DEST="$PWD/work/integration/recovery/root"

          find "$ROOT" \
            -type f \
            \( -name '*.xml' -o -name '*.manifest' \) \
            -print0 |
          while IFS= read -r -d '' XML; do

            if grep -qEi \
              'android\.hardware\.security\.keymint|android\.hardware\.gatekeeper|android\.hardware\.keymaster' \
              "$XML"; then

              REL="${XML#"$ROOT"/}"

              mkdir -p "$DEST/$(dirname "$REL")"

              cp -a "$XML" "$DEST/$REL"

              echo "$REL" \
                >> work/analysis/security_vintf_files.txt
            fi

          done

      # ============================================================
      # 24. REQUIRED SECURITY FIRMWARE / CONFIG
      # ============================================================
      - name: Stage security firmware and configuration
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$PWD/work/security"
          DEST="$PWD/work/integration/recovery/root"

          find "$ROOT" -type f \
            \( \
              -iname '*mitee*' \
              -o -iname '*trustonic*' \
              -o -iname '*tida_mitee*' \
              -o -iname '*keymint*' \
              -o -iname '*keymaster*' \
            \) \
            -path '*/firmware/*' \
            -print0 |
          while IFS= read -r -d '' FILE; do

            REL="${FILE#"$ROOT"/}"

            mkdir -p "$DEST/$(dirname "$REL")"

            cp -a "$FILE" "$DEST/$REL"

          done

      # ============================================================
      # 25. SELINUX DISCOVERY
      # ============================================================
      - name: Discover SELinux security domains
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/security_sepolicy

          grep -RniE \
            'hal_keymint_default|hal_gatekeeper_default|hal_keymaster_default|mitee_client_device|mitee_sfs_file|mobicore|mobicore_user_device|teei_client_device|tkcore_admin_device|ut_keymaster_device|key_install_data_file|vendor_mtk_mitee_prop' \
            work/security \
            2>/dev/null \
            > work/analysis/stock_security_selinux_refs.txt || true

          find work/security \
            -type f \
            \( \
              -name '*context*' \
              -o -name '*.te' \
              -o -name '*.cil' \
              -o -name 'sepolicy' \
            \) \
            -print \
            | sort \
            > work/analysis/stock_selinux_files.txt

      # ============================================================
      # 26. GENERATE DEVICE-TREE SELINUX
      # Uses the actual referenced stock domains rather than
      # copying the complete stock policy.
      # ============================================================
      - name: Generate Beryl recovery SELinux policy
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            work/integration/sepolicy/recovery

          cat > \
            work/integration/sepolicy/recovery/fbe_security.te \
            <<'EOF'
          # Beryl OrangeFox FBE security support.
          # Generated from stock KeyMint/Gatekeeper/TEE references.
          #
          # Keep recovery enforcing.
          # Do not add permissive domains.

          type recovery_fbe_vendor_file, file_type, vendor_file_type;

          type recovery_mitee_device, dev_type;
          type recovery_mobicore_device, dev_type;
          type recovery_teei_device, dev_type;
          type recovery_tkcore_device, dev_type;

          type recovery_mitee_sfs_file, file_type, data_file_type;

          allow recovery recovery_fbe_vendor_file:dir {
              getattr
              open
              read
              search
          };

          allow recovery recovery_fbe_vendor_file:file {
              getattr
              open
              read
              map
              execute
              execute_no_trans
          };

          allow recovery recovery_mitee_device:chr_file {
              getattr
              open
              read
              write
              ioctl
          };

          allow recovery recovery_mobicore_device:chr_file {
              getattr
              open
              read
              write
              ioctl
          };

          allow recovery recovery_teei_device:chr_file {
              getattr
              open
              read
              write
              ioctl
          };

          allow recovery recovery_tkcore_device:chr_file {
              getattr
              open
              read
              write
              ioctl
          };

          allow recovery recovery_mitee_sfs_file:dir {
              getattr
              create
              open
              read
              write
              search
              add_name
              remove_name
          };

          allow recovery recovery_mitee_sfs_file:file {
              getattr
              create
              open
              read
              write
              setattr
              unlink
              map
          };
          EOF

          cat > \
            work/integration/sepolicy/recovery/file_contexts \
            <<'EOF'
          /vendor/bin/hw/android\.hardware\.security\.keymint@1\.0-service\.mitee    u:object_r:recovery_fbe_vendor_file:s0
          /vendor/bin/hw/android\.hardware\.gatekeeper@1\.0-service\.mitee          u:object_r:recovery_fbe_vendor_file:s0
          /vendor/bin/tee-supplicant                                                u:object_r:recovery_fbe_vendor_file:s0

          /dev/mitee.*                                                              u:object_r:recovery_mitee_device:s0
          /dev/mobicore                                                             u:object_r:recovery_mobicore_device:s0
          /dev/teei.*                                                               u:object_r:recovery_teei_device:s0
          /dev/tkcore.*                                                             u:object_r:recovery_tkcore_device:s0

          /data/vendor/mitee(/.*)?                                                  u:object_r:recovery_mitee_sfs_file:s0
          EOF

          if grep -RniE \
            '^[[:space:]]*permissive|setenforce[[:space:]]+0' \
            work/integration/sepolicy; then
            echo "Permissive policy detected"
            exit 1
          fi

      # ============================================================
      # 27. INSTALL SELINUX INTO ACTUAL TREE LAYOUT
      # ============================================================
      - name: Install SELinux files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p sepolicy/recovery

          cp \
            work/integration/sepolicy/recovery/fbe_security.te \
            sepolicy/recovery/fbe_security.te

          cp \
            work/integration/sepolicy/recovery/file_contexts \
            sepolicy/recovery/file_contexts

      # ============================================================
      # 28. GENERATE VENDOR COPY FILE LIST
      # device.mk already owns vendor recovery integration.
      # ============================================================
      - name: Generate FBE vendor copy fragment
        shell: bash
        run: |
          set -euo pipefail

          FRAGMENT=work/integration/fbe_vendor_files.mk

          cat > "$FRAGMENT" <<'EOF'
          # Beryl stock FBE security stack.
          # Auto-generated dependency closure.
          PRODUCT_COPY_FILES += \
          EOF

          mapfile -t FILES < <(
            find work/integration/recovery/root/vendor \
              -type f \
              ! -path '*/lib/modules/*' \
              | sort
          )

          TOTAL="${#FILES[@]}"
          IDX=0

          for FILE in "${FILES[@]}"; do
            IDX=$((IDX + 1))

            REL="${FILE#work/integration/recovery/root/}"

            if [ "$IDX" -lt "$TOTAL" ]; then
              printf \
                '    $(LOCAL_PATH)/%s:$(TARGET_COPY_OUT_RECOVERY)/%s \\\n' \
                "$REL" "$REL" \
                >> "$FRAGMENT"
            else
              printf \
                '    $(LOCAL_PATH)/%s:$(TARGET_COPY_OUT_RECOVERY)/%s\n' \
                "$REL" "$REL" \
                >> "$FRAGMENT"
            fi
          done

      # ============================================================
      # 29. INSTALL RESOLVED VENDOR FILES
      # INTO ACTUAL TREE recovery/root/vendor
      # ============================================================
      - name: Install security vendor files
        shell: bash
        run: |
          set -euo pipefail

          if [ -d work/integration/recovery/root/vendor ]; then
            mkdir -p recovery/root/vendor

            rsync -a \
              work/integration/recovery/root/vendor/ \
              recovery/root/vendor/
          fi

      # ============================================================
      # 30. INSTALL MODULES WITHOUT DESTROYING EXISTING MODULES
      # ============================================================
      - name: Install TEE modules
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p recovery/root/vendor/lib/modules

          cp -a \
            work/integration/recovery/root/vendor/lib/modules/*.ko \
            recovery/root/vendor/lib/modules/ \
            2>/dev/null || true

      # ============================================================
      # 31. UPDATE MODULE LOAD LIST
      # Keep existing modules.load and append only missing TEE modules.
      # ============================================================
      - name: Update recovery modules.load
        shell: bash
        run: |
          set -euo pipefail

          LOAD=recovery/root/vendor/lib/modules/modules.load

          touch "$LOAD"

          while IFS= read -r FILE; do
            MOD="$(basename "$FILE")"

            if ! grep -qxF "$MOD" "$LOAD"; then
              echo "$MOD" >> "$LOAD"
            fi
          done < work/analysis/resolved_security_modules.txt

          sort -u \
            "$LOAD" \
            -o "$LOAD"

      # ============================================================
      # 32. UPDATE DEVICE.MK
      # Keep existing touch definitions.
      # ============================================================
      - name: Update device.mk
        shell: bash
        run: |
          set -euo pipefail

          FRAGMENT='$(LOCAL_PATH)/fbe_vendor_files.mk'

          if ! grep -Fq \
            "$FRAGMENT" \
            device.mk; then

            cat >> device.mk <<'EOF'

          # Stock beryl FBE/KeyMint security stack.
          include $(LOCAL_PATH)/fbe_vendor_files.mk
          EOF

          fi

      # ============================================================
      # 33. UPDATE BOARD CONFIG
      # ============================================================
      - name: Update BoardConfig.mk
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q \
            'BOARD_SEPOLICY_DIRS.*sepolicy/recovery' \
            BoardConfig.mk; then

            cat >> BoardConfig.mk <<'EOF'

          # Recovery FBE security SELinux policy.
          BOARD_SEPOLICY_DIRS += $(DEVICE_PATH)/sepolicy/recovery
          EOF
          fi

      # ============================================================
      # 34. UPDATE FOX CONFIG
      # REMOVE THE CURRENT FBE SKIP FLAG.
      # ============================================================
      - name: Enable OrangeFox FBE
        shell: bash
        run: |
          set -euo pipefail

          sed -i \
            '/^[[:space:]]*OF_SKIP_FBE_DECRYPTION[[:space:]]*[:?+]*=/d' \
            fox_beryl.mk

      # ============================================================
      # 35. GENERATE FBE MODULE MAKE FRAGMENT
      # Existing device.mk module mechanism is preserved.
      # ============================================================
      - name: Generate FBE module configuration
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t MODULES < <(
            cat work/analysis/resolved_security_modules.txt |
            xargs -r -n1 basename |
            sort -u
          )

          {
            echo
            echo "# Stock Beryl FBE security modules."

            printf 'TW_LOAD_VENDOR_MODULES := "'

            FIRST=1

            for MOD in "${MODULES[@]}"; do
              [ -n "$MOD" ] || continue

              if [ "$FIRST" -eq 0 ]; then
                printf ' '
              fi

              printf '%s' "$MOD"

              FIRST=0
            done

            printf '"\n'
            echo "TW_LOAD_VENDOR_BOOT_MODULES := true"
          } > work/integration/fbe_modules_config.mk

          cp \
            work/integration/fbe_modules_config.mk \
            fbe_modules_config.mk

      # ============================================================
      # 36. INCLUDE MODULE FRAGMENT
      # ============================================================
      - name: Include FBE module configuration
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -Fq \
            'fbe_modules_config.mk' \
            device.mk; then

            cat >> device.mk <<'EOF'

          # Stock Beryl FBE/TEE module configuration.
          include $(LOCAL_PATH)/fbe_modules_config.mk
          EOF
          fi

      # ============================================================
      # 37. REMOVE ALL ANALYSIS FROM TREE
      # ============================================================
      - name: Remove analysis from repository area
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work/integration_analysis 2>/dev/null || true

      # ============================================================
      # 38. VERIFY ACTUAL TREE CHANGES
      # ============================================================
      - name: Validate integration
        shell: bash
        run: |
          set -euo pipefail

          echo "===== FILES TO COMMIT ====="

          git status --short -- \
            BoardConfig.mk \
            device.mk \
            fox_beryl.mk \
            fbe_vendor_files.mk \
            fbe_modules_config.mk \
            recovery \
            sepolicy

          echo
          echo "===== VERIFY NO REPORTS IN TREE ====="

          if git ls-files --others --exclude-standard |
             grep -E \
             '^(work/|.*\.(txt|sha256|log))$'; then

            echo "Untracked analysis file detected outside ignored workspace"
            exit 1
          fi

          echo
          echo "===== VERIFY NO UNRELATED Mitee SERVICES ====="

          if find recovery/root/vendor \
            -type f 2>/dev/null |
            grep -Ei \
              'mfidoca|mlipay|mtdservice|tidaservice|vsimapp|soterservice'; then

            echo "Unrelated Mitee service found."
            exit 1
          fi

          echo
          echo "===== VERIFY FBE SKIP REMOVED ====="

          if grep -Rni \
            'OF_SKIP_FBE_DECRYPTION' \
            fox_beryl.mk; then
            echo "FBE skip flag still present."
            exit 1
          fi

          echo
          echo "===== VERIFY ENFORCING SELINUX ====="

          if grep -RniE \
            '^[[:space:]]*permissive|setenforce[[:space:]]+0' \
            sepolicy/recovery; then
            echo "Permissive SELinux rule found."
            exit 1
          fi

      # ============================================================
      # 39. STAGE ONLY REAL TREE FILES
      # ============================================================
      - name: Stage integration
        shell: bash
        run: |
          set -euo pipefail

          git add \
            BoardConfig.mk \
            device.mk \
            fox_beryl.mk \
            fbe_vendor_files.mk \
            fbe_modules_config.mk \
            recovery \
            sepolicy

          echo "===== STAGED ====="
          git diff --cached --name-status

          if git diff --cached --name-only |
             grep -E \
             '(^|/)(.*\.txt|.*\.sha256|.*\.log)$'; then
            echo "Report file is staged."
            exit 1
          fi

      # ============================================================
      # 40. COMMIT DIRECTLY TO MAIN
      # ============================================================
      - name: Commit FBE integration to main
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "beryl: integrate stock FBE decryption stack"

          git push origin HEAD:main

      # ============================================================
      # 41. UPLOAD ANALYSIS ONLY AS ACTION ARTIFACT
      # NEVER COMMIT ANALYSIS
      # ============================================================
      - name: Upload integration analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beryl-fbe-integration-analysis
          path: |
            work/analysis/
            work/logs/
          if-no-files-found: warn
          retention-days: 14
