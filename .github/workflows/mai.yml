name: Beryl FBE Decryption Integration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-fbe:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECKOUT MAIN
      # ============================================================
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # ============================================================
      # 2. INSTALL TOOLS
      # Keep base tool/download logic
      # ============================================================
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            aria2 \
            unzip \
            p7zip-full \
            python3 \
            python3-pip \
            file \
            cpio \
            lz4 \
            e2fsprogs \
            rsync \
            binutils

          python3 -m pip install --upgrade pip
          python3 -m pip install android-payload-dumper==2.3.0

      # ============================================================
      # 3. WORKSPACE
      # ============================================================
      - name: Create workspace
        run: |
          mkdir -p work/{rom,payload,partitions,extracted,rootfs,analysis}
          mkdir -p work/integration
          mkdir -p work/integration/vendor
          mkdir -p work/integration/modules
          mkdir -p work/integration/sepolicy

      # ============================================================
      # 4. STOCK ROM INFO
      # ============================================================
      - name: Set ROM information
        run: |
          echo "ROM_NAME=miui_BERYLINGlobal_OS1.0.4.0.UOQINXM_b51bc03ea2_14.0.zip" >> "$GITHUB_ENV"
          echo "ROM_URL=https://bn.d.miui.com/OS1.0.4.0.UOQINXM/miui_BERYLINGlobal_OS1.0.4.0.UOQINXM_b51bc03ea2_14.0.zip" >> "$GITHUB_ENV"

      # ============================================================
      # 5. CDN BENCHMARK
      # ============================================================
      - name: Benchmark CDN
        run: |
          aria2c \
            --dry-run=true \
            --check-integrity=true \
            --max-connection-per-server=16 \
            --split=16 \
            "$ROM_URL" || true

      # ============================================================
      # 6. DOWNLOAD STOCK ROM
      # ============================================================
      - name: Download stock ROM
        run: |
          aria2c \
            --continue=true \
            --check-integrity=true \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=1M \
            --file-allocation=none \
            --summary-interval=10 \
            --dir=work/rom \
            --out="$ROM_NAME" \
            "$ROM_URL"

      # ============================================================
      # 7. VERIFY ROM
      # ============================================================
      - name: Verify ROM
        run: |
          sha256sum "work/rom/$ROM_NAME" \
            > work/analysis/rom.sha256

          unzip -t "work/rom/$ROM_NAME"

      # ============================================================
      # 8. COMPLETE ZIP EXTRACTION
      # Do not replace with selective extraction
      # ============================================================
      - name: Extract complete ROM
        run: |
          mkdir -p work/rom/extracted

          unzip -q \
            "work/rom/$ROM_NAME" \
            -d work/rom/extracted

      # ============================================================
      # 9. FIND PAYLOAD
      # ============================================================
      - name: Locate payload
        run: |
          PAYLOAD_PATH="$(find work/rom/extracted \
            -type f \
            -name payload.bin \
            -print -quit)"

          if [ -z "$PAYLOAD_PATH" ]; then
            echo "payload.bin not found"
            exit 1
          fi

          cp "$PAYLOAD_PATH" work/payload/payload.bin

          sha256sum work/payload/payload.bin \
            > work/analysis/payload.sha256

      # ============================================================
      # 10. LIST PAYLOAD
      # ============================================================
      - name: List payload partitions
        run: |
          python3 -m payload_dumper \
            work/payload/payload.bin \
            -l \
            > work/analysis/payload_partitions.txt

      # ============================================================
      # 11. EXTRACT PARTITIONS
      # Preserve this list and -j 8
      # ============================================================
      - name: Extract required partitions
        run: |
          python3 -m payload_dumper \
            work/payload/payload.bin \
            -o work/partitions \
            -p \
              vendor \
              vendor_dlkm \
              odm_dlkm \
              system \
              system_ext \
              product \
              init_boot \
              boot \
              dtbo \
              vendor_boot \
              vbmeta \
              vbmeta_system \
              vbmeta_vendor \
            -j 8

      # ============================================================
      # 12. EXTRACT EROFS FILESYSTEMS
      # ============================================================
      - name: Extract EROFS partitions
        shell: bash
        run: |
          set +e

          for p in \
            vendor \
            vendor_dlkm \
            odm_dlkm \
            system \
            system_ext \
            product
          do
            IMG="$PWD/work/partitions/$p.img"
            OUT="$PWD/work/extracted/$p"

            [ -f "$IMG" ] || continue

            mkdir -p "$OUT"

            fsck.erofs \
              --extract="$OUT" \
              "$IMG"

            echo "$p extraction result: $?"
          done

          exit 0

      # ============================================================
      # 13. BUILD SEARCH ROOT
      # ============================================================
      - name: Build stock search root
        run: |
          for p in \
            vendor \
            vendor_dlkm \
            odm_dlkm \
            system \
            system_ext \
            product
          do
            if [ -d "work/extracted/$p" ]; then
              mkdir -p "work/rootfs/$p"

              rsync -a \
                "work/extracted/$p/" \
                "work/rootfs/$p/"
            fi
          done

      # ============================================================
      # 14. LOCATE EXACT DECRYPTION ROOT COMPONENTS
      # ============================================================
      - name: Locate FBE security roots
        shell: bash
        run: |
          ROOT="$PWD/work/rootfs"
          OUT="$PWD/work/analysis/security-roots.txt"

          : > "$OUT"

          find "$ROOT" -type f \
            \( \
              -name 'android.hardware.security.keymint@1.0-service.mitee' \
              -o -name 'android.hardware.gatekeeper@1.0-service.mitee' \
              -o -name 'tee-supplicant' \
              -o -name 'gatekeeper.mitee.so' \
              -o -name 'libkeymint.so' \
              -o -name 'libkeymint_support.so' \
              -o -name 'libkeymaster4support.so' \
              -o -name 'libkeymaster_messages.so' \
              -o -name 'lib_android_keymaster_keymint_utils.so' \
              -o -name 'libmt_mitee.so' \
              -o -name 'libteecli.so' \
              -o -name 'libteeservice_client.trustonic.so' \
              -o -name 'vendor.trustonic.tee@1.0.so' \
              -o -name 'vendor.trustonic.tee@1.1.so' \
              -o -name 'gz_trusty_mod.ko' \
              -o -name 'gz_tz_system.ko' \
            \) \
            -print | sort -u > "$OUT"

          echo "=== SECURITY ROOTS ==="
          cat "$OUT"

      # ============================================================
      # 15. RECURSIVE ELF DEPENDENCY RESOLVER
      #
      # Starts only from actual FBE security components.
      # Does NOT start from every file containing "mitee".
      # ============================================================
      - name: Resolve recursive ELF dependencies
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path
          from collections import deque

          root = Path("work/rootfs").resolve()
          roots_file = Path("work/analysis/security-roots.txt")

          # Libraries supplied by Android/recovery itself should not
          # automatically cause random stock platform copies.
          platform_libs = {
              "libc.so",
              "libm.so",
              "libdl.so",
              "liblog.so",
              "libc++.so",
              "libutils.so",
              "libcutils.so",
              "libbase.so",
              "libz.so",
              "libprocessgroup.so",
              "libselinux.so",
          }

          index = {}

          print("Indexing stock filesystem...")

          for p in root.rglob("*"):
              if p.is_file() or p.is_symlink():
                  index.setdefault(p.name, []).append(p)

          seeds = []

          for line in roots_file.read_text().splitlines():
              line = line.strip()

              if not line:
                  continue

              p = Path(line)

              if p.suffix == ".ko":
                  continue

              if p.exists():
                  seeds.append(p.resolve())

          queue = deque(seeds)
          visited = set()
          resolved = set()
          missing = set()

          def needed(path):
              try:
                  proc = subprocess.run(
                      ["readelf", "-d", str(path)],
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,
                  )
              except Exception:
                  return []

              result = []

              for line in proc.stdout.splitlines():
                  m = re.search(r"Shared library: \[(.+?)\]", line)
                  if m:
                      result.append(m.group(1))

              return result

          while queue:
              f = queue.popleft()

              try:
                  key = str(f.resolve())
              except Exception:
                  key = str(f)

              if key in visited:
                  continue

              visited.add(key)
              resolved.add(f)

              for lib in needed(f):

                  if lib in platform_libs:
                      continue

                  candidates = index.get(lib, [])

                  if not candidates:
                      missing.add((str(f), lib))
                      continue

                  # Prefer vendor, then odm, then system_ext/product/system.
                  def rank(p):
                      s = str(p)

                      if "/vendor/" in s:
                          return 0
                      if "/odm" in s:
                          return 1
                      if "/system_ext/" in s:
                          return 2
                      if "/product/" in s:
                          return 3
                      return 4

                  target = sorted(candidates, key=rank)[0]

                  if str(target.resolve()) not in visited:
                      queue.append(target.resolve())

          with open(
              "work/analysis/resolved-elf-files.txt", "w"
          ) as out:
              for f in sorted(resolved, key=str):
                  out.write(str(f) + "\n")

          with open(
              "work/analysis/missing-elf-dependencies.txt", "w"
          ) as out:
              for parent, lib in sorted(missing):
                  out.write(f"{parent} -> {lib}\n")

          print()
          print("Resolved:", len(resolved))
          print("Missing:", len(missing))
          PY

      # ============================================================
      # 16. COPY RESOLVED ELF COMPONENTS
      # ============================================================
      - name: Copy resolved decryption ELF files
        shell: bash
        run: |
          ROOT="$PWD/work/rootfs"
          DEST="$PWD/work/integration"

          while IFS= read -r FILE; do
            [ -f "$FILE" ] || continue

            REL="${FILE#"$ROOT"/}"

            mkdir -p "$DEST/$(dirname "$REL")"

            cp -a \
              "$FILE" \
              "$DEST/$REL"

          done < work/analysis/resolved-elf-files.txt

      # ============================================================
      # 17. MODULE DEPENDENCY RESOLVER
      #
      # Resolve dependencies for TEE modules through modules.dep.
      # ============================================================
      - name: Resolve TEE kernel modules
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from collections import deque

          root = Path("work/rootfs")

          module_roots = {
              "gz_trusty_mod.ko",
              "gz_tz_system.ko",
          }

          all_modules = {}

          for f in root.rglob("*.ko"):
              all_modules[f.name] = f

          dep_files = list(root.rglob("modules.dep"))

          dependencies = {}

          for depfile in dep_files:
              for line in depfile.read_text(
                  errors="ignore"
              ).splitlines():

                  if ":" not in line:
                      continue

                  module, deps = line.split(":", 1)

                  module_name = Path(module.strip()).name

                  dependencies[module_name] = [
                      Path(x).name
                      for x in deps.split()
                  ]

          queue = deque(module_roots)
          selected = set()

          while queue:
              module = queue.popleft()

              if module in selected:
                  continue

              if module not in all_modules:
                  continue

              selected.add(module)

              for dep in dependencies.get(module, []):
                  if dep not in selected:
                      queue.append(dep)

          with open(
              "work/analysis/resolved-modules.txt", "w"
          ) as out:
              for module in sorted(selected):
                  out.write(str(all_modules[module]) + "\n")

          print("Resolved modules:", len(selected))
          for m in sorted(selected):
              print(m)
          PY

      # ============================================================
      # 18. COPY MODULES
      # ============================================================
      - name: Copy resolved TEE modules
        shell: bash
        run: |
          ROOT="$PWD/work/rootfs"
          DEST="$PWD/work/integration"

          while IFS= read -r FILE; do
            [ -f "$FILE" ] || continue

            REL="${FILE#"$ROOT"/}"

            mkdir -p "$DEST/$(dirname "$REL")"

            cp -a \
              "$FILE" \
              "$DEST/$REL"

          done < work/analysis/resolved-modules.txt

      # ============================================================
      # 19. COPY ONLY EXACT INIT FILES
      #
      # An RC file must reference one of our selected services.
      # ============================================================
      - name: Resolve required init RC files
        shell: bash
        run: |
          ROOT="$PWD/work/rootfs"
          DEST="$PWD/work/integration"

          find "$ROOT" -type f -name '*.rc' -print0 |
          while IFS= read -r -d '' RC; do

            if grep -qiE \
              'android\.hardware\.security\.keymint@1\.0-service\.mitee|android\.hardware\.gatekeeper@1\.0-service\.mitee|tee-supplicant' \
              "$RC"; then

              REL="${RC#"$ROOT"/}"

              mkdir -p "$DEST/$(dirname "$REL")"
              cp -a "$RC" "$DEST/$REL"

              echo "$REL" \
                >> work/analysis/selected-init-files.txt
            fi
          done

      # ============================================================
      # 20. REQUIRED VINTF DECLARATIONS
      # ============================================================
      - name: Resolve VINTF security declarations
        shell: bash
        run: |
          ROOT="$PWD/work/rootfs"
          DEST="$PWD/work/integration"

          find "$ROOT" -type f \
            \( -name '*.xml' -o -name '*manifest*' \) \
            -print0 |
          while IFS= read -r -d '' XML; do

            if grep -qiE \
              'android.hardware.security.keymint|android.hardware.gatekeeper|android.hardware.keymaster' \
              "$XML"; then

              REL="${XML#"$ROOT"/}"

              mkdir -p "$DEST/$(dirname "$REL")"
              cp -a "$XML" "$DEST/$REL"

              echo "$REL" \
                >> work/analysis/selected-vintf-files.txt
            fi
          done

      # ============================================================
      # 21. FIRMWARE / CONFIG DEPENDENCIES
      # ============================================================
      - name: Resolve Mitee and TEE firmware
        shell: bash
        run: |
          ROOT="$PWD/work/rootfs"
          DEST="$PWD/work/integration"

          find "$ROOT" -type f \
            \( \
              -iname '*mitee*' \
              -o -iname '*trustonic*' \
              -o -iname '*keymint*' \
              -o -iname '*keymaster*' \
              -o -iname '*gatekeeper*' \
            \) \
            -path '*/firmware/*' \
            -print0 |
          while IFS= read -r -d '' FILE; do

            REL="${FILE#"$ROOT"/}"

            mkdir -p "$DEST/$(dirname "$REL")"
            cp -a "$FILE" "$DEST/$REL"

          done

      # ============================================================
      # 22. DISCOVER STOCK SELINUX REQUIREMENTS
      #
      # This is INPUT for generated recovery policy.
      # Stock policy itself is NOT dumped into device tree.
      # ============================================================
      - name: Analyze stock security SELinux references
        shell: bash
        run: |
          ROOT="$PWD/work/rootfs"

          grep -RhiE \
            'hal_keymint_default|hal_gatekeeper_default|hal_keymaster_default|mobicore|mobicore_user_device|teei_client_device|tkcore_admin_device|mitee_client_device|mitee_sfs_file|vendor_mtk_mitee_prop|ut_keymaster_device|key_install_data_file' \
            "$ROOT/vendor/etc/selinux" \
            "$ROOT/system/etc/selinux" \
            "$ROOT/system_ext/etc/selinux" \
            "$ROOT/product/etc/selinux" \
            2>/dev/null \
            > work/analysis/stock-security-sepolicy.txt || true

      # ============================================================
      # 23. GENERATE RECOVERY SELINUX POLICY
      #
      # Minimal device-tree policy.
      # We do not blindly copy full stock compiled CIL.
      # ============================================================
      - name: Generate recovery FBE SELinux policy
        shell: bash
        run: |
          POLICY="work/integration/sepolicy"

          mkdir -p "$POLICY"

          cat > "$POLICY/recovery_fbe.te" <<'EOF'
          # Beryl recovery FBE security integration.
          #
          # Keep this policy scoped to recovery's FBE security chain.

          type recovery_fbe_vendor_file, file_type, vendor_file_type;

          # TEE character devices used by the vendor security stack.
          type recovery_mitee_device, dev_type;
          type recovery_mobicore_device, dev_type;
          type recovery_teei_device, dev_type;
          type recovery_tkcore_device, dev_type;

          # Persistent Mitee security storage.
          type recovery_mitee_sfs_file, file_type, data_file_type;

          # Recovery needs to execute vendor security HAL components.
          allow recovery recovery_fbe_vendor_file:dir {
              open
              read
              search
              getattr
          };

          allow recovery recovery_fbe_vendor_file:file {
              open
              read
              getattr
              map
              execute
              execute_no_trans
          };

          # Access required TEE devices.
          allow recovery recovery_mitee_device:chr_file {
              open
              read
              write
              ioctl
              getattr
          };

          allow recovery recovery_mobicore_device:chr_file {
              open
              read
              write
              ioctl
              getattr
          };

          allow recovery recovery_teei_device:chr_file {
              open
              read
              write
              ioctl
              getattr
          };

          allow recovery recovery_tkcore_device:chr_file {
              open
              read
              write
              ioctl
              getattr
          };

          # Mitee secure storage access.
          allow recovery recovery_mitee_sfs_file:dir {
              create
              open
              read
              write
              search
              getattr
              add_name
              remove_name
          };

          allow recovery recovery_mitee_sfs_file:file {
              create
              open
              read
              write
              getattr
              setattr
              unlink
              map
          };
          EOF

          # --------------------------------------------------------
          # File contexts
          # --------------------------------------------------------

          cat > "$POLICY/file_contexts" <<'EOF'
          /vendor/bin/hw/android\.hardware\.security\.keymint@1\.0-service\.mitee    u:object_r:recovery_fbe_vendor_file:s0
          /vendor/bin/hw/android\.hardware\.gatekeeper@1\.0-service\.mitee          u:object_r:recovery_fbe_vendor_file:s0
          /vendor/bin/tee-supplicant                                                u:object_r:recovery_fbe_vendor_file:s0

          /dev/mitee.*                                                              u:object_r:recovery_mitee_device:s0
          /dev/mobicore                                                             u:object_r:recovery_mobicore_device:s0
          /dev/teei.*                                                               u:object_r:recovery_teei_device:s0
          /dev/tkcore.*                                                             u:object_r:recovery_tkcore_device:s0

          /data/vendor/mitee(/.*)?                                                  u:object_r:recovery_mitee_sfs_file:s0
          /metadata/vold(/.*)?                                                      u:object_r:vold_metadata_file:s0
          EOF

          # --------------------------------------------------------
          # Never generate permissive rules.
          # --------------------------------------------------------

          if grep -RniE \
            'permissive[[:space:]]+|setenforce[[:space:]]+0' \
            "$POLICY"; then

            echo "ERROR: permissive SELinux policy detected."
            exit 1
          fi

      # ============================================================
      # 24. DEVICE.MK FRAGMENT
      #
      # Product copy list is generated from ONLY resolved files.
      # ============================================================
      - name: Generate FBE product integration
        shell: bash
        run: |
          OUT="work/integration/fbe-vendor-files.mk"

          cat > "$OUT" <<'EOF'
          # Auto-generated Beryl recovery FBE vendor integration.
          # Only dependency-resolved security components are included.

          PRODUCT_COPY_FILES += \
          EOF

          mapfile -t FILES < <(
            find work/integration/vendor \
              -type f \
              | sort
          )

          TOTAL="${#FILES[@]}"
          INDEX=0

          for FILE in "${FILES[@]}"; do

            INDEX=$((INDEX + 1))

            SRC="${FILE#work/integration/}"
            DEST="$SRC"

            if [ "$INDEX" -eq "$TOTAL" ]; then
              printf '    $(LOCAL_PATH)/%s:%s\n' \
                "$SRC" "$DEST" >> "$OUT"
            else
              printf '    $(LOCAL_PATH)/%s:%s \\\n' \
                "$SRC" "$DEST" >> "$OUT"
            fi
          done

      # ============================================================
      # 25. GENERATE MODULE LIST
      # ============================================================
      - name: Generate recovery module configuration
        shell: bash
        run: |
          mapfile -t MODULES < <(
            find work/integration \
              -type f \
              -name '*.ko' \
              -printf '%f\n' \
              | sort -u
          )

          {
            echo
            echo "# Beryl FBE / TEE modules"

            if [ "${#MODULES[@]}" -gt 0 ]; then

              printf 'TW_LOAD_VENDOR_MODULES := "'

              FIRST=1

              for MOD in "${MODULES[@]}"; do
                if [ "$FIRST" -eq 0 ]; then
                  printf ' '
                fi

                printf '%s' "$MOD"
                FIRST=0
              done

              printf '"\n'

              echo "TW_LOAD_VENDOR_BOOT_MODULES := true"
            fi

          } > work/integration/fbe-modules.mk

      # ============================================================
      # 26. SAFETY CHECK — NO REPORTS INTO TREE
      # ============================================================
      - name: Verify integration contents
        shell: bash
        run: |
          echo "=== FILES THAT WILL ENTER TREE ==="

          find work/integration \
            -type f \
            -printf '%P\n' \
            | sort

          echo
          echo "=== Checking for reports ==="

          if find work/integration \
            -type f \
            \( \
              -name '*.txt' \
              -o -name '*.sha256' \
              -o -name '*.log' \
            \) \
            | grep -q .; then

            echo "ERROR: analysis/report files entered integration."
            exit 1
          fi

      # ============================================================
      # 27. COPY ACTUAL INTEGRATION INTO TREE
      # ============================================================
      - name: Install FBE integration into device tree
        shell: bash
        run: |
          set -e

          # Vendor security files
          if [ -d work/integration/vendor ]; then
            mkdir -p recovery/root/vendor

            rsync -a \
              work/integration/vendor/ \
              recovery/root/vendor/
          fi

          # Recovery SELinux
          mkdir -p sepolicy/recovery

          cp \
            work/integration/sepolicy/recovery_fbe.te \
            sepolicy/recovery/recovery_fbe.te

          cp \
            work/integration/sepolicy/file_contexts \
            sepolicy/recovery/file_contexts

          # Build fragments
          cp \
            work/integration/fbe-vendor-files.mk \
            fbe-vendor-files.mk

          cp \
            work/integration/fbe-modules.mk \
            fbe-modules.mk

      # ============================================================
      # 28. ENSURE BUILD FILES INCLUDE GENERATED FRAGMENTS
      # ============================================================
      - name: Integrate generated makefiles
        shell: bash
        run: |
          DEVICE_MK="device.mk"
          BOARD_CONFIG="BoardConfig.mk"

          if [ -f "$DEVICE_MK" ]; then

            if ! grep -q \
              'fbe-vendor-files.mk' \
              "$DEVICE_MK"; then

              cat >> "$DEVICE_MK" <<'EOF'

          # Beryl FBE decryption
          include $(LOCAL_PATH)/fbe-vendor-files.mk
          EOF
            fi
          fi

          if [ -f "$BOARD_CONFIG" ]; then

            if ! grep -q \
              'sepolicy/recovery' \
              "$BOARD_CONFIG"; then

              cat >> "$BOARD_CONFIG" <<'EOF'

          # Beryl recovery FBE SELinux
          BOARD_SEPOLICY_DIRS += $(DEVICE_PATH)/sepolicy/recovery
          EOF
            fi

            if ! grep -q \
              'fbe-modules.mk' \
              "$BOARD_CONFIG"; then

              cat >> "$BOARD_CONFIG" <<'EOF'

          # Beryl FBE / TEE modules
          include $(DEVICE_PATH)/fbe-modules.mk
          EOF
            fi
          fi

      # ============================================================
      # 29. REMOVE OLD SKIP-DECRYPTION FLAG
      # ============================================================
      - name: Enable OrangeFox FBE support
        shell: bash
        run: |
          grep -RIl \
            'OF_SKIP_FBE_DECRYPTION' \
            . \
            --exclude-dir=.git \
            --exclude-dir=work |
          while IFS= read -r FILE; do

            sed -i \
              '/^[[:space:]]*OF_SKIP_FBE_DECRYPTION[[:space:]]*[:?+]*=/d' \
              "$FILE"

          done || true

      # ============================================================
      # 30. FINAL TREE CHECK
      # ============================================================
      - name: Validate final changes
        shell: bash
        run: |
          echo "=== Git changes ==="
          git status --short

          echo
          echo "=== No analysis files may be committed ==="

          if git status --short |
             grep -E \
             'work/|\.txt$|\.sha256$'; then

            echo "ERROR: analysis output is staged for tree."
            exit 1
          fi

          echo
          echo "=== No unrelated Mitee applications ==="

          if find recovery/root/vendor \
            -type f 2>/dev/null |
            grep -Ei \
            'mfidoca|mlipay|mtdservice|tidaservice|vsimapp|soterservice'; then

            echo "ERROR: unrelated Mitee service was copied."
            exit 1
          fi

          echo
          echo "=== SELinux permissive check ==="

          if grep -RniE \
            'permissive[[:space:]]+|setenforce[[:space:]]+0' \
            sepolicy/recovery; then

            echo "ERROR: permissive policy detected."
            exit 1
          fi

      # ============================================================
      # 31. COMMIT ONLY DEVICE TREE CHANGES
      # ============================================================
      - name: Commit FBE integration to main
        shell: bash
        run: |
          set -e

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Explicitly exclude work/
          git add \
            recovery \
            sepolicy \
            device.mk \
            BoardConfig.mk \
            fbe-vendor-files.mk \
            fbe-modules.mk

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          echo "=== COMMIT CONTENTS ==="
          git diff --cached --name-status

          git commit \
            -m "beryl: integrate stock FBE decryption stack"

          git push origin HEAD:main

      # ============================================================
      # 32. ANALYSIS ARTIFACT
      #
      # Reports are uploaded to Actions only.
      # They NEVER enter the device tree.
      # ============================================================
      - name: Upload dependency analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beryl-fbe-dependency-analysis
          path: |
            work/analysis/
          if-no-files-found: warn
          retention-days: 14
