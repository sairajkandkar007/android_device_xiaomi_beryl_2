name: Build Beryl OrangeFox with Stock FBE Security Stack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ROM_VERSION: OS1.0.4.0.UOQINXM
      ROM_FILENAME: miui_BERYLINGlobal_OS1.0.4.0.UOQINXM_b51bc03ea2_14.0.zip
      ROM_URL: https://bn.d.miui.com/OS1.0.4.0.UOQINXM/miui_BERYLINGlobal_OS1.0.4.0.UOQINXM_b51bc03ea2_14.0.zip

      # Current expected OrangeFox ramdisk root.
      RECOVERY_ROOT: recovery/root

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL REQUIRED TOOLS
      # ============================================================

      - name: Install required tools
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            aria2 \
            e2fsprogs \
            erofs-utils \
            p7zip-full \
            unzip \
            python3-pip \
            lz4

          python3 -m pip install --upgrade pip
          python3 -m pip install android-payload-dumper==2.3.0

          echo "Installed tools:"
          command -v aria2c
          command -v fsck.erofs
          command -v debugfs
          command -v unzip
          command -v lz4
          command -v 7z
          python3 -m payload_dumper --help || true


      # ============================================================
      # 3. CREATE WORKSPACE
      # ============================================================

      - name: Create workspace
        shell: bash
        run: |
          set -e

          rm -rf work

          mkdir -p \
            work/download \
            work/rom \
            work/payload \
            work/partitions \
            work/rootfs \
            work/analysis \
            work/logs

          echo "Workspace created."


      # ============================================================
      # 4. SHOW ROM INFORMATION
      # ============================================================

      - name: Show ROM information
        shell: bash
        run: |
          set -e

          {
            echo "ROM_VERSION: $ROM_VERSION"
            echo "ROM_FILENAME: $ROM_FILENAME"
            echo "ROM_URL: $ROM_URL"
          } | tee work/analysis/ROM_INFO.txt


      # ============================================================
      # 5. BENCHMARK XIAOMI CDN
      # ============================================================

      - name: Benchmark ROM CDN
        shell: bash
        run: |
          set -e

          URL="$ROM_URL"

          echo "Testing ROM URL..."
          echo "$URL"

          START=$(date +%s)

          curl -L \
            --range 0-10485759 \
            --output /dev/null \
            --silent \
            --show-error \
            "$URL"

          END=$(date +%s)

          ELAPSED=$((END - START))

          if [ "$ELAPSED" -lt 1 ]; then
            ELAPSED=1
          fi

          echo "Benchmark completed in ${ELAPSED}s"


      # ============================================================
      # 6. DOWNLOAD ROM
      # ============================================================

      - name: Download stock ROM
        shell: bash
        run: |
          set -e

          aria2c \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=10M \
            --continue=true \
            --allow-overwrite=false \
            --file-allocation=none \
            --console-log-level=notice \
            --dir=work/download \
            --out="$ROM_FILENAME" \
            "$ROM_URL"

          ls -lh "work/download/$ROM_FILENAME"


      # ============================================================
      # 7. VERIFY ROM
      # ============================================================

      - name: Verify downloaded ROM
        shell: bash
        run: |
          set -e

          ROM="work/download/$ROM_FILENAME"

          test -f "$ROM"

          echo "ROM size:"
          stat -c '%s bytes' "$ROM"

          echo
          echo "ROM SHA256:"
          sha256sum "$ROM" | tee work/logs/rom.sha256


      # ============================================================
      # 8. EXTRACT COMPLETE ROM ZIP
      # ============================================================

      - name: Extract complete ROM ZIP
        shell: bash
        run: |
          set -e

          ROM="work/download/$ROM_FILENAME"

          rm -rf work/rom/*
          unzip -q "$ROM" -d work/rom

          echo "ROM contents:"
          find work/rom -maxdepth 3 -type f | sort | head -200


      # ============================================================
      # 9. FIND PAYLOAD.BIN
      # ============================================================

      - name: Find payload.bin
        shell: bash
        run: |
          set -e

          PAYLOAD_FOUND=$(find work/rom -type f -name payload.bin -print -quit)

          if [ -z "$PAYLOAD_FOUND" ]; then
            echo "ERROR: payload.bin was not found in the ROM."
            echo
            echo "ROM files:"
            find work/rom -type f | sort
            exit 1
          fi

          echo "Found payload.bin:"
          echo "$PAYLOAD_FOUND"

          cp "$PAYLOAD_FOUND" work/payload/payload.bin

          echo
          echo "Copied payload:"
          ls -lh work/payload/payload.bin

          sha256sum work/payload/payload.bin \
            | tee work/logs/payload.sha256


      # ============================================================
      # 10. LIST PAYLOAD PARTITIONS
      # ============================================================

      - name: List payload partitions
        shell: bash
        run: |
          set -e

          python3 -m payload_dumper \
            work/payload/payload.bin \
            -l \
            | tee work/logs/payload_partitions.txt


      # ============================================================
      # 11. EXTRACT STOCK PARTITIONS
      #
      # IMPORTANT:
      # This payload logic is unchanged.
      # ============================================================

      - name: Extract stock partitions
        shell: bash
        run: |
          set -e

          python3 -m payload_dumper \
            work/payload/payload.bin \
            -o work/partitions \
            -p \
              vendor \
              vendor_dlkm \
              odm_dlkm \
              system \
              system_ext \
              product \
              init_boot \
              boot \
              dtbo \
              vendor_boot \
              vbmeta \
              vbmeta_system \
              vbmeta_vendor \
            -j 8

          echo
          echo "Extracted partitions:"
          find work/partitions -maxdepth 1 -type f -printf '%f %s bytes\n' \
            | sort \
            | tee work/logs/extracted_partitions.txt


      # ============================================================
      # 12. IDENTIFY FILESYSTEMS
      # ============================================================

      - name: Identify partition filesystems
        shell: bash
        run: |
          set -e

          {
            echo "=== FILESYSTEM IDENTIFICATION ==="
            echo

            for IMG in work/partitions/*.img; do
              [ -f "$IMG" ] || continue

              echo "===== $IMG ====="
              file "$IMG" || true
              echo

              fsck.erofs --print-superblock "$IMG" 2>/dev/null || true
              echo
            done

          } | tee work/logs/filesystems.txt


      # ============================================================
      # 13. EXTRACT EROFS PARTITIONS
      # ============================================================

      - name: Extract EROFS partitions
        shell: bash
        run: |
          set -e

          extract_erofs() {
            local NAME="$1"
            local IMG="work/partitions/${NAME}.img"
            local OUT="work/rootfs/${NAME}"

            if [ ! -f "$IMG" ]; then
              echo "Skipping missing $NAME"
              return 0
            fi

            echo
            echo "========================================"
            echo "Extracting EROFS: $NAME"
            echo "========================================"

            mkdir -p "$OUT"

            fsck.erofs \
              --extract="$PWD/$OUT" \
              "$IMG"
          }

          extract_erofs vendor
          extract_erofs vendor_dlkm
          extract_erofs odm_dlkm
          extract_erofs system
          extract_erofs system_ext
          extract_erofs product

          echo
          echo "EROFS extraction completed."


      # ============================================================
      # 14. CREATE COMBINED ROOTFS VIEW
      # ============================================================

      - name: Create combined rootfs view
        shell: bash
        run: |
          set -e

          ROOT="work/rootfs/combined"

          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          for PART in vendor system system_ext product; do
            if [ -d "work/rootfs/$PART" ]; then
              mkdir -p "$ROOT/$PART"
              cp -a "work/rootfs/$PART/." "$ROOT/$PART/"
            fi
          done

          echo "Combined rootfs created."


      # ============================================================
      # 15. CREATE FBE INTEGRATION STAGING TREE
      # ============================================================

      - name: Create FBE integration staging tree
        shell: bash
        run: |
          set -e

          rm -rf work/recovery_integration

          mkdir -p \
            work/recovery_integration/vendor/bin \
            work/recovery_integration/vendor/bin/hw \
            work/recovery_integration/vendor/lib \
            work/recovery_integration/vendor/lib64 \
            work/recovery_integration/vendor/etc/init \
            work/recovery_integration/vendor/etc/vintf/manifest \
            work/recovery_integration/system/bin \
            work/recovery_integration/system/lib \
            work/recovery_integration/system/lib64 \
            work/recovery_integration/system/etc/init \
            work/recovery_integration/system/etc/vintf/manifest

          : > work/analysis/fbe_integration_manifest.txt
          : > work/logs/fbe_integration_missing.txt


      # ============================================================
      # 16. COLLECT STOCK FBE / KEYMINT / TEE COMPONENTS
      # ============================================================

      - name: Collect stock FBE security components
        shell: bash
        run: |
          set -e

          ROOT="$PWD/work/rootfs"
          STAGE="$PWD/work/recovery_integration"

          copy_if_exists() {
            local REL="$1"
            local SRC="$ROOT/$REL"
            local DST="$STAGE/$REL"

            if [ -f "$SRC" ]; then
              mkdir -p "$(dirname "$DST")"
              cp -a "$SRC" "$DST"

              echo "$REL -> $REL" \
                | tee -a work/analysis/fbe_integration_manifest.txt
            else
              echo "MISSING: $REL" \
                | tee -a work/logs/fbe_integration_missing.txt
            fi
          }

          echo "=== STOCK FBE SECURITY COMPONENTS ===" \
            | tee work/analysis/fbe_integration_manifest.txt

          # TEE
          copy_if_exists vendor/bin/tee-supplicant

          # Mitee KeyMint / Gatekeeper services
          copy_if_exists vendor/bin/hw/android.hardware.security.keymint@1.0-service.mitee
          copy_if_exists vendor/bin/hw/android.hardware.gatekeeper@1.0-service.mitee

          # KeyMint / Keymaster
          copy_if_exists vendor/lib64/libkeymint.so
          copy_if_exists vendor/lib64/libkeymint_support.so
          copy_if_exists vendor/lib64/libkeymaster4support.so
          copy_if_exists vendor/lib64/libkeymaster_messages.so
          copy_if_exists vendor/lib64/lib_android_keymaster_keymint_utils.so

          # Gatekeeper
          copy_if_exists vendor/lib64/hw/gatekeeper.mitee.so

          # Trustonic
          copy_if_exists vendor/lib64/vendor.trustonic.tee@1.0.so
          copy_if_exists vendor/lib64/vendor.trustonic.tee@1.1.so
          copy_if_exists vendor/lib64/libteeservice_client.trustonic.so

          # Mitee libraries identified in the stock analysis
          copy_if_exists vendor/lib64/libteecli.so
          copy_if_exists vendor/lib64/libmt_mitee.so
          copy_if_exists vendor/lib64/libtida_mitee@1.2.so
          copy_if_exists vendor/lib64/libmfido_mitee.so
          copy_if_exists vendor/lib64/libmlipay_mitee.so

          echo
          echo "=== SELECTED COMPONENTS ==="
          cat work/analysis/fbe_integration_manifest.txt

          echo
          echo "=== MISSING COMPONENTS ==="
          cat work/logs/fbe_integration_missing.txt || true


      # ============================================================
      # 17. COLLECT SECURITY INIT FILES
      # ============================================================

      - name: Collect FBE security init files
        shell: bash
        run: |
          set -e

          ROOT="$PWD/work/rootfs"
          STAGE="$PWD/work/recovery_integration"

          : > work/analysis/fbe_init_manifest.txt

          for BASE in \
            "$ROOT/vendor/etc/init" \
            "$ROOT/system/etc/init"; do

            [ -d "$BASE" ] || continue

            find "$BASE" -type f 2>/dev/null \
              | sort \
              | while read -r F; do

                if grep -aEqi \
                  'keymint|keymaster|gatekeeper|tee-supplicant|trustonic|mitee|mobicore|keystore2|vold' \
                  "$F" 2>/dev/null
                then
                  REL="${F#$ROOT/}"
                  DST="$STAGE/$REL"

                  mkdir -p "$(dirname "$DST")"
                  cp -a "$F" "$DST"

                  echo "$REL -> $REL" \
                    | tee -a work/analysis/fbe_init_manifest.txt
                fi

              done

          done

          echo
          echo "=== INIT FILES ==="
          cat work/analysis/fbe_init_manifest.txt || true


      # ============================================================
      # 18. COLLECT VINTF DECLARATIONS
      # ============================================================

      - name: Collect KeyMint Gatekeeper VINTF declarations
        shell: bash
        run: |
          set -e

          ROOT="$PWD/work/rootfs"
          STAGE="$PWD/work/recovery_integration"

          : > work/analysis/fbe_vintf_manifest.txt

          for BASE in \
            "$ROOT/vendor/etc/vintf" \
            "$ROOT/system/etc/vintf"; do

            [ -d "$BASE" ] || continue

            find "$BASE" -type f 2>/dev/null \
              | sort \
              | while read -r F; do

                if grep -aEqi \
                  'keymint|keymaster|gatekeeper|tee|mitee' \
                  "$F" 2>/dev/null
                then
                  REL="${F#$ROOT/}"
                  DST="$STAGE/$REL"

                  mkdir -p "$(dirname "$DST")"
                  cp -a "$F" "$DST"

                  echo "$REL -> $REL" \
                    | tee -a work/analysis/fbe_vintf_manifest.txt
                fi

              done

          done

          echo
          echo "=== VINTF FILES ==="
          cat work/analysis/fbe_vintf_manifest.txt || true


      # ============================================================
      # 19. RESOLVE ELF DEPENDENCIES
      # ============================================================

      - name: Resolve FBE ELF dependencies
        shell: bash
        run: |
          set -e

          ROOT="$PWD/work/rootfs"
          STAGE="$PWD/work/recovery_integration"

          : > work/analysis/fbe_elf_dependency_manifest.txt
          : > work/logs/fbe_missing_elf_dependencies.txt

          find_library() {
            local NAME="$1"

            find \
              "$ROOT/vendor/lib64" \
              "$ROOT/vendor/lib" \
              "$ROOT/system/lib64" \
              "$ROOT/system/lib" \
              "$ROOT/system_ext/lib64" \
              "$ROOT/system_ext/lib" \
              "$ROOT/product/lib64" \
              "$ROOT/product/lib" \
              -type f \
              -name "$NAME" \
              -print -quit \
              2>/dev/null || true
          }

          declare -A SEEN

          resolve_elf() {
            local ELF="$1"

            [ -f "$ELF" ] || return 0

            [ "${SEEN[$ELF]+x}" = x ] && return 0
            SEEN[$ELF]=1

            if ! file "$ELF" 2>/dev/null | grep -qi ELF; then
              return 0
            fi

            readelf -d "$ELF" 2>/dev/null \
              | awk -F'[][]' '/NEEDED/ {print $2}' \
              | sort -u \
              | while read -r DEP; do

                [ -n "$DEP" ] || continue

                FOUND=$(find_library "$DEP")

                if [ -z "$FOUND" ]; then
                  echo "$DEP <- $ELF" \
                    | tee -a work/logs/fbe_missing_elf_dependencies.txt
                  continue
                fi

                REL="${FOUND#$ROOT/}"
                DST="$STAGE/$REL"

                mkdir -p "$(dirname "$DST")"

                if [ ! -f "$DST" ]; then
                  cp -a "$FOUND" "$DST"

                  echo "$REL -> $REL (dependency)" \
                    | tee -a work/analysis/fbe_elf_dependency_manifest.txt
                fi

                resolve_elf "$FOUND"

              done
          }

          find "$STAGE" \
            -type f \
            \( -name '*.so' -o -name '*.so.*' \) \
            -print \
            | while read -r ELF; do
                resolve_elf "$ELF"
              done

          echo
          echo "=== RESOLVED DEPENDENCIES ==="
          cat work/analysis/fbe_elf_dependency_manifest.txt || true

          echo
          echo "=== MISSING DEPENDENCIES ==="
          cat work/logs/fbe_missing_elf_dependencies.txt || true


      # ============================================================
      # 20. VERIFY STAGED ELF FILES
      # ============================================================

      - name: Verify staged security binaries
        shell: bash
        run: |
          set -e

          {
            echo "=== STAGED FBE SECURITY FILES ==="
            echo

            find work/recovery_integration \
              -type f \
              -printf '%p %s bytes\n' \
              | sort

            echo
            echo "=== ELF FILES ==="

            find work/recovery_integration \
              -type f \
              -print \
              | while read -r F; do

                if file "$F" 2>/dev/null | grep -qi ELF; then
                  echo
                  echo "===== $F ====="

                  file "$F" || true

                  readelf -d "$F" 2>/dev/null \
                    | grep -E 'NEEDED|RPATH|RUNPATH' \
                    || true
                fi

              done

          } | tee work/analysis/staged_security_verification.txt


      # ============================================================
      # 21. COLLECT STOCK FBE CONFIGURATION
      #
      # Do NOT blindly overwrite the recovery fstab.
      # ============================================================

      - name: Collect stock FBE configuration
        shell: bash
        run: |
          set -e

          ROOT="$PWD/work/rootfs"

          : > work/analysis/stock_fbe_fstab.txt

          for F in \
            "$ROOT/vendor/etc/fstab.mt6855" \
            "$ROOT/vendor/etc/fstab.emmc"; do

            if [ -f "$F" ]; then
              echo "===== ${F#$ROOT/} =====" \
                | tee -a work/analysis/stock_fbe_fstab.txt

              cat "$F" \
                | tee -a work/analysis/stock_fbe_fstab.txt

              echo \
                | tee -a work/analysis/stock_fbe_fstab.txt
            fi

          done

          echo
          echo "=== STOCK FBE FSTAB ==="
          cat work/analysis/stock_fbe_fstab.txt


      # ============================================================
      # 22. COLLECT SELINUX REFERENCES
      #
      # SELinux policy is NOT blindly copied.
      # ============================================================

      - name: Collect FBE SELinux references
        shell: bash
        run: |
          set -e

          ROOT="$PWD/work/rootfs"

          {
            echo "=== FBE / KEYMINT / TEE SELINUX REFERENCES ==="
            echo

            for BASE in \
              "$ROOT/vendor/etc/selinux" \
              "$ROOT/system/etc/selinux"; do

              [ -d "$BASE" ] || continue

              find "$BASE" \
                -type f \
                2>/dev/null \
                | sort \
                | while read -r F; do

                  if grep -aEqi \
                    'keymint|keymaster|gatekeeper|tee|mitee|mobicore|trustonic|keystore|vold' \
                    "$F" \
                    2>/dev/null
                  then
                    echo
                    echo "===== ${F#$ROOT/} ====="

                    grep -aEi \
                      'keymint|keymaster|gatekeeper|tee|mitee|mobicore|trustonic|keystore|vold' \
                      "$F" \
                      2>/dev/null \
                      || true
                  fi

                done

            done

          } | tee work/analysis/fbe_selinux_references.txt


      # ============================================================
      # 23. VERIFY RECOVERY ROOT
      # ============================================================

      - name: Verify recovery root
        shell: bash
        run: |
          set -e

          DEST="$PWD/$RECOVERY_ROOT"

          echo "Recovery root:"
          echo "$DEST"

          if [ ! -d "$DEST" ]; then
            echo
            echo "ERROR: RECOVERY_ROOT does not exist."
            echo
            echo "Detected recovery/root directories:"
            find . \
              -type d \
              -path '*/recovery/root' \
              -print \
              2>/dev/null \
              | sort || true

            exit 1
          fi


      # ============================================================
      # 24. BACK UP EXISTING FILES THAT WILL BE REPLACED
      # ============================================================

      - name: Backup existing recovery files
        shell: bash
        run: |
          set -e

          SRC="$PWD/work/recovery_integration"
          DEST="$PWD/$RECOVERY_ROOT"

          rm -rf work/recovery_backups
          mkdir -p work/recovery_backups

          while IFS= read -r -d '' F; do

            REL="${F#$SRC/}"
            TARGET="$DEST/$REL"

            if [ -e "$TARGET" ]; then
              BACKUP="work/recovery_backups/$REL"

              mkdir -p "$(dirname "$BACKUP")"
              cp -a "$TARGET" "$BACKUP"

              echo "BACKUP: $REL"
            fi

          done < <(
            find "$SRC" \
              -type f \
              -print0
          )


      # ============================================================
      # 25. COPY STOCK FBE COMPONENTS INTO RECOVERY TREE
      #
      # Existing files are preserved through the backup above.
      # ============================================================

      - name: Integrate stock FBE components
        shell: bash
        run: |
          set -e

          SRC="$PWD/work/recovery_integration"
          DEST="$PWD/$RECOVERY_ROOT"

          echo "Copying selected stock FBE components..."

          cp -a "$SRC/." "$DEST/"

          echo
          echo "Integration completed."


      # ============================================================
      # 26. GENERATE INTEGRATION MANIFEST
      # ============================================================

      - name: Generate recovery integration manifest
        shell: bash
        run: |
          set -e

          {
            echo "============================================================"
            echo "BERYL ORANGEFOX STOCK FBE SECURITY INTEGRATION"
            echo "============================================================"
            echo

            echo "ROM:"
            echo "$ROM_VERSION"
            echo "$ROM_FILENAME"
            echo

            echo "RECOVERY ROOT:"
            echo "$RECOVERY_ROOT"
            echo

            echo "============================================================"
            echo "EXPLICIT STOCK SECURITY COMPONENTS"
            echo "============================================================"

            cat work/analysis/fbe_integration_manifest.txt \
              2>/dev/null || true

            echo
            echo "============================================================"
            echo "INIT FILES"
            echo "============================================================"

            cat work/analysis/fbe_init_manifest.txt \
              2>/dev/null || true

            echo
            echo "============================================================"
            echo "VINTF FILES"
            echo "============================================================"

            cat work/analysis/fbe_vintf_manifest.txt \
              2>/dev/null || true

            echo
            echo "============================================================"
            echo "ELF DEPENDENCIES"
            echo "============================================================"

            cat work/analysis/fbe_elf_dependency_manifest.txt \
              2>/dev/null || true

            echo
            echo "============================================================"
            echo "STOCK FBE FSTAB"
            echo "============================================================"

            cat work/analysis/stock_fbe_fstab.txt \
              2>/dev/null || true

            echo
            echo "============================================================"
            echo "SELINUX REFERENCES"
            echo "============================================================"

            cat work/analysis/fbe_selinux_references.txt \
              2>/dev/null || true

            echo
            echo "============================================================"
            echo "MISSING FILES"
            echo "============================================================"

            cat work/logs/fbe_integration_missing.txt \
              2>/dev/null || true

            echo
            echo "============================================================"
            echo "MISSING ELF DEPENDENCIES"
            echo "============================================================"

            cat work/logs/fbe_missing_elf_dependencies.txt \
              2>/dev/null || true

            echo
            echo "============================================================"
            echo "FINAL INTEGRATION TREE"
            echo "============================================================"

            find work/recovery_integration \
              -type f \
              -printf '%p %s bytes\n' \
              | sort

          } | tee work/analysis/RECOVERY_FBE_INTEGRATION_MANIFEST.txt


      # ============================================================
      # 27. VERIFY NO PARTITION IMAGES ENTERED RECOVERY INTEGRATION
      # ============================================================

      - name: Verify integration tree
        shell: bash
        run: |
          set -e

          echo "Integration tree size:"
          du -sh work/recovery_integration

          echo
          echo "Checking for unwanted partition/payload files..."

          if find work/recovery_integration \
              -type f \
              \( \
                -name '*.img' \
                -o -name 'payload.bin' \
                -o -name '*.zip' \
              \) \
              | grep -q .; then

            echo "ERROR: ROM/payload image found in integration tree."
            exit 1
          fi

          echo "Integration tree verification passed."


      # ============================================================
      # 28. SHOW GIT CHANGES
      #
      # No automatic git commit/push.
      # ============================================================

      - name: Show recovery tree changes
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "GIT STATUS"
          echo "============================================================"

          git status --short

          echo
          echo "============================================================"
          echo "RECOVERY TREE"
          echo "============================================================"

          git status --short -- "$RECOVERY_ROOT" || true


      # ============================================================
      # 29. PACKAGE INTEGRATION REPORTS
      #
      # IMPORTANT:
      # work/partitions is NOT included.
      # ============================================================

      - name: Package integration reports
        shell: bash
        run: |
          set -e

          mkdir -p work/package

          cp -a work/analysis \
            work/package/

          cp -a work/logs \
            work/package/

          cp -a work/recovery_integration \
            work/package/

          echo "Package contents:"
          find work/package \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

          echo
          echo "Package size:"
          du -sh work/package

          tar -czf \
            work/beryl-stock-fbe-recovery-integration.tar.gz \
            -C work/package \
            analysis logs recovery_integration

          echo
          echo "Final archive:"
          ls -lh \
            work/beryl-stock-fbe-recovery-integration.tar.gz


      # ============================================================
      # 30. UPLOAD SMALL INTEGRATION ARTIFACT
      # ============================================================

      - name: Upload FBE integration artifact
        uses: actions/upload-artifact@v4
        with:
          name: beryl-stock-fbe-recovery-integration
          path: |
            work/beryl-stock-fbe-recovery-integration.tar.gz
            work/analysis/
            work/logs/
            work/recovery_integration/
          if-no-files-found: error
          retention-days: 7
