name: Beryl FBE Decryption Integration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-fbe:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT MAIN
      # ============================================================
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ============================================================
      # 2. INSTALL TOOLS
      # ============================================================
      - name: Install tools
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            cpio \
            liblzma-dev \
            wget \
            aria2 \
            unzip \
            e2fsprogs \
            erofs-utils \
            file \
            binutils \
            python3-pip \
            python3-venv \
            git

          python3 -m pip install --upgrade pip
          python3 -m pip install android-payload-dumper==2.3.0

          payload-dumper --version

      # ============================================================
      # 3. CREATE WORKSPACE
      # ============================================================
      - name: Create workspace
        run: |
          set -euo pipefail

          rm -rf work
          mkdir -p work
          mkdir -p work/rom
          mkdir -p work/payload
          mkdir -p work/images
          mkdir -p work/rootfs
          mkdir -p work/rootfs/stock_security
          mkdir -p work/unpacked
          mkdir -p work/security

      # ============================================================
      # 4. STOCK ROM VARIABLES
      # ============================================================
      - name: Set ROM variables
        run: |
          cat > "$GITHUB_ENV" <<'EOF'
          ROM_VERSION=OS1.0.4.0.UOQINXM
          ROM_FILENAME=miui_BERYLINGlobal_OS1.0.4.0.UOQINXM_b51bc03ea2_14.0.zip
          ROM_URL=https://bn.d.miui.com/OS1.0.4.0.UOQINXM/miui_BERYLINGlobal_OS1.0.4.0.UOQINXM_b51bc03ea2_14.0.zip
          EOF

      # ============================================================
      # 5. CDN BENCHMARK
      # ============================================================
      - name: CDN benchmark
        run: |
          set -euo pipefail

          echo "Testing stock ROM CDN..."
          curl -L \
            --range 0-1048575 \
            --silent \
            --show-error \
            --output /dev/null \
            "$ROM_URL" || true

      # ============================================================
      # 6. DOWNLOAD STOCK ROM
      # ============================================================
      - name: Download stock ROM
        run: |
          set -euo pipefail

          aria2c \
            --console-log-level=warn \
            --file-allocation=none \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=10M \
            --dir=work/rom \
            --out="$ROM_FILENAME" \
            "$ROM_URL"

      # ============================================================
      # 7. VERIFY ROM
      # ============================================================
      - name: Verify ROM
        run: |
          set -euo pipefail

          test -f "work/rom/$ROM_FILENAME"
          test -s "work/rom/$ROM_FILENAME"

          unzip -t "work/rom/$ROM_FILENAME" >/dev/null

          echo "ROM verified:"
          ls -lh "work/rom/$ROM_FILENAME"

      # ============================================================
      # 8. EXTRACT COMPLETE ROM ZIP
      # ============================================================
      - name: Extract complete ROM ZIP
        run: |
          set -euo pipefail

          rm -rf work/rom_extracted
          mkdir -p work/rom_extracted

          unzip -q \
            "work/rom/$ROM_FILENAME" \
            -d work/rom_extracted

          find work/rom_extracted \
            -maxdepth 3 \
            -type f \
            -printf '%p\n' \
            | sort \
            > work/rom_file_list.txt

          echo "ROM contents:"
          cat work/rom_file_list.txt

      # ============================================================
      # 9. FIND PAYLOAD
      # ============================================================
      - name: Find payload
        run: |
          set -euo pipefail

          PAYLOAD_PATH="$(find work/rom_extracted -type f -name payload.bin | head -n 1)"

          if [ -z "$PAYLOAD_PATH" ]; then
            echo "payload.bin not found"
            exit 1
          fi

          cp "$PAYLOAD_PATH" work/payload/payload.bin

          echo "PAYLOAD_PATH=work/payload/payload.bin" >> "$GITHUB_ENV"

          ls -lh work/payload/payload.bin

      # ============================================================
      # 10. LIST PAYLOAD
      # ============================================================
      - name: List payload
        run: |
          set -euo pipefail

          payload-dumper \
            "$PAYLOAD_PATH" \
            --list

      # ============================================================
      # 11. EXTRACT EXACT STOCK PARTITIONS
      # ============================================================
      - name: Extract exact stock partitions
        run: |
          set -euo pipefail

          rm -rf work/images/extracted
          mkdir -p work/images/extracted

          payload-dumper \
            "$PAYLOAD_PATH" \
            -o work/images/extracted \
            -p \
              vendor \
              vendor_dlkm \
              odm_dlkm \
              system \
              system_ext \
              product \
              boot \
              dtbo \
              vendor_boot \
              vbmeta \
              vbmeta_system \
              vbmeta_vendor

          echo "Extracted partitions:"
          find work/images/extracted \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

      # ============================================================
      # 12. VERIFY EXTRACTED PARTITIONS
      # ============================================================
      - name: Verify extracted partitions
        run: |
          set -euo pipefail

          required_partitions=(
            vendor
            vendor_dlkm
            odm_dlkm
            system
            system_ext
            product
            boot
            dtbo
            vendor_boot
            vbmeta
            vbmeta_system
            vbmeta_vendor
          )

          for partition in "${required_partitions[@]}"; do
            image="work/images/extracted/${partition}.img"

            if [ ! -f "$image" ]; then
              echo "Missing partition: $image"
              exit 1
            fi

            if [ ! -s "$image" ]; then
              echo "Empty partition: $image"
              exit 1
            fi
          done

          echo "All required partitions extracted successfully."

      # ============================================================
      # 13. IDENTIFY PARTITION FILESYSTEMS
      # ============================================================
      - name: Identify partition filesystems
        run: |
          set -euo pipefail

          for image in work/images/extracted/*.img; do
            echo
            echo "============================================================"
            echo "$image"
            echo "============================================================"

            file "$image" || true
          done

      # ============================================================
      # 14. EXTRACT EROFS PARTITIONS
      # ============================================================
      - name: Extract EROFS partitions
        run: |
          set -euo pipefail

          extract_erofs() {
            local name="$1"
            local image="work/images/extracted/${name}.img"
            local output="work/rootfs/${name}"

            if [ ! -f "$image" ]; then
              return 0
            fi

            rm -rf "$output"
            mkdir -p "$output"

            if file "$image" | grep -qi "EROFS"; then
              echo "Extracting EROFS: $name"
              fsck.erofs --extract="$output" "$image"
            else
              echo "$name is not EROFS; skipping."
            fi
          }

          extract_erofs vendor
          extract_erofs vendor_dlkm
          extract_erofs odm_dlkm
          extract_erofs system
          extract_erofs system_ext
          extract_erofs product

      # ============================================================
      # 15. INSTALL AOSP UNPACK_BOOTIMG
      # ============================================================
      - name: Install AOSP unpack_bootimg.py
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/system/tools/mkbootimg \
            work/mkbootimg

          chmod +x work/mkbootimg/unpack_bootimg.py

      # ============================================================
      # 16. UNPACK BOOT
      # ============================================================
      - name: Unpack boot
        run: |
          set -euo pipefail

          rm -rf work/unpacked/boot
          mkdir -p work/unpacked/boot

          python3 \
            work/mkbootimg/unpack_bootimg.py \
            --boot_img \
            work/images/extracted/boot.img \
            --out \
            work/unpacked/boot

      # ============================================================
      # 17. UNPACK VENDOR_BOOT
      # ============================================================
      - name: Unpack vendor_boot
        run: |
          set -euo pipefail

          rm -rf work/unpacked/vendor_boot
          mkdir -p work/unpacked/vendor_boot

          python3 \
            work/mkbootimg/unpack_bootimg.py \
            --boot_img \
            work/images/extracted/vendor_boot.img \
            --out \
            work/unpacked/vendor_boot

      # ============================================================
      # 18. EXTRACT VENDOR RAMDISK FRAGMENTS
      # ============================================================
      - name: Extract vendor ramdisk fragments
        run: |
          set -euo pipefail

          mkdir -p work/rootfs/vendor_boot

          find work/unpacked/vendor_boot \
            -type f \
            -maxdepth 3 \
            -print \
            | sort

          for ramdisk in \
            work/unpacked/vendor_boot/*ramdisk* \
            work/unpacked/vendor_boot/ramdisk*; do

            if [ -f "$ramdisk" ]; then
              echo "Extracting ramdisk: $ramdisk"

              mkdir -p "work/rootfs/vendor_boot/$(basename "$ramdisk")"

              (
                cd "work/rootfs/vendor_boot/$(basename "$ramdisk")"
                cpio -idmv < "$GITHUB_WORKSPACE/$ramdisk" || true
              )
            fi
          done

      # ============================================================
      # 19. BUILD COMPLETE STOCK SECURITY SEARCH TREE
      # ============================================================
      - name: Build complete stock security search tree
        run: |
          set -euo pipefail

          rm -rf work/rootfs/stock_security
          mkdir -p work/rootfs/stock_security

          copy_tree_if_exists() {
            local source="$1"
            local destination="$2"

            if [ -d "$source" ]; then
              mkdir -p "$destination"
              cp -a "$source"/. "$destination"/
            fi
          }

          copy_tree_if_exists \
            work/rootfs/vendor \
            work/rootfs/stock_security/vendor

          copy_tree_if_exists \
            work/rootfs/vendor_dlkm \
            work/rootfs/stock_security/vendor_dlkm

          copy_tree_if_exists \
            work/rootfs/odm_dlkm \
            work/rootfs/stock_security/odm_dlkm

          copy_tree_if_exists \
            work/rootfs/system \
            work/rootfs/stock_security/system

          copy_tree_if_exists \
            work/rootfs/system_ext \
            work/rootfs/stock_security/system_ext

          copy_tree_if_exists \
            work/rootfs/product \
            work/rootfs/stock_security/product

          copy_tree_if_exists \
            work/rootfs/vendor_boot \
            work/rootfs/stock_security/vendor_boot

          find work/rootfs/stock_security \
            -type f \
            | sort \
            > work/security/complete_stock_security_tree.txt

          wc -l work/security/complete_stock_security_tree.txt

      # ============================================================
      # 20. LOCATE KEYMINT / GATEKEEPER / TEE ROOTS
      # ============================================================
      - name: Locate KeyMint GateKeeper TEE roots
        run: |
          set -euo pipefail

          SECURITY_ROOTS=(
            android.hardware.security.keymint@1.0-service.mitee
            android.hardware.gatekeeper@1.0-service.mitee
            tee-supplicant
          )

          : > work/security/security_roots.txt

          for root in "${SECURITY_ROOTS[@]}"; do
            echo
            echo "============================================================"
            echo "Searching: $root"
            echo "============================================================"

            find work/rootfs/stock_security \
              -type f \
              -name "$root" \
              -print \
              | tee -a work/security/security_roots.txt
          done

          for root in "${SECURITY_ROOTS[@]}"; do
            if ! grep -qE "/${root}$" work/security/security_roots.txt; then
              echo "Required security root not found: $root"
              exit 1
            fi
          done

      # ============================================================
      # 21. LOCATE SECURITY INIT DEFINITIONS
      # ============================================================
      - name: Locate security init definitions
        run: |
          set -euo pipefail

          find work/rootfs/stock_security \
            -type f \
            \( \
              -name '*keymint*.rc' \
              -o -name '*gatekeeper*.rc' \
              -o -name 'tee-supplicant.rc' \
              -o -name '*keymint*.xml' \
            \) \
            -print \
            | sort \
            > work/security/security_init_files.txt

          cat work/security/security_init_files.txt

      # ============================================================
      # 22. BUILD ELF DEPENDENCY CLOSURE
      # ============================================================
      - name: Build security ELF dependency closure
        run: |
          set -euo pipefail

          STOCK_ROOT="$GITHUB_WORKSPACE/work/rootfs/stock_security"
          SECURITY_ROOT="$GITHUB_WORKSPACE/work/security"

          mkdir -p "$SECURITY_ROOT/closure"

          find_elf() {
            local name="$1"

            find "$STOCK_ROOT" \
              -type f \
              -name "$name" \
              | sort \
              | head -n 1
          }

          get_needed() {
            local elf="$1"

            readelf -d "$elf" 2>/dev/null \
              | sed -n 's/.*Shared library: \[\(.*\)\].*/\1/p' \
              | sort -u
          }

          roots=(
            android.hardware.security.keymint@1.0-service.mitee
            android.hardware.gatekeeper@1.0-service.mitee
            tee-supplicant
            gatekeeper.mitee.so
            libteecli.so
            libmt_mitee.so
            libtida_mitee@1.2.so
            libmfido_mitee.so
            libmlipay_mitee.so
            vendor.trustonic.tee@1.0.so
            vendor.trustonic.tee@1.1.so
            libteeservice_client.trustonic.so
            libkeymint.so
            libkeymint_support.so
            lib_android_keymaster_keymint_utils.so
            libkeymaster4support.so
            libkeymaster_messages.so
          )

          : > "$SECURITY_ROOT/closure/roots.txt"
          : > "$SECURITY_ROOT/closure/needed.txt"

          for name in "${roots[@]}"; do
            path="$(find_elf "$name" || true)"

            if [ -n "$path" ]; then
              echo "$path" | tee -a "$SECURITY_ROOT/closure/roots.txt"

              echo
              echo "===== $path ====="

              get_needed "$path" \
                | tee -a "$SECURITY_ROOT/closure/needed.txt"
            fi
          done

          sort -u \
            "$SECURITY_ROOT/closure/needed.txt" \
            -o "$SECURITY_ROOT/closure/needed.txt"

          echo
          echo "Required NEEDED libraries:"
          cat "$SECURITY_ROOT/closure/needed.txt"

      # ============================================================
      # 23. VERIFY REQUIRED STOCK SECURITY FILES
      # ============================================================
      - name: Verify required stock security files
        run: |
          set -euo pipefail

          STOCK_ROOT="$GITHUB_WORKSPACE/work/rootfs/stock_security"

          required_files=(
            "vendor/bin/hw/android.hardware.security.keymint@1.0-service.mitee"
            "vendor/bin/hw/android.hardware.gatekeeper@1.0-service.mitee"
            "vendor/bin/tee-supplicant"

            "vendor/lib64/hw/gatekeeper.mitee.so"

            "vendor/lib64/libteecli.so"
            "vendor/lib64/libmt_mitee.so"
            "vendor/lib64/libtida_mitee@1.2.so"
            "vendor/lib64/libmfido_mitee.so"
            "vendor/lib64/libmlipay_mitee.so"

            "vendor/lib64/vendor.trustonic.tee@1.0.so"
            "vendor/lib64/vendor.trustonic.tee@1.1.so"
            "vendor/lib64/libteeservice_client.trustonic.so"

            "vendor/lib64/libkeymint.so"
            "vendor/lib64/libkeymint_support.so"
            "vendor/lib64/lib_android_keymaster_keymint_utils.so"
            "vendor/lib64/libkeymaster4support.so"
            "vendor/lib64/libkeymaster_messages.so"
          )

          missing=0

          for relative in "${required_files[@]}"; do
            if [ ! -f "$STOCK_ROOT/$relative" ]; then
              echo "MISSING: $relative"
              missing=1
            else
              echo "FOUND:  $relative"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo
            echo "Required stock security files are missing."
            echo "Available matching files:"
            find "$STOCK_ROOT" \
              -type f \
              \( \
                -name '*mitee*' \
                -o -name '*keymint*' \
                -o -name '*gatekeeper*' \
                -o -name '*trustonic*' \
                -o -name 'libteecli.so' \
              \) \
              | sort
            exit 1
          fi

      # ============================================================
      # 24. COPY STOCK FBE SECURITY COMPONENTS
      # ============================================================
      - name: Integrate stock FBE security components
        run: |
          set -euo pipefail

          STOCK="$GITHUB_WORKSPACE/work/rootfs/stock_security"
          RECOVERY="$GITHUB_WORKSPACE/recovery/root"

          mkdir -p "$RECOVERY/vendor/bin"
          mkdir -p "$RECOVERY/vendor/bin/hw"
          mkdir -p "$RECOVERY/vendor/lib64"
          mkdir -p "$RECOVERY/vendor/lib64/hw"
          mkdir -p "$RECOVERY/vendor/etc/init"
          mkdir -p "$RECOVERY/vendor/etc/vintf"

          copy_required() {
            local relative="$1"

            if [ ! -f "$STOCK/$relative" ]; then
              echo "Missing stock file: $relative"
              exit 1
            fi

            mkdir -p "$RECOVERY/$(dirname "$relative")"
            cp -f "$STOCK/$relative" "$RECOVERY/$relative"

            echo "Installed: $relative"
          }

          copy_required \
            vendor/bin/hw/android.hardware.security.keymint@1.0-service.mitee

          copy_required \
            vendor/bin/hw/android.hardware.gatekeeper@1.0-service.mitee

          copy_required \
            vendor/bin/tee-supplicant

          copy_required \
            vendor/lib64/hw/gatekeeper.mitee.so

          copy_required \
            vendor/lib64/libteecli.so

          copy_required \
            vendor/lib64/libmt_mitee.so

          copy_required \
            vendor/lib64/libtida_mitee@1.2.so

          copy_required \
            vendor/lib64/libmfido_mitee.so

          copy_required \
            vendor/lib64/libmlipay_mitee.so

          copy_required \
            vendor/lib64/vendor.trustonic.tee@1.0.so

          copy_required \
            vendor/lib64/vendor.trustonic.tee@1.1.so

          copy_required \
            vendor/lib64/libteeservice_client.trustonic.so

          copy_required \
            vendor/lib64/libkeymint.so

          copy_required \
            vendor/lib64/libkeymint_support.so

          copy_required \
            vendor/lib64/lib_android_keymaster_keymint_utils.so

          copy_required \
            vendor/lib64/libkeymaster4support.so

          copy_required \
            vendor/lib64/libkeymaster_messages.so

      # ============================================================
      # 25. COPY STOCK SECURITY INIT / VINTF FILES
      # ============================================================
      - name: Integrate stock security init and VINTF
        run: |
          set -euo pipefail

          STOCK="$GITHUB_WORKSPACE/work/rootfs/stock_security"
          RECOVERY="$GITHUB_WORKSPACE/recovery/root"

          mkdir -p "$RECOVERY/vendor/etc/init"
          mkdir -p "$RECOVERY/vendor/etc/vintf"

          copy_if_found() {
            local filename="$1"

            local found
            found="$(find "$STOCK/vendor/etc" \
              -type f \
              -name "$filename" \
              | sort \
              | head -n 1 || true)"

            if [ -n "$found" ]; then
              cp -f "$found" "$RECOVERY/vendor/etc/$(basename "$(dirname "$found")")/"
              echo "Copied: $found"
            fi
          }

          # KeyMint
          for file in \
            android.hardware.security.keymint-service.mitee.rc \
            android.hardware.security.keymint@1.0-service.mitee.rc; do

            found="$(find "$STOCK/vendor/etc/init" \
              -type f \
              -name "$file" \
              | head -n 1 || true)"

            if [ -n "$found" ]; then
              cp -f "$found" "$RECOVERY/vendor/etc/init/$file"
              echo "Copied KeyMint init: $file"
            fi
          done

          # GateKeeper
          for file in \
            android.hardware.gatekeeper@1.0-service.mitee.rc \
            android.hardware.gatekeeper@1.0-service.rc; do

            found="$(find "$STOCK/vendor/etc/init" \
              -type f \
              -name "$file" \
              | head -n 1 || true)"

            if [ -n "$found" ]; then
              cp -f "$found" "$RECOVERY/vendor/etc/init/$file"
              echo "Copied GateKeeper init: $file"
            fi
          done

          # TEE
          found="$(find "$STOCK/vendor/etc/init" \
            -type f \
            -name 'tee-supplicant.rc' \
            | head -n 1 || true)"

          if [ -n "$found" ]; then
            cp -f "$found" \
              "$RECOVERY/vendor/etc/init/tee-supplicant.rc"
          fi

          # KeyMint VINTF
          for file in \
            android.hardware.security.keymint-service.mitee.xml \
            android.hardware.security.keymint.xml; do

            found="$(find "$STOCK/vendor/etc/vintf" \
              -type f \
              -name "$file" \
              | head -n 1 || true)"

            if [ -n "$found" ]; then
              cp -f "$found" \
                "$RECOVERY/vendor/etc/vintf/$file"
              echo "Copied VINTF: $file"
            fi
          done

      # ============================================================
      # 26. FIX GATEKEEPER SERVICE
      # ============================================================
      - name: Fix GateKeeper service
        run: |
          set -euo pipefail

          RC="$GITHUB_WORKSPACE/recovery/root/vendor/etc/init/android.hardware.gatekeeper@1.0-service.rc"

          if [ -f "$RC" ]; then
            sed -i \
              's#android.hardware.gatekeeper@1.0-service#android.hardware.gatekeeper@1.0-service.mitee#g' \
              "$RC"
          fi

          MITEERC="$GITHUB_WORKSPACE/recovery/root/vendor/etc/init/android.hardware.gatekeeper@1.0-service.mitee.rc"

          if [ -f "$MITEERC" ]; then
            sed -i \
              's#android.hardware.gatekeeper@1.0-service[^[:space:]]*#android.hardware.gatekeeper@1.0-service.mitee#g' \
              "$MITEERC"
          fi

          echo "GateKeeper init files:"
          grep -Rni \
            "gatekeeper" \
            "$GITHUB_WORKSPACE/recovery/root/vendor/etc/init" \
            || true

      # ============================================================
      # 27. APPLY STOCK FBE FSTAB CONFIGURATION
      # ============================================================
      - name: Apply stock FBE fstab configuration
        run: |
          set -euo pipefail

          FSTAB="$GITHUB_WORKSPACE/recovery/root/etc/recovery.fstab"

          if [ ! -f "$FSTAB" ]; then
            echo "recovery.fstab not found: $FSTAB"
            exit 1
          fi

          cp "$FSTAB" "$FSTAB.before-fbe"

          python3 - "$FSTAB" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              lines = f.readlines()

          output = []

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("/data "):
                  continue

              if stripped.startswith("/metadata "):
                  continue

              output.append(line)

          output.append(
              "/metadata ext4 /dev/block/by-name/metadata "
              "noatime,nosuid,nodev,discard,wait,check,formattable,first_stage_mount\n"
          )

          output.append(
              "/data f2fs /dev/block/by-name/userdata "
              "flags=display=data,inlinecrypt,"
              "fileencryption=aes-256-xts:aes-256-cts:v2+inlinecrypt_optimized,"
              "keydirectory=/metadata/vold/metadata_encryption,"
              "gc_merge,atgc,age_extent_cache,noatime,nosuid,nodev,discard,"
              "noflush_merge,fsync_mode=nobarrier,reserve_root=134217,"
              "resgid=1065,wait,check,formattable,quota,latemount,resize,"
              "reservedsize=128m,checkpoint=fs,fsverity\n"
          )

          with open(path, "w", encoding="utf-8") as f:
              f.writelines(output)
          PY

          echo
          echo "Updated recovery.fstab:"
          cat "$FSTAB"

      # ============================================================
      # 28. VERIFY FBE FSTAB
      # ============================================================
      - name: Verify FBE fstab
        run: |
          set -euo pipefail

          FSTAB="$GITHUB_WORKSPACE/recovery/root/etc/recovery.fstab"

          grep -q '^/metadata ' "$FSTAB"
          grep -q '^/data ' "$FSTAB"

          grep -q 'inlinecrypt' "$FSTAB"
          grep -q 'fileencryption=aes-256-xts:aes-256-cts:v2+inlinecrypt_optimized' "$FSTAB"
          grep -q 'keydirectory=/metadata/vold/metadata_encryption' "$FSTAB"

          echo "FBE fstab configuration verified."

      # ============================================================
      # 29. VERIFY SECURITY BINARIES
      # ============================================================
      - name: Verify integrated security binaries
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/recovery/root"

          binaries=(
            vendor/bin/hw/android.hardware.security.keymint@1.0-service.mitee
            vendor/bin/hw/android.hardware.gatekeeper@1.0-service.mitee
            vendor/bin/tee-supplicant
            vendor/lib64/hw/gatekeeper.mitee.so
            vendor/lib64/libteecli.so
            vendor/lib64/libmt_mitee.so
            vendor/lib64/libtida_mitee@1.2.so
            vendor/lib64/libmfido_mitee.so
            vendor/lib64/libmlipay_mitee.so
            vendor/lib64/vendor.trustonic.tee@1.0.so
            vendor/lib64/vendor.trustonic.tee@1.1.so
            vendor/lib64/libteeservice_client.trustonic.so
            vendor/lib64/libkeymint.so
            vendor/lib64/libkeymint_support.so
            vendor/lib64/lib_android_keymaster_keymint_utils.so
            vendor/lib64/libkeymaster4support.so
            vendor/lib64/libkeymaster_messages.so
          )

          for relative in "${binaries[@]}"; do
            path="$ROOT/$relative"

            test -f "$path"

            echo
            echo "============================================================"
            echo "$relative"
            echo "============================================================"

            file "$path"

            readelf -h "$path" >/dev/null
          done

      # ============================================================
      # 30. VERIFY REQUIRED ELF DEPENDENCIES
      # ============================================================
      - name: Verify integrated ELF dependencies
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/recovery/root"

          roots=(
            "$ROOT/vendor/bin/hw/android.hardware.security.keymint@1.0-service.mitee"
            "$ROOT/vendor/bin/hw/android.hardware.gatekeeper@1.0-service.mitee"
            "$ROOT/vendor/bin/tee-supplicant"
            "$ROOT/vendor/lib64/hw/gatekeeper.mitee.so"
          )

          missing=0

          for root in "${roots[@]}"; do
            echo
            echo "============================================================"
            echo "Checking dependencies:"
            echo "$root"
            echo "============================================================"

            while IFS= read -r lib; do
              [ -z "$lib" ] && continue

              if find "$ROOT/vendor" \
                -type f \
                -name "$lib" \
                | grep -q .; then

                echo "FOUND: $lib"

              elif find "$ROOT/system" \
                -type f \
                -name "$lib" \
                | grep -q .; then

                echo "FOUND system: $lib"

              elif find "$ROOT/system_ext" \
                -type f \
                -name "$lib" \
                | grep -q .; then

                echo "FOUND system_ext: $lib"

              elif find "$ROOT/apex" \
                -type f \
                -name "$lib" \
                | grep -q .; then

                echo "FOUND apex: $lib"

              else
                echo "MISSING: $lib"
                missing=1
              fi

            done < <(
              readelf -d "$root" 2>/dev/null \
                | sed -n 's/.*Shared library: \[\(.*\)\].*/\1/p' \
                | sort -u
            )
          done

          if [ "$missing" -ne 0 ]; then
            echo
            echo "One or more direct ELF dependencies are missing."
            exit 1
          fi

      # ============================================================
      # 31. VERIFY NO INIT_BOOT WAS ADDED
      # ============================================================
      - name: Verify Android 14 Beryl partition handling
        run: |
          set -euo pipefail

          if find recovery/root -type f \
            \( \
              -name 'init_boot.img' \
              -o -name '*init_boot*' \
            \) \
            | grep -q .; then

            echo "Unexpected init_boot files detected."
            find recovery/root -type f \
              \( \
                -name 'init_boot.img' \
                -o -name '*init_boot*' \
              \)
            exit 1
          fi

          echo "No init_boot integration was added."

      # ============================================================
      # 32. VERIFY NO ODM PARTITION WAS ADDED
      # ============================================================
      - name: Verify Beryl partition layout
        run: |
          set -euo pipefail

          if grep -RniE \
            '/dev/block/by-name/odm([^_a-zA-Z]|$)' \
            recovery/root \
            BoardConfig.mk \
            device.mk \
            2>/dev/null; then

            echo "Unexpected separate ODM partition reference detected."
            exit 1
          fi

          echo "No separate ODM partition reference detected."

      # ============================================================
      # 33. SHOW FINAL SECURITY TREE
      # ============================================================
      - name: Show final security tree
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "FINAL KEYMINT / GATEKEEPER / TEE TREE"
          echo "============================================================"

          find recovery/root/vendor \
            -type f \
            \( \
              -iname '*keymint*' \
              -o -iname '*gatekeeper*' \
              -o -iname '*mitee*' \
              -iname '*tee*' \
              -o -iname '*trustonic*' \
            \) \
            | sort

      # ============================================================
      # 34. SHOW GIT DIFF
      # ============================================================
      - name: Show git diff
        run: |
          set -euo pipefail

          git status --short

          echo
          echo "============================================================"
          echo "DIFF STAT"
          echo "============================================================"

          git diff --stat

          echo
          echo "============================================================"
          echo "DIFF"
          echo "============================================================"

          git diff -- \
            BoardConfig.mk \
            device.mk \
            recovery.fstab \
            recovery/root

      # ============================================================
      # 35. COMMIT AND PUSH DIRECTLY TO MAIN
      # ============================================================
      - name: Commit FBE integration to main
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            BoardConfig.mk \
            device.mk \
            recovery.fstab \
            recovery/root

          if git diff --cached --quiet; then
            echo "No changes were produced."
            exit 1
          fi

          echo
          echo "============================================================"
          echo "STAGED CHANGES"
          echo "============================================================"

          git status --short

          git commit \
            -m "beryl: integrate stock FBE KeyMint and GateKeeper"

          git push origin HEAD:main

      # ============================================================
      # 36. VERIFY MAIN PUSH
      # ============================================================
      - name: Verify main branch
        run: |
          set -euo pipefail

          git fetch origin main

          LOCAL="$(git rev-parse HEAD)"
          REMOTE="$(git rev-parse origin/main)"

          echo "Local : $LOCAL"
          echo "Remote: $REMOTE"

          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "main was not updated to the workflow commit."
            exit 1
          fi

          echo
          echo "FBE integration successfully committed and pushed to main."
