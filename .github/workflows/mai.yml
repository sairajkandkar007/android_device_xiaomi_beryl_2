name: Beryl FBE Decryption Integration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-fbe:
    runs-on: ubuntu-latest

    steps:

      # 1. CHECKOUT MAIN
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 2. INSTALL TOOLS
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cpio \
            liblzma-dev \
            wget \
            aria2 \
            unzip \
            e2fsprogs \
            erofs-utils \
            file \
            binutils \
            python3-pip \
            python3-venv \
            git

          python3 -m pip install --upgrade pip
          python3 -m pip install android-payload-dumper==2.3.0
          payload-dumper --version

      # 3. CREATE WORKSPACE
      - name: Create workspace
        run: |
          set -euo pipefail

          rm -rf work

          mkdir -p \
            work/rom \
            work/payload \
            work/images \
            work/images/extracted \
            work/rootfs \
            work/rootfs/stock_security \
            work/unpacked \
            work/security

      # 4. STOCK ROM VARIABLES
      - name: Set ROM variables
        run: |
          cat > "$GITHUB_ENV" <<'EOF'
          ROM_VERSION=OS1.0.4.0.UOQINXM
          ROM_FILENAME=miui_BERYLINGlobal_OS1.0.4.0.UOQINXM_b51bc03ea2_14.0.zip
          ROM_URL=https://bn.d.miui.com/OS1.0.4.0.UOQINXM/miui_BERYLINGlobal_OS1.0.4.0.UOQINXM_b51bc03ea2_14.0.zip
          EOF

      # 5. CDN BENCHMARK
      - name: CDN benchmark
        run: |
          set -euo pipefail

          curl \
            -L \
            --range 0-1048575 \
            --silent \
            --show-error \
            --output /dev/null \
            "$ROM_URL" || true

      # 6. DOWNLOAD STOCK ROM
      - name: Download stock ROM
        run: |
          set -euo pipefail

          aria2c \
            --console-log-level=warn \
            --file-allocation=none \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=10M \
            --dir=work/rom \
            --out="$ROM_FILENAME" \
            "$ROM_URL"

      # 7. VERIFY ROM
      - name: Verify ROM
        run: |
          set -euo pipefail

          test -f "work/rom/$ROM_FILENAME"
          test -s "work/rom/$ROM_FILENAME"

          unzip -t \
            "work/rom/$ROM_FILENAME" \
            >/dev/null

          echo "ROM verified:"
          ls -lh "work/rom/$ROM_FILENAME"

      # 8. EXTRACT COMPLETE ROM ZIP
      - name: Extract complete ROM ZIP
        run: |
          set -euo pipefail

          rm -rf work/rom_extracted
          mkdir -p work/rom_extracted

          unzip -q \
            "work/rom/$ROM_FILENAME" \
            -d work/rom_extracted

          find work/rom_extracted \
            -maxdepth 3 \
            -type f \
            -printf '%p\n' \
            | sort \
            > work/rom_file_list.txt

          echo "ROM contents:"
          cat work/rom_file_list.txt

      # 9. FIND PAYLOAD
      - name: Find payload
        run: |
          set -euo pipefail

          PAYLOAD_PATH="$(
            find work/rom_extracted \
              -type f \
              -name payload.bin \
              | head -n 1
          )"

          if [ -z "$PAYLOAD_PATH" ]; then
            echo "payload.bin not found"
            exit 1
          fi

          cp \
            "$PAYLOAD_PATH" \
            work/payload/payload.bin

          echo "PAYLOAD_PATH=work/payload/payload.bin" >> "$GITHUB_ENV"

          ls -lh work/payload/payload.bin

      # 10. LIST PAYLOAD
      - name: List payload
        run: |
          set -euo pipefail

          payload-dumper \
            "$PAYLOAD_PATH" \
            --list

      # 11. EXTRACT EXACT STOCK PARTITIONS
      - name: Extract exact stock partitions
        run: |
          set -euo pipefail

          payload-dumper \
            "$PAYLOAD_PATH" \
            -o work/images/extracted \
            -p \
              vendor \
              vendor_dlkm \
              odm_dlkm \
              system \
              system_ext \
              product \
              boot \
              dtbo \
              vendor_boot \
              vbmeta \
              vbmeta_system \
              vbmeta_vendor

          echo "Extracted partitions:"

          find work/images/extracted \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

      # 12. VERIFY EXTRACTED PARTITIONS
      - name: Verify extracted partitions
        run: |
          set -euo pipefail

          required_partitions=(
            vendor
            vendor_dlkm
            odm_dlkm
            system
            system_ext
            product
            boot
            dtbo
            vendor_boot
            vbmeta
            vbmeta_system
            vbmeta_vendor
          )

          for partition in "${required_partitions[@]}"; do
            image="work/images/extracted/${partition}.img"

            if [ ! -f "$image" ]; then
              echo "Missing partition: $image"
              exit 1
            fi

            if [ ! -s "$image" ]; then
              echo "Empty partition: $image"
              exit 1
            fi
          done

          echo "All required partitions extracted successfully."

      # 13. IDENTIFY PARTITION FILESYSTEMS
      - name: Identify partition filesystems
        run: |
          set -euo pipefail

          for image in work/images/extracted/*.img; do
            echo
            echo "============================================================"
            echo "$image"
            echo "============================================================"
            file "$image" || true
          done

      # 14. EXTRACT EROFS PARTITIONS
      - name: Extract EROFS partitions
        run: |
          set -euo pipefail

          extract_erofs() {
            local name="$1"
            local image="work/images/extracted/${name}.img"
            local output="work/rootfs/${name}"

            if [ ! -f "$image" ]; then
              return 0
            fi

            rm -rf "$output"
            mkdir -p "$output"

            if file "$image" | grep -qi "EROFS"; then
              echo "Extracting EROFS: $name"

              fsck.erofs \
                --extract="$output" \
                "$image"
            else
              echo "$name is not EROFS; skipping."
            fi
          }

          extract_erofs vendor
          extract_erofs vendor_dlkm
          extract_erofs odm_dlkm
          extract_erofs system
          extract_erofs system_ext
          extract_erofs product

      # 15. INSTALL AOSP UNPACK_BOOTIMG
      - name: Install AOSP unpack_bootimg.py
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            https://android.googlesource.com/platform/system/tools/mkbootimg \
            work/mkbootimg

          chmod +x \
            work/mkbootimg/unpack_bootimg.py

      # 16. UNPACK BOOT
      - name: Unpack boot
        run: |
          set -euo pipefail

          rm -rf work/unpacked/boot
          mkdir -p work/unpacked/boot

          python3 \
            work/mkbootimg/unpack_bootimg.py \
            --boot_img \
            work/images/extracted/boot.img \
            --out \
            work/unpacked/boot

      # 17. UNPACK VENDOR_BOOT
      - name: Unpack vendor_boot
        run: |
          set -euo pipefail

          rm -rf work/unpacked/vendor_boot
          mkdir -p work/unpacked/vendor_boot

          python3 \
            work/mkbootimg/unpack_bootimg.py \
            --boot_img \
            work/images/extracted/vendor_boot.img \
            --out \
            work/unpacked/vendor_boot

      # 18. EXTRACT VENDOR RAMDISK FRAGMENTS
      - name: Extract vendor ramdisk fragments
        run: |
          set -euo pipefail

          mkdir -p work/rootfs/vendor_boot

          find work/unpacked/vendor_boot \
            -maxdepth 3 \
            -type f \
            -print \
            | sort

          while IFS= read -r ramdisk; do
            [ -f "$ramdisk" ] || continue

            name="$(basename "$ramdisk")"
            output="work/rootfs/vendor_boot/$name"

            echo "Extracting ramdisk:"
            echo "$ramdisk"

            mkdir -p "$output"

            (
              cd "$output"
              cpio -idmu < "$GITHUB_WORKSPACE/$ramdisk" || true
            )

          done < <(
            find work/unpacked/vendor_boot \
              -type f \
              \( \
                -name '*ramdisk*' \
                -o -name 'ramdisk*' \
              \) \
              | sort
          )

      # 19. BUILD COMPLETE STOCK SECURITY SEARCH TREE
      - name: Build complete stock security search tree
        run: |
          set -euo pipefail

          rm -rf work/rootfs/stock_security
          mkdir -p work/rootfs/stock_security

          copy_tree_if_exists() {
            local source="$1"
            local destination="$2"

            if [ -d "$source" ]; then
              mkdir -p "$destination"
              cp -a "$source"/. "$destination"/
            fi
          }

          copy_tree_if_exists \
            work/rootfs/vendor \
            work/rootfs/stock_security/vendor

          copy_tree_if_exists \
            work/rootfs/vendor_dlkm \
            work/rootfs/stock_security/vendor_dlkm

          copy_tree_if_exists \
            work/rootfs/odm_dlkm \
            work/rootfs/stock_security/odm_dlkm

          copy_tree_if_exists \
            work/rootfs/system \
            work/rootfs/stock_security/system

          copy_tree_if_exists \
            work/rootfs/system_ext \
            work/rootfs/stock_security/system_ext

          copy_tree_if_exists \
            work/rootfs/product \
            work/rootfs/stock_security/product

          copy_tree_if_exists \
            work/rootfs/vendor_boot \
            work/rootfs/stock_security/vendor_boot

          find work/rootfs/stock_security \
            -type f \
            | sort \
            > work/security/complete_stock_security_tree.txt

          echo "Stock security tree:"
          wc -l \
            work/security/complete_stock_security_tree.txt

      # 20. LOCATE KEYMINT / GATEKEEPER / TEE ROOTS
      - name: Locate KeyMint GateKeeper TEE roots
        run: |
          set -euo pipefail

          STOCK_ROOT="$GITHUB_WORKSPACE/work/rootfs/stock_security"

          mkdir -p work/security

          echo "============================================================"
          echo "KEYMINT FILES"
          echo "============================================================"

          find "$STOCK_ROOT" \
            -type f \
            \( \
              -name '*keymint*' \
              -o -name '*KeyMint*' \
            \) \
            -print \
            | sort \
            | tee work/security/keymint_files.txt

          echo
          echo "============================================================"
          echo "GATEKEEPER FILES"
          echo "============================================================"

          find "$STOCK_ROOT" \
            -type f \
            \( \
              -name '*gatekeeper*' \
              -o -name '*GateKeeper*' \
            \) \
            -print \
            | sort \
            | tee work/security/gatekeeper_files.txt

          echo
          echo "============================================================"
          echo "TEE FILES"
          echo "============================================================"

          find "$STOCK_ROOT" \
            -type f \
            \( \
              -name '*tee*' \
              -o -name '*TEE*' \
              -o -name '*trustonic*' \
            \) \
            -print \
            | sort \
            | tee work/security/tee_files.txt

          echo
          echo "============================================================"
          echo "GATEKEEPER SERVICE CANDIDATES"
          echo "============================================================"

          find "$STOCK_ROOT" \
            -type f \
            \( \
              -name 'android.hardware.gatekeeper@1.0-service' \
              -o -name 'android.hardware.gatekeeper@1.0-service.mitee' \
              -o -name '*gatekeeper*service*' \
            \) \
            -print \
            | sort \
            | tee work/security/gatekeeper_service_candidates.txt

          echo
          echo "============================================================"
          echo "GATEKEEPER INIT REFERENCES"
          echo "============================================================"

          grep -RniE \
            'gatekeeper|android\.hardware\.gatekeeper' \
            "$STOCK_ROOT/vendor/etc/init" \
            "$STOCK_ROOT/vendor/etc/vintf" \
            2>/dev/null \
            | tee work/security/gatekeeper_init_references.txt \
            || true

          echo
          echo "============================================================"
          echo "REQUIRED ROOT CHECK"
          echo "============================================================"

          KEYMINT_SERVICE="$(
            find "$STOCK_ROOT" \
              -type f \
              -name 'android.hardware.security.keymint@1.0-service.mitee' \
              | sort \
              | head -n 1
          )"

          TEE_SUPPLICANT="$(
            find "$STOCK_ROOT" \
              -type f \
              -name 'tee-supplicant' \
              | sort \
              | head -n 1
          )"

          GATEKEEPER_SERVICE="$(
            find "$STOCK_ROOT" \
              -type f \
              \( \
                -name 'android.hardware.gatekeeper@1.0-service.mitee' \
                -o -name 'android.hardware.gatekeeper@1.0-service' \
                -o -name '*gatekeeper*service*' \
              \) \
              | sort \
              | head -n 1
          )"

          if [ -z "$KEYMINT_SERVICE" ]; then
            echo "ERROR: KeyMint Mitee service not found."
            exit 1
          fi

          if [ -z "$TEE_SUPPLICANT" ]; then
            echo "ERROR: tee-supplicant not found."
            exit 1
          fi

          if [ -z "$GATEKEEPER_SERVICE" ]; then
            echo "ERROR: GateKeeper service executable not found."
            cat work/security/gatekeeper_files.txt || true
            exit 1
          fi

          echo "$KEYMINT_SERVICE" \
            > work/security/selected_keymint_service.txt

          echo "$GATEKEEPER_SERVICE" \
            > work/security/selected_gatekeeper_service.txt

          echo "$TEE_SUPPLICANT" \
            > work/security/selected_tee_supplicant.txt

          echo
          echo "Selected KeyMint:"
          cat work/security/selected_keymint_service.txt

          echo
          echo "Selected GateKeeper:"
          cat work/security/selected_gatekeeper_service.txt

          echo
          echo "Selected TEE supplicant:"
          cat work/security/selected_tee_supplicant.txt

      # 21. LOCATE SECURITY INIT DEFINITIONS
      - name: Locate security init definitions
        run: |
          set -euo pipefail

          find work/rootfs/stock_security \
            -type f \
            \( \
              -name '*keymint*.rc' \
              -o -name '*gatekeeper*.rc' \
              -o -name 'tee-supplicant.rc' \
              -o -name '*keymint*.xml' \
              -o -name '*gatekeeper*.xml' \
            \) \
            -print \
            | sort \
            > work/security/security_init_files.txt

          echo "Security init/VINTF files:"
          cat work/security/security_init_files.txt

      # 22. ANALYSE STOCK SECURITY ELFs
      - name: Analyse stock security ELFs
        run: |
          set -euo pipefail

          STOCK_ROOT="$GITHUB_WORKSPACE/work/rootfs/stock_security"

          mkdir -p work/security/elf

          while IFS= read -r elf; do
            [ -f "$elf" ] || continue

            relative="${elf#"$STOCK_ROOT"/}"
            safe_name="$(echo "$relative" | tr '/:@' '___')"

            echo
            echo "============================================================"
            echo "$relative"
            echo "============================================================"

            file "$elf" || true

            readelf -h "$elf" \
              > "work/security/elf/${safe_name}.header.txt" \
              || true

            readelf -d "$elf" \
              > "work/security/elf/${safe_name}.dynamic.txt" \
              || true

            readelf -d "$elf" 2>/dev/null \
              | sed -n \
                's/.*Shared library: \[\(.*\)\].*/\1/p' \
              | sort -u \
              > "work/security/elf/${safe_name}.needed.txt" \
              || true

          done < <(
            find "$STOCK_ROOT" \
              -type f \
              \( \
                -name 'android.hardware.security.keymint@1.0-service.mitee' \
                -o -name 'android.hardware.gatekeeper@1.0-service*' \
                -o -name 'tee-supplicant' \
                -o -name 'gatekeeper.mitee.so' \
                -o -name 'libteecli.so' \
                -o -name 'libmt_mitee.so' \
                -o -name 'libtida_mitee@1.2.so' \
                -o -name 'libmfido_mitee.so' \
                -o -name 'libmlipay_mitee.so' \
                -o -name 'vendor.trustonic.tee@1.0.so' \
                -o -name 'vendor.trustonic.tee@1.1.so' \
                -o -name 'libteeservice_client.trustonic.so' \
                -o -name 'libkeymint.so' \
                -o -name 'libkeymint_support.so' \
                -o -name 'lib_android_keymaster_keymint_utils.so' \
                -o -name 'libkeymaster4support.so' \
                -o -name 'libkeymaster_messages.so' \
              \) \
              | sort
          )

      # 23. VERIFY REQUIRED STOCK SECURITY FILES
      - name: Verify required stock security files
        run: |
          set -euo pipefail

          STOCK_ROOT="$GITHUB_WORKSPACE/work/rootfs/stock_security"

          required_names=(
            android.hardware.security.keymint@1.0-service.mitee
            tee-supplicant
            gatekeeper.mitee.so
            libteecli.so
            libmt_mitee.so
            libtida_mitee@1.2.so
            libmfido_mitee.so
            libmlipay_mitee.so
            vendor.trustonic.tee@1.0.so
            vendor.trustonic.tee@1.1.so
            libteeservice_client.trustonic.so
            libkeymint.so
            libkeymint_support.so
            lib_android_keymaster_keymint_utils.so
            libkeymaster4support.so
            libkeymaster_messages.so
          )

          echo "============================================================"
          echo "VERIFYING REQUIRED STOCK SECURITY FILES"
          echo "============================================================"

          for name in "${required_names[@]}"; do
            found=""

            while IFS= read -r candidate; do
              found="$candidate"
              break
            done < <(
              find "$STOCK_ROOT" \
                -type f \
                -name "$name" \
                | sort
            )

            if [ -z "$found" ]; then
              echo
              echo "MISSING REQUIRED STOCK FILE:"
              echo "$name"
              echo
              echo "Searching all related stock security files:"

              find "$STOCK_ROOT" \
                -type f \
                \( \
                  -iname "*trustonic*" \
                  -o -iname "*tee*" \
                  -o -iname "*mitee*" \
                  -o -iname "*keymint*" \
                  -o -iname "*gatekeeper*" \
                \) \
                | sort \
                || true

              exit 1
            fi

            echo "FOUND:"
            echo "$found"
          done

          echo
          echo "============================================================"
          echo "VERIFY SELECTED GATEKEEPER"
          echo "============================================================"

          if [ ! -f work/security/selected_gatekeeper_service.txt ]; then
            echo "selected_gatekeeper_service.txt is missing."
            exit 1
          fi

          GATEKEEPER_SERVICE="$(cat work/security/selected_gatekeeper_service.txt)"

          if [ -z "$GATEKEEPER_SERVICE" ]; then
            echo "Selected GateKeeper service is empty."
            exit 1
          fi

          if [ ! -f "$GATEKEEPER_SERVICE" ]; then
            echo "Selected GateKeeper service does not exist:"
            echo "$GATEKEEPER_SERVICE"
            exit 1
          fi

          echo "Selected GateKeeper:"
          echo "$GATEKEEPER_SERVICE"

          echo
          echo "============================================================"
          echo "ALL REQUIRED STOCK SECURITY FILES VERIFIED"
          echo "============================================================"

      # 24. COPY STOCK SECURITY COMPONENTS
      - name: Integrate stock FBE security components
        run: |
          set -euo pipefail

          STOCK="$GITHUB_WORKSPACE/work/rootfs/stock_security"
          RECOVERY="$GITHUB_WORKSPACE/recovery/root"

          mkdir -p \
            "$RECOVERY/vendor/bin" \
            "$RECOVERY/vendor/bin/hw" \
            "$RECOVERY/vendor/lib" \
            "$RECOVERY/vendor/lib/hw" \
            "$RECOVERY/vendor/lib64" \
            "$RECOVERY/vendor/lib64/hw" \
            "$RECOVERY/vendor/etc/init" \
            "$RECOVERY/vendor/etc/vintf"

          copy_stock_file() {
            local name="$1"

            local found="$(
              find "$STOCK" \
                -type f \
                -name "$name" \
                | sort \
                | head -n 1
            )"

            if [ -z "$found" ]; then
              echo
              echo "Missing stock security file:"
              echo "$name"
              echo
              echo "Related stock security files:"

              find "$STOCK" \
                -type f \
                \( \
                  -iname "*trustonic*" \
                  -o -iname "*tee*" \
                  -o -iname "*mitee*" \
                \) \
                | sort \
                || true

              exit 1
            fi

            local relative="${found#"$STOCK"/}"
            local destination="$RECOVERY/$relative"

            mkdir -p "$(dirname "$destination")"

            cp -f \
              "$found" \
              "$destination"

            echo "Installed:"
            echo "  $relative"
          }

          copy_stock_file \
            android.hardware.security.keymint@1.0-service.mitee

          copy_stock_file \
            tee-supplicant

          copy_stock_file \
            gatekeeper.mitee.so

          copy_stock_file \
            libteecli.so

          copy_stock_file \
            libmt_mitee.so

          copy_stock_file \
            libtida_mitee@1.2.so

          copy_stock_file \
            libmfido_mitee.so

          copy_stock_file \
            libmlipay_mitee.so

          copy_stock_file \
            vendor.trustonic.tee@1.0.so

          copy_stock_file \
            vendor.trustonic.tee@1.1.so

          copy_stock_file \
            libteeservice_client.trustonic.so

          copy_stock_file \
            libkeymint.so

          copy_stock_file \
            libkeymint_support.so

          copy_stock_file \
            lib_android_keymaster_keymint_utils.so

          copy_stock_file \
            libkeymaster4support.so

          copy_stock_file \
            libkeymaster_messages.so

          GATEKEEPER_SERVICE="$(cat work/security/selected_gatekeeper_service.txt)"

          relative="${GATEKEEPER_SERVICE#"$STOCK"/}"

          mkdir -p \
            "$RECOVERY/$(dirname "$relative")"

          cp -f \
            "$GATEKEEPER_SERVICE" \
            "$RECOVERY/$relative"

          echo
          echo "Installed selected GateKeeper:"
          echo "  $relative"

          echo
          echo "Final integrated security files:"

          find "$RECOVERY" \
            -type f \
            \( \
              -name '*keymint*' \
              -o -name '*gatekeeper*' \
              -o -name '*mitee*' \
              -o -name '*trustonic*' \
              -o -name '*tee*' \
            \) \
            | sort

      # 25. COPY STOCK SECURITY INIT / VINTF
      - name: Integrate stock security init and VINTF
        run: |
          set -euo pipefail

          STOCK="$GITHUB_WORKSPACE/work/rootfs/stock_security"
          RECOVERY="$GITHUB_WORKSPACE/recovery/root"

          mkdir -p \
            "$RECOVERY/vendor/etc/init" \
            "$RECOVERY/vendor/etc/vintf"

          copy_init_if_found() {
            local name="$1"

            local found="$(
              find "$STOCK/vendor/etc/init" \
                -type f \
                -name "$name" \
                | sort \
                | head -n 1
            )"

            if [ -n "$found" ]; then
              cp -f \
                "$found" \
                "$RECOVERY/vendor/etc/init/$name"

              echo "Copied init:"
              echo "$name"
            fi
          }

          copy_vintf_if_found() {
            local name="$1"

            local found="$(
              find "$STOCK/vendor/etc/vintf" \
                -type f \
                -name "$name" \
                | sort \
                | head -n 1
            )"

            if [ -n "$found" ]; then
              cp -f \
                "$found" \
                "$RECOVERY/vendor/etc/vintf/$name"

              echo "Copied VINTF:"
              echo "$name"
            fi
          }

          copy_init_if_found \
            android.hardware.security.keymint-service.mitee.rc

          copy_init_if_found \
            android.hardware.security.keymint@1.0-service.mitee.rc

          copy_init_if_found \
            android.hardware.gatekeeper@1.0-service.mitee.rc

          copy_init_if_found \
            android.hardware.gatekeeper@1.0-service.rc

          copy_init_if_found \
            tee-supplicant.rc

          copy_vintf_if_found \
            android.hardware.security.keymint-service.mitee.xml

          copy_vintf_if_found \
            android.hardware.security.keymint.xml

      # 26. FIX GATEKEEPER SERVICE REFERENCES
      - name: Fix GateKeeper service references
        run: |
          set -euo pipefail

          RECOVERY="$GITHUB_WORKSPACE/recovery/root"

          GATEKEEPER_SERVICE="$(cat work/security/selected_gatekeeper_service.txt)"

          relative="${GATEKEEPER_SERVICE#"$GITHUB_WORKSPACE/work/rootfs/stock_security"/}"

          actual_name="$(basename "$relative")"

          echo "Actual stock GateKeeper executable:"
          echo "$actual_name"

          if [ "$actual_name" = \
            "android.hardware.gatekeeper@1.0-service.mitee" ]; then

            OLD='android.hardware.gatekeeper@1.0-service'
            NEW='android.hardware.gatekeeper@1.0-service.mitee'

            while IFS= read -r rc; do
              [ -f "$rc" ] || continue

              sed -i \
                "s#${OLD}#${NEW}#g" \
                "$rc"

            done < <(
              find "$RECOVERY/vendor/etc/init" \
                -type f \
                -name '*gatekeeper*.rc' \
                | sort
            )

          else

            while IFS= read -r rc; do
              [ -f "$rc" ] || continue

              sed -i \
                -E \
                "s#android\.hardware\.gatekeeper@1\.0-service(\.mitee)?#${actual_name}#g" \
                "$rc"

            done < <(
              find "$RECOVERY/vendor/etc/init" \
                -type f \
                -name '*gatekeeper*.rc' \
                | sort
            )

          fi

          echo
          echo "Final GateKeeper init references:"

          grep -RniE \
            'gatekeeper|android\.hardware\.gatekeeper' \
            "$RECOVERY/vendor/etc/init" \
            2>/dev/null \
            || true

      # 27. APPLY STOCK FBE FSTAB CONFIGURATION
      - name: Apply stock FBE fstab configuration
        run: |
          set -euo pipefail

          FSTAB="$GITHUB_WORKSPACE/recovery/root/etc/recovery.fstab"

          if [ ! -f "$FSTAB" ]; then
            echo "recovery.fstab not found:"
            echo "$FSTAB"
            exit 1
          fi

          cp \
            "$FSTAB" \
            work/security/recovery.fstab.before-fbe

          python3 - "$FSTAB" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              lines = f.readlines()

          output = []

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("/data "):
                  continue

              if stripped.startswith("/metadata "):
                  continue

              output.append(line)

          output.append(
              "/metadata ext4 /dev/block/by-name/metadata "
              "noatime,nosuid,nodev,discard "
              "wait,check,formattable,first_stage_mount\n"
          )

          output.append(
              "/data f2fs /dev/block/by-name/userdata "
              "flags=display=data,"
              "inlinecrypt,"
              "fileencryption=aes-256-xts:aes-256-cts:"
              "v2+inlinecrypt_optimized,"
              "keydirectory=/metadata/vold/metadata_encryption,"
              "gc_merge,atgc,age_extent_cache,noatime,"
              "nosuid,nodev,discard,noflush_merge,"
              "fsync_mode=nobarrier,reserve_root=134217,"
              "resgid=1065,wait,check,formattable,quota,"
              "latemount,resize,reservedsize=128m,"
              "checkpoint=fs,fsverity\n"
          )

          with open(path, "w", encoding="utf-8") as f:
              f.writelines(output)
          PY

          echo
          echo "Final recovery.fstab:"
          cat "$FSTAB"

      # 28. VERIFY FBE FSTAB
      - name: Verify FBE fstab
        run: |
          set -euo pipefail

          FSTAB="$GITHUB_WORKSPACE/recovery/root/etc/recovery.fstab"

          grep -q '^/metadata ' "$FSTAB"
          grep -q '^/data ' "$FSTAB"

          grep -q 'inlinecrypt' "$FSTAB"

          grep -q \
            'fileencryption=aes-256-xts:aes-256-cts:v2+inlinecrypt_optimized' \
            "$FSTAB"

          grep -q \
            'keydirectory=/metadata/vold/metadata_encryption' \
            "$FSTAB"

          echo "FBE fstab configuration verified."

      # 29. VERIFY INTEGRATED SECURITY FILES
      - name: Verify integrated security files
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/recovery/root"

          test -f \
            "$ROOT/vendor/bin/hw/android.hardware.security.keymint@1.0-service.mitee"

          test -f \
            "$ROOT/vendor/bin/tee-supplicant"

          test -f \
            "$ROOT/vendor/lib/hw/gatekeeper.mitee.so"

          for name in \
            libteecli.so \
            libmt_mitee.so \
            libtida_mitee@1.2.so \
            libmfido_mitee.so \
            libmlipay_mitee.so \
            vendor.trustonic.tee@1.0.so \
            vendor.trustonic.tee@1.1.so \
            libteeservice_client.trustonic.so \
            libkeymint.so \
            libkeymint_support.so \
            lib_android_keymaster_keymint_utils.so \
            libkeymaster4support.so \
            libkeymaster_messages.so; do

            if ! find "$ROOT" \
              -type f \
              -name "$name" \
              | grep -q .; then

              echo "Integrated library missing:"
              echo "$name"
              exit 1
            fi

            echo "Verified:"
            find "$ROOT" \
              -type f \
              -name "$name" \
              | sort

          done

          GATEKEEPER_SERVICE="$(cat work/security/selected_gatekeeper_service.txt)"

          relative="${GATEKEEPER_SERVICE#"$GITHUB_WORKSPACE/work/rootfs/stock_security"/}"

          if [ ! -f "$ROOT/$relative" ]; then
            echo "Integrated GateKeeper service missing:"
            echo "$relative"
            exit 1
          fi

          echo
          echo "All required security components are present."

      # 30. VERIFY SECURITY ELF ARCHITECTURES
      - name: Verify security ELF architectures
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/recovery/root"

          while IFS= read -r elf; do
            [ -f "$elf" ] || continue

            echo
            echo "============================================================"
            echo "$elf"
            echo "============================================================"

            file "$elf"

            readelf -h "$elf" \
              | grep -E \
                'Class:|Machine:' \
              || true

          done < <(
            find "$ROOT" \
              -type f \
              \( \
                -name 'android.hardware.security.keymint@1.0-service.mitee' \
                -o -name 'android.hardware.gatekeeper@1.0-service*' \
                -o -name 'tee-supplicant' \
                -o -name 'gatekeeper.mitee.so' \
                -o -name 'libteecli.so' \
                -o -name 'libmt_mitee.so' \
                -o -name 'libtida_mitee@1.2.so' \
                -o -name 'libmfido_mitee.so' \
                -o -name 'libmlipay_mitee.so' \
                -o -name 'vendor.trustonic.tee@1.0.so' \
                -o -name 'vendor.trustonic.tee@1.1.so' \
                -o -name 'libteeservice_client.trustonic.so' \
                -o -name 'libkeymint.so' \
                -o -name 'libkeymint_support.so' \
                -o -name 'lib_android_keymaster_keymint_utils.so' \
                -o -name 'libkeymaster4support.so' \
                -o -name 'libkeymaster_messages.so' \
              \) \
              | sort
          )

      # 31. VERIFY DIRECT ELF DEPENDENCIES
      - name: Verify direct ELF dependencies
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/recovery/root"

          missing=0

          while IFS= read -r elf; do
            [ -f "$elf" ] || continue

            echo
            echo "Checking:"
            echo "$elf"

            while IFS= read -r lib; do
              [ -n "$lib" ] || continue

              found=0

              for directory in \
                "$ROOT/vendor/lib64" \
                "$ROOT/vendor/lib64/hw" \
                "$ROOT/vendor/lib" \
                "$ROOT/vendor/lib/hw" \
                "$ROOT/system/lib64" \
                "$ROOT/system/lib" \
                "$ROOT/system_ext/lib64" \
                "$ROOT/system_ext/lib" \
                "$ROOT/product/lib64" \
                "$ROOT/product/lib" \
                "$ROOT/vendor_dlkm/lib64" \
                "$ROOT/vendor_dlkm/lib" \
                "$ROOT/odm_dlkm/lib64" \
                "$ROOT/odm_dlkm/lib"; do

                if [ -f "$directory/$lib" ]; then
                  echo "  FOUND: $lib"
                  found=1
                  break
                fi

              done

              if [ "$found" -eq 0 ]; then
                echo "  MISSING: $lib"
                missing=1
              fi

            done < <(
              readelf -d "$elf" 2>/dev/null \
                | sed -n \
                  's/.*Shared library: \[\(.*\)\].*/\1/p' \
                | sort -u
            )

          done < <(
            find "$ROOT" \
              -type f \
              \( \
                -name 'android.hardware.security.keymint@1.0-service.mitee' \
                -o -name 'android.hardware.gatekeeper@1.0-service*' \
                -o -name 'tee-supplicant' \
                -o -name 'gatekeeper.mitee.so' \
              \) \
              | sort
          )

          if [ "$missing" -ne 0 ]; then
            echo
            echo "Missing direct ELF dependencies."
            exit 1
          fi

          echo
          echo "All direct ELF dependencies resolved."

      # 32. VERIFY NO INIT_BOOT
      - name: Verify no init_boot integration
        run: |
          set -euo pipefail

          if find recovery/root \
            -type f \
            \( \
              -name 'init_boot.img' \
              -o -name '*init_boot*' \
            \) \
            | grep -q .; then

            echo "Unexpected init_boot integration detected."

            find recovery/root \
              -type f \
              \( \
                -name 'init_boot.img' \
                -o -name '*init_boot*' \
              \)

            exit 1
          fi

          echo "Correct: no init_boot was added."

      # 33. VERIFY NO SEPARATE ODM PARTITION
      - name: Verify Beryl partition layout
        run: |
          set -euo pipefail

          if grep -RniE \
            '/dev/block/by-name/odm([^_a-zA-Z]|$)' \
            recovery/root \
            BoardConfig.mk \
            device.mk \
            2>/dev/null; then

            echo "Unexpected separate ODM partition reference detected."
            exit 1
          fi

          echo "Correct: no separate ODM partition was added."

      # 34. VERIFY GATEKEEPER FINAL CONFIGURATION
      - name: Verify GateKeeper final configuration
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/recovery/root"

          GATEKEEPER_SERVICE="$(cat work/security/selected_gatekeeper_service.txt)"

          relative="${GATEKEEPER_SERVICE#"$GITHUB_WORKSPACE/work/rootfs/stock_security"/}"

          test -f "$ROOT/$relative"

          echo "Selected GateKeeper executable:"
          echo "$relative"

          echo
          echo "GateKeeper init configuration:"

          grep -RniE \
            'service .*gatekeeper|gatekeeper@1\.0-service|gatekeeper\.mitee' \
            "$ROOT/vendor/etc/init" \
            2>/dev/null \
            || true

      # 35. SHOW FINAL SECURITY TREE
      - name: Show final security tree
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "FINAL SECURITY TREE"
          echo "============================================================"

          find recovery/root \
            -type f \
            \( \
              -iname '*keymint*' \
              -o -iname '*gatekeeper*' \
              -o -iname '*mitee*' \
              -o -iname '*tee*' \
              -o -iname '*trustonic*' \
            \) \
            | sort

      # 36. SHOW GIT STATUS
      - name: Show git status
        run: |
          set -euo pipefail

          git status --short

          echo
          echo "============================================================"
          echo "DIFF STAT"
          echo "============================================================"

          git diff --stat

      # 37. STAGE FBE INTEGRATION
      - name: Stage FBE integration
        run: |
          set -euo pipefail

          git add \
            BoardConfig.mk \
            device.mk \
            recovery/root

          echo "============================================================"
          echo "STAGED FILES"
          echo "============================================================"

          git status --short

          if git diff --cached --quiet; then
            echo "ERROR: No changes were staged."
            exit 1
          fi

      # 38. COMMIT TO MAIN
      - name: Commit FBE integration to main
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "beryl: integrate stock FBE KeyMint and GateKeeper"

      # 39. PUSH DIRECTLY TO MAIN
      - name: Push commit to main
        run: |
          set -euo pipefail

          git push origin HEAD:main

      # 40. VERIFY MAIN
      - name: Verify main branch
        run: |
          set -euo pipefail

          git fetch origin main

          LOCAL="$(git rev-parse HEAD)"
          REMOTE="$(git rev-parse origin/main)"

          echo "Local commit : $LOCAL"
          echo "Remote main  : $REMOTE"

          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "ERROR: remote main does not contain the workflow commit."
            exit 1
          fi

          echo
          echo "============================================================"
          echo "SUCCESS"
          echo "============================================================"

          echo "FBE integration was committed and pushed directly to main."
