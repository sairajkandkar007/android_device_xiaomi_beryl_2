name: Analyze Stock FBE KeyMint Dependencies

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      ROM_VERSION: OS1.0.4.0.UOQINXM
      ROM_FILENAME: miui_BERYLINGlobal_OS1.0.4.0.UOQINXM_b51bc03ea2_14.0.zip
      ROM_URL: https://bn.d.miui.com/OS1.0.4.0.UOQINXM/miui_BERYLINGlobal_OS1.0.4.0.UOQINXM_b51bc03ea2_14.0.zip

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL REQUIRED TOOLS
      # ============================================================

      - name: Install required tools
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            aria2 \
            e2fsprogs \
            erofs-utils \
            p7zip-full \
            unzip \
            python3-pip \
            lz4

          python3 -m pip install --upgrade pip
          python3 -m pip install android-payload-dumper==2.3.0

          echo "Installed tools:"
          command -v aria2c
          command -v fsck.erofs
          command -v debugfs
          command -v unzip
          command -v lz4
          command -v 7z
          python3 -m payload_dumper --help || true


      # ============================================================
      # 3. CREATE WORKSPACE
      # ============================================================

      - name: Create workspace
        shell: bash
        run: |
          set -e

          rm -rf work

          mkdir -p \
            work/download \
            work/rom \
            work/payload \
            work/partitions \
            work/rootfs \
            work/analysis \
            work/logs

          echo "Workspace created."


      # ============================================================
      # 4. SHOW ROM INFORMATION
      # ============================================================

      - name: Show ROM information
        shell: bash
        run: |
          set -e

          {
            echo "ROM_VERSION: $ROM_VERSION"
            echo "ROM_FILENAME: $ROM_FILENAME"
            echo "ROM_URL: $ROM_URL"
          } | tee work/analysis/ROM_INFO.txt


      # ============================================================
      # 5. BENCHMARK XIAOMI CDN
      # ============================================================

      - name: Benchmark ROM CDN
        shell: bash
        run: |
          set -e

          URL="$ROM_URL"

          echo "Testing ROM URL..."
          echo "$URL"

          START=$(date +%s)

          curl -L \
            --range 0-10485759 \
            --output /dev/null \
            --silent \
            --show-error \
            "$URL"

          END=$(date +%s)

          ELAPSED=$((END - START))

          if [ "$ELAPSED" -lt 1 ]; then
            ELAPSED=1
          fi

          echo "Benchmark completed in ${ELAPSED}s"


      # ============================================================
      # 6. DOWNLOAD ROM
      # ============================================================

      - name: Download stock ROM
        shell: bash
        run: |
          set -e

          aria2c \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=10M \
            --continue=true \
            --allow-overwrite=false \
            --file-allocation=none \
            --console-log-level=notice \
            --dir=work/download \
            --out="$ROM_FILENAME" \
            "$ROM_URL"

          ls -lh "work/download/$ROM_FILENAME"


      # ============================================================
      # 7. VERIFY ROM
      # ============================================================

      - name: Verify downloaded ROM
        shell: bash
        run: |
          set -e

          ROM="work/download/$ROM_FILENAME"

          test -f "$ROM"

          echo "ROM size:"
          stat -c '%s bytes' "$ROM"

          echo
          echo "ROM SHA256:"
          sha256sum "$ROM" | tee work/logs/rom.sha256


      # ============================================================
      # 8. EXTRACT COMPLETE ROM ZIP
      # ============================================================

      - name: Extract complete ROM ZIP
        shell: bash
        run: |
          set -e

          ROM="work/download/$ROM_FILENAME"

          rm -rf work/rom/*
          unzip -q "$ROM" -d work/rom

          echo "ROM contents:"
          find work/rom -maxdepth 3 -type f | sort | head -200


      # ============================================================
      # 9. FIND PAYLOAD.BIN
      # ============================================================

      - name: Find payload.bin
        shell: bash
        run: |
          set -e

          PAYLOAD_FOUND=$(find work/rom -type f -name payload.bin -print -quit)

          if [ -z "$PAYLOAD_FOUND" ]; then
            echo "ERROR: payload.bin was not found in the ROM."
            echo
            echo "ROM files:"
            find work/rom -type f | sort
            exit 1
          fi

          echo "Found payload.bin:"
          echo "$PAYLOAD_FOUND"

          cp "$PAYLOAD_FOUND" work/payload/payload.bin

          echo
          echo "Copied payload:"
          ls -lh work/payload/payload.bin

          sha256sum work/payload/payload.bin \
            | tee work/logs/payload.sha256


      # ============================================================
      # 10. LIST PAYLOAD PARTITIONS
      # ============================================================

      - name: List payload partitions
        shell: bash
        run: |
          set -e

          python3 -m payload_dumper \
            work/payload/payload.bin \
            -l \
            | tee work/logs/payload_partitions.txt


      # ============================================================
      # 11. EXTRACT STOCK PARTITIONS
      #
      # IMPORTANT:
      # Keep this payload logic unchanged.
      # ============================================================

      - name: Extract stock partitions
        shell: bash
        run: |
          set -e

          python3 -m payload_dumper \
            work/payload/payload.bin \
            -o work/partitions \
            -p \
              vendor \
              vendor_dlkm \
              odm_dlkm \
              system \
              system_ext \
              product \
              init_boot \
              boot \
              dtbo \
              vendor_boot \
              vbmeta \
              vbmeta_system \
              vbmeta_vendor \
            -j 8

          echo
          echo "Extracted partitions:"
          find work/partitions -maxdepth 1 -type f -printf '%f %s bytes\n' \
            | sort \
            | tee work/logs/extracted_partitions.txt


      # ============================================================
      # 12. IDENTIFY FILESYSTEMS
      # ============================================================

      - name: Identify partition filesystems
        shell: bash
        run: |
          set -e

          {
            echo "=== FILESYSTEM IDENTIFICATION ==="
            echo

            for IMG in work/partitions/*.img; do
              [ -f "$IMG" ] || continue

              echo "===== $IMG ====="
              file "$IMG" || true
              echo

              fsck.erofs --print-superblock "$IMG" 2>/dev/null || true
              echo
            done

          } | tee work/logs/filesystems.txt


      # ============================================================
      # 13. EXTRACT EROFS PARTITIONS
      # ============================================================

      - name: Extract EROFS partitions
        shell: bash
        run: |
          set -e

          extract_erofs() {
            local NAME="$1"
            local IMG="work/partitions/${NAME}.img"
            local OUT="work/rootfs/${NAME}"

            if [ ! -f "$IMG" ]; then
              echo "Skipping missing $NAME"
              return 0
            fi

            echo
            echo "========================================"
            echo "Extracting EROFS: $NAME"
            echo "========================================"

            mkdir -p "$OUT"

            fsck.erofs \
              --extract="$PWD/$OUT" \
              "$IMG"
          }

          extract_erofs vendor
          extract_erofs vendor_dlkm
          extract_erofs odm_dlkm
          extract_erofs system
          extract_erofs system_ext
          extract_erofs product

          echo
          echo "EROFS extraction completed."


      # ============================================================
      # 14. CREATE COMBINED ROOTFS VIEW
      # ============================================================

      - name: Create combined rootfs view
        shell: bash
        run: |
          set -e

          ROOT="work/rootfs/combined"

          rm -rf "$ROOT"
          mkdir -p "$ROOT"

          for PART in vendor system system_ext product; do
            if [ -d "work/rootfs/$PART" ]; then
              mkdir -p "$ROOT/$PART"
              cp -a "work/rootfs/$PART/." "$ROOT/$PART/"
            fi
          done

          echo "Combined rootfs created."


      # ============================================================
      # 15. INVENTORY SECURITY FILES
      # ============================================================

      - name: Analyze security files
        shell: bash
        run: |
          set -e

          ROOT="work/rootfs"

          {
            echo "=== FBE / KEYMINT / KEYMASTER / GATEKEEPER FILE INVENTORY ==="
            echo

            for PART in vendor system system_ext product; do
              DIR="$ROOT/$PART"

              [ -d "$DIR" ] || continue

              echo "===== $PART ====="

              find "$DIR" -type f \
                \( \
                  -iname '*keymint*' \
                  -o -iname '*keymaster*' \
                  -o -iname '*gatekeeper*' \
                  -o -iname '*vold*' \
                  -o -iname '*cryptfs*' \
                  -o -iname '*keystore*' \
                  -o -iname '*tee*' \
                  -o -iname '*trustonic*' \
                  -o -iname '*mitee*' \
                  -o -iname '*mobicore*' \
                  -o -iname '*tz*' \
                \) \
                -print 2>/dev/null \
                | sort || true

              echo
            done

          } | tee work/analysis/security_file_inventory.txt


      # ============================================================
      # 16. FSTAB / FBE CONFIGURATION
      # ============================================================

      - name: Analyze FBE configuration
        shell: bash
        run: |
          set -e

          ROOT="work/rootfs"

          {
            echo "=== FBE / FSCRYPT CONFIGURATION ==="
            echo

            echo "=== ALL FSTAB FILES ==="

            find "$ROOT" -type f \
              \( \
                -name 'fstab*' \
                -o -name '*fstab*' \
              \) \
              -print 2>/dev/null \
              | sort \
              | while read -r F; do
                  echo
                  echo "===== $F ====="
                  cat "$F" 2>/dev/null || true
                done || true

            echo
            echo "=== FILEENCRYPTION REFERENCES ==="

            grep -RaiE \
              'fileencryption|metadata_encryption|inlinecrypt|fscrypt|fsverity|keydirectory|wrappedkey' \
              "$ROOT" \
              2>/dev/null \
              | head -1000 || true

          } | tee work/analysis/FBE_CONFIGURATION.txt


      # ============================================================
      # 17. VOLD ANALYSIS
      # ============================================================

      - name: Analyze vold dependencies
        shell: bash
        run: |
          set -e

          ROOT="work/rootfs"
          OUT="work/analysis/vold_dependencies.txt"

          {
            echo "=== VOLD ANALYSIS ==="
            echo

            VOLD=$(find "$ROOT" -type f \
              \( \
                -path '*/system/bin/vold' \
                -o -path '*/system/bin/vold.static' \
                -o -name vold \
              \) \
              -print -quit 2>/dev/null || true)

            if [ -z "$VOLD" ]; then
              echo "vold not found."
            else
              echo "vold:"
              echo "$VOLD"
              echo

              echo "=== FILE ==="
              file "$VOLD" || true

              echo
              echo "=== READ ELF DEPENDENCIES ==="

              readelf -d "$VOLD" 2>/dev/null \
                | grep -E 'NEEDED|RPATH|RUNPATH' \
                || true

              echo
              echo "=== STRINGS: FBE / KEYMINT / FSCRYPT ==="

              strings "$VOLD" 2>/dev/null \
                | grep -Ei \
                  'keymint|keymaster|keystore|fscrypt|f2fs|crypt|metadata|inlinecrypt|wrappedkey|gatekeeper' \
                | sort -u \
                || true
            fi

          } | tee "$OUT"


      # ============================================================
      # 18. KEYMINT / KEYMASTER SERVICES
      # ============================================================

      - name: Analyze KeyMint services
        shell: bash
        run: |
          set -e

          ROOT="work/rootfs"

          {
            echo "=== KEYMINT / KEYMASTER / GATEKEEPER SERVICES ==="
            echo

            find "$ROOT" -type f \
              \( \
                -iname '*keymint*' \
                -o -iname '*keymaster*' \
                -o -iname '*gatekeeper*' \
              \) \
              -print 2>/dev/null \
              | sort || true

            echo
            echo "=== INIT RC REFERENCES ==="

            grep -RaiE \
              'keymint|keymaster|gatekeeper|tee-supplicant|trustonic|mitee|mobicore' \
              "$ROOT/vendor/etc/init" \
              "$ROOT/system/etc/init" \
              2>/dev/null \
              | head -2000 \
              || true

            echo
            echo "=== VINTF REFERENCES ==="

            grep -RaiE \
              'keymint|keymaster|gatekeeper' \
              "$ROOT/vendor/etc/vintf" \
              "$ROOT/system/etc/vintf" \
              2>/dev/null \
              | head -2000 \
              || true

          } | tee work/analysis/keymint_services.txt


      # ============================================================
      # 19. KEYMINT ELF DEPENDENCIES
      # ============================================================

      - name: Analyze KeyMint ELF dependencies
        shell: bash
        run: |
          set -e

          ROOT="work/rootfs"

          {
            echo "=== KEYMINT ELF DEPENDENCIES ==="
            echo

            find "$ROOT" -type f \
              \( \
                -name '*keymint*' \
                -o -name '*keymaster*' \
                -o -name '*gatekeeper*' \
              \) \
              -print 2>/dev/null \
              | sort \
              | while read -r F; do

                  echo
                  echo "========================================"
                  echo "$F"
                  echo "========================================"

                  file "$F" 2>/dev/null || true

                  if file "$F" 2>/dev/null | grep -qi 'ELF'; then
                    echo
                    echo "--- NEEDED ---"

                    readelf -d "$F" 2>/dev/null \
                      | grep 'NEEDED' \
                      || true

                    echo
                    echo "--- RPATH/RUNPATH ---"

                    readelf -d "$F" 2>/dev/null \
                      | grep -E 'RPATH|RUNPATH' \
                      || true
                  fi

                done || true

          } | tee work/analysis/keymint_elf_dependencies.txt


      # ============================================================
      # 20. SECURITY LIBRARIES
      # ============================================================

      - name: Analyze security libraries
        shell: bash
        run: |
          set -e

          ROOT="work/rootfs"

          {
            echo "=== SECURITY LIBRARIES ==="
            echo

            find "$ROOT" -type f \
              \( \
                -name '*keymint*.so*' \
                -o -name '*keymaster*.so*' \
                -o -name '*gatekeeper*.so*' \
                -o -name '*trustonic*.so*' \
                -o -name '*mitee*.so*' \
                -o -name '*mobicore*.so*' \
                -o -name '*tee*.so*' \
              \) \
              -print 2>/dev/null \
              | sort || true

          } | tee work/analysis/security_libraries.txt


      # ============================================================
      # 21. TEE DEVICE REQUIREMENTS
      #
      # IMPORTANT FIX:
      # grep returning 1 for "no matches" is allowed.
      # ============================================================

      - name: Analyze TEE device requirements
        shell: bash
        run: |
          set -e

          OUT="work/analysis/tee_device_requirements.txt"
          ROOT="work/rootfs"

          {
            echo "=== TEE / KEYMINT DEVICE REQUIREMENTS ==="
            echo

            echo "=== Matching strings in vendor/system files ==="

            find "$ROOT/vendor" "$ROOT/odm" "$ROOT/system" \
              -type f \
              2>/dev/null \
              | while read -r F; do
                  if grep -aEi \
                    'tee|mobicore|mitee|trustonic|keymaster|keymint|gatekeeper|tz|secure' \
                    "$F" \
                    2>/dev/null
                  then
                    echo
                    echo "FILE: $F"
                  fi
                done || true

            echo
            echo "=== Vendor file-context references ==="

            if [ -f "$ROOT/vendor/etc/selinux/vendor_file_contexts" ]; then
              grep -aEi \
                'tee|mobicore|mitee|trustonic|keymaster|keymint|gatekeeper|tz' \
                "$ROOT/vendor/etc/selinux/vendor_file_contexts" \
                2>/dev/null \
                || true
            fi

            echo
            echo "=== Vendor SELinux policy references ==="

            if [ -d "$ROOT/vendor/etc/selinux" ]; then
              find "$ROOT/vendor/etc/selinux" \
                -type f \
                2>/dev/null \
                | while read -r F; do

                    if grep -aEi \
                      'tee|mobicore|mitee|trustonic|keymaster|keymint|gatekeeper|tz' \
                      "$F" \
                      2>/dev/null
                    then
                      echo
                      echo "POLICY FILE: $F"
                    fi

                  done || true
            fi

            echo
            echo "=== Explicit device-node references ==="

            grep -RaiE \
              '/dev/(tee|mobicore|mitee|trustonic|tz|tbase|keymaster|keymint|gatekeeper)' \
              "$ROOT" \
              2>/dev/null \
              | head -2000 \
              || true

          } > "$OUT"

          cat "$OUT"


      # ============================================================
      # 22. SELINUX RULE ANALYSIS
      # ============================================================

      - name: Analyze security SELinux rules
        shell: bash
        run: |
          set -e

          ROOT="work/rootfs"
          OUT="work/analysis/security_selinux_rules.txt"

          {
            echo "=== SECURITY SELINUX REFERENCES ==="
            echo

            if [ -d "$ROOT/vendor/etc/selinux" ]; then

              find "$ROOT/vendor/etc/selinux" \
                -type f \
                2>/dev/null \
                | sort \
                | while read -r F; do

                    if grep -aEi \
                      'keymint|keymaster|gatekeeper|tee|mitee|mobicore|trustonic|sfs|keystore' \
                      "$F" \
                      2>/dev/null
                    then
                      echo
                      echo "FILE: $F"
                    fi

                  done || true

            fi

            echo
            echo "=== GLOBAL SECURITY REFERENCES ==="

            grep -RaiE \
              'hal_keymint|hal_keymaster|hal_gatekeeper|key_install_data_file|mitee_client_device|mobicore_user_device|teei_client_device|tkcore_admin_device|mobicore' \
              "$ROOT/vendor/etc/selinux" \
              "$ROOT/system/etc/selinux" \
              2>/dev/null \
              | head -5000 \
              || true

          } | tee "$OUT"


      # ============================================================
      # 23. KEY STORAGE PATHS
      # ============================================================

      - name: Analyze key storage paths
        shell: bash
        run: |
          set -e

          ROOT="work/rootfs"

          {
            echo "=== KEY STORAGE / METADATA PATHS ==="
            echo

            echo "=== REFERENCES TO METADATA / KEY DIRECTORIES ==="

            grep -RaiE \
              'metadata_encryption|keydirectory|/metadata|/data/misc/keystore|/data/misc/vold|keydata|key_install' \
              "$ROOT" \
              2>/dev/null \
              | head -3000 \
              || true

            echo
            echo "=== POSSIBLE KEY STORAGE DIRECTORIES ==="

            find "$ROOT" \
              -type d \
              \( \
                -iname '*key*' \
                -o -iname '*keystore*' \
                -o -iname '*vold*' \
                -o -iname '*metadata*' \
              \) \
              2>/dev/null \
              | sort \
              | head -2000 \
              || true

          } | tee work/analysis/key_storage_paths.txt


      # ============================================================
      # 24. KERNEL FBE SUPPORT
      # ============================================================

      - name: Analyze kernel FBE support
        shell: bash
        run: |
          set -e

          {
            echo "=== KERNEL / MODULE FBE SUPPORT ==="
            echo

            echo "=== EXTRACTED VENDOR MODULES ==="

            find work/rootfs/vendor_dlkm \
              work/rootfs/odm_dlkm \
              -type f \
              -name '*.ko' \
              -print \
              2>/dev/null \
              | sort \
              || true

            echo
            echo "=== FBE / FSCRYPT STRINGS IN MODULES ==="

            find work/rootfs/vendor_dlkm \
              work/rootfs/odm_dlkm \
              -type f \
              -name '*.ko' \
              -print \
              2>/dev/null \
              | while read -r F; do

                  strings "$F" 2>/dev/null \
                    | grep -Ei \
                      'fscrypt|f2fs|inlinecrypt|blk-crypto|crypto' \
                    | while read -r LINE; do
                      echo "$F: $LINE"
                    done || true

                done || true

          } | tee work/analysis/kernel_fbe_support.txt


      # ============================================================
      # 25. INIT / BOOT CONFIGURATION
      # ============================================================

      - name: Analyze init and boot configuration
        shell: bash
        run: |
          set -e

          ROOT="work/rootfs"

          {
            echo "=== INIT / BOOT SECURITY CONFIGURATION ==="
            echo

            echo "=== INIT RC FILES ==="

            find "$ROOT/vendor/etc/init" \
              "$ROOT/system/etc/init" \
              -type f \
              2>/dev/null \
              | sort \
              | while read -r F; do

                  if grep -aEi \
                    'keymint|keymaster|gatekeeper|vold|tee|trustonic|mitee|mobicore|keystore' \
                    "$F" \
                    2>/dev/null
                  then
                    echo
                    echo "FILE: $F"
                  fi

                done || true

            echo
            echo "=== SECURITY PROPERTIES ==="

            grep -RaiE \
              'keymint|keymaster|gatekeeper|vold|keystore|tee|trustonic|mitee|mobicore' \
              "$ROOT/vendor/etc" \
              "$ROOT/system/etc" \
              2>/dev/null \
              | head -3000 \
              || true

          } | tee work/analysis/init_boot_configuration.txt


      # ============================================================
      # 26. COMPLETE SECURITY FILE INVENTORY
      # ============================================================

      - name: Generate complete security inventory
        shell: bash
        run: |
          set -e

          {
            echo "=== COMPLETE SECURITY-RELATED FILE INVENTORY ==="
            echo

            find work/rootfs \
              -type f \
              2>/dev/null \
              | grep -Ei \
                'keymint|keymaster|gatekeeper|keystore|vold|fscrypt|cryptfs|tee|mitee|mobicore|trustonic|tz|sfs' \
              | sort \
              || true

          } | tee work/analysis/file_inventory.txt


      # ============================================================
      # 27. PARTITION INVENTORY
      # ============================================================

      - name: Generate partition inventory
        shell: bash
        run: |
          set -e

          {
            echo "=== EXTRACTED PARTITION INVENTORY ==="
            echo

            find work/partitions \
              -maxdepth 1 \
              -type f \
              -printf '%f\t%s bytes\n' \
              2>/dev/null \
              | sort

          } | tee work/analysis/partition_inventory.txt


      # ============================================================
      # 28. GENERATE DEPENDENCY SUMMARY
      # ============================================================

      - name: Generate dependency summary
        shell: bash
        run: |
          set -e

          OUT="work/analysis/FBE_KEYMINT_SUMMARY.txt"

          {
            echo "============================================================"
            echo "BERYL STOCK FBE / KEYMINT DEPENDENCY ANALYSIS"
            echo "============================================================"
            echo

            echo "ROM:"
            echo "$ROM_VERSION"
            echo "$ROM_FILENAME"
            echo

            echo "============================================================"
            echo "FBE CONFIGURATION"
            echo "============================================================"
            echo

            if [ -f work/analysis/FBE_CONFIGURATION.txt ]; then
              cat work/analysis/FBE_CONFIGURATION.txt
            fi

            echo
            echo "============================================================"
            echo "VOLD"
            echo "============================================================"
            echo

            if [ -f work/analysis/vold_dependencies.txt ]; then
              cat work/analysis/vold_dependencies.txt
            fi

            echo
            echo "============================================================"
            echo "KEYMINT SERVICES"
            echo "============================================================"
            echo

            if [ -f work/analysis/keymint_services.txt ]; then
              cat work/analysis/keymint_services.txt
            fi

            echo
            echo "============================================================"
            echo "KEYMINT ELF DEPENDENCIES"
            echo "============================================================"
            echo

            if [ -f work/analysis/keymint_elf_dependencies.txt ]; then
              cat work/analysis/keymint_elf_dependencies.txt
            fi

            echo
            echo "============================================================"
            echo "TEE DEVICE REQUIREMENTS"
            echo "============================================================"
            echo

            if [ -f work/analysis/tee_device_requirements.txt ]; then
              cat work/analysis/tee_device_requirements.txt
            fi

            echo
            echo "============================================================"
            echo "SELINUX"
            echo "============================================================"
            echo

            if [ -f work/analysis/security_selinux_rules.txt ]; then
              cat work/analysis/security_selinux_rules.txt
            fi

            echo
            echo "============================================================"
            echo "KEY STORAGE"
            echo "============================================================"
            echo

            if [ -f work/analysis/key_storage_paths.txt ]; then
              cat work/analysis/key_storage_paths.txt
            fi

            echo
            echo "============================================================"
            echo "KERNEL FBE SUPPORT"
            echo "============================================================"
            echo

            if [ -f work/analysis/kernel_fbe_support.txt ]; then
              cat work/analysis/kernel_fbe_support.txt
            fi

            echo
            echo "============================================================"
            echo "INIT / BOOT"
            echo "============================================================"
            echo

            if [ -f work/analysis/init_boot_configuration.txt ]; then
              cat work/analysis/init_boot_configuration.txt
            fi

          } > "$OUT"

          cat "$OUT"


    # ============================================================
    # 29. PACKAGE ONLY ANALYSIS REPORTS
    # ============================================================

      - name: Package analysis reports
        shell: bash
        run: |
          set -e

          mkdir -p work/package

          cp -a work/analysis \
            work/package/

          cp -a work/logs \
            work/package/

          echo "Analysis package contents:"
          find work/package \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

          echo
          echo "Package size:"
          du -sh work/package

          tar -czf \
            work/beryl-stock-fbe-keymint-analysis.tar.gz \
            -C work/package \
            analysis logs

          echo
          echo "Final report archive:"
          ls -lh work/beryl-stock-fbe-keymint-analysis.tar.gz


      # ============================================================
      # 30. UPLOAD ONLY SMALL ANALYSIS ARTIFACT
      # ============================================================

      - name: Upload analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: beryl-stock-fbe-keymint-analysis
          path: |
            work/beryl-stock-fbe-keymint-analysis.tar.gz
            work/analysis/
            work/logs/
          if-no-files-found: error
          retention-days: 7
