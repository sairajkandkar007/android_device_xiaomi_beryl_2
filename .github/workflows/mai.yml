name: Beryl FBE Decryption Integration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT MAIN
      # ============================================================
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ============================================================
      # 2. INSTALL TOOLS
      # ============================================================
      - name: Install tools
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            aria2 \
            unzip \
            p7zip-full \
            python3 \
            python3-pip \
            file \
            cpio \
            lz4 \
            e2fsprogs \
            rsync \
            binutils \
            gzip \
            xz-utils \
            zstd \
            curl \
            git

          python3 -m pip install --upgrade pip
          python3 -m pip install android-payload-dumper==2.3.0

      # ============================================================
      # 3. WORKSPACE
      # ============================================================
      - name: Create workspace
        run: |
          set -euo pipefail

          rm -rf work
          mkdir -p \
            work/rom \
            work/zip \
            work/partitions \
            work/analysis \
            work/logs \
            work/tools \
            work/rootfs \
            work/vendor_boot \
            work/vendor_ramdisks

      # ============================================================
      # 4. STOCK ROM VARIABLES
      # ============================================================
      - name: Set stock ROM variables
        run: |
          set -euo pipefail

          echo 'ROM_VERSION=OS1.0.4.0.UOQINXM' >> "$GITHUB_ENV"
          echo 'ROM_FILENAME=miui_BERYLINGlobal_OS1.0.4.0.UOQINXM_b51bc03ea2_14.0.zip' >> "$GITHUB_ENV"
          echo 'ROM_URL=https://bn.d.miui.com/OS1.0.4.0.UOQINXM/miui_BERYLINGlobal_OS1.0.4.0.UOQINXM_b51bc03ea2_14.0.zip' >> "$GITHUB_ENV"

      # ============================================================
      # 5. CDN BENCHMARK
      # ============================================================
      - name: CDN benchmark
        run: |
          set -euo pipefail

          for host in \
            bn.d.miui.com \
            bigota.d.miui.com \
            cdnorg.d.miui.com
          do
            echo "Testing $host"

            curl \
              --connect-timeout 10 \
              --max-time 20 \
              -o /dev/null \
              -sS \
              -w "$host %{http_code} %{time_total}s\n" \
              "https://$host/$ROM_VERSION/$ROM_FILENAME" \
              || true
          done

      # ============================================================
      # 6. DOWNLOAD STOCK ROM
      # ============================================================
      - name: Download stock ROM
        run: |
          set -euo pipefail

          aria2c \
            --console-log-level=notice \
            --file-allocation=none \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=4M \
            --retry-wait=5 \
            --max-tries=10 \
            --timeout=30 \
            --connect-timeout=30 \
            --summary-interval=10 \
            --dir=work/rom \
            --out="$ROM_FILENAME" \
            "$ROM_URL"

      # ============================================================
      # 7. VERIFY ROM
      # ============================================================
      - name: Verify ROM
        run: |
          set -euo pipefail

          test -s "work/rom/$ROM_FILENAME"

          file "work/rom/$ROM_FILENAME"

          sha256sum "work/rom/$ROM_FILENAME" \
            | tee work/analysis/rom.sha256

      # ============================================================
      # 8. EXTRACT COMPLETE ROM ZIP
      # ============================================================
      - name: Extract complete ROM ZIP
        run: |
          set -euo pipefail

          rm -rf work/zip
          mkdir -p work/zip

          unzip -q \
            "work/rom/$ROM_FILENAME" \
            -d work/zip

      # ============================================================
      # 9. FIND PAYLOAD
      # ============================================================
      - name: Find payload
        run: |
          set -euo pipefail

          PAYLOAD="$(find work/zip \
            -type f \
            -name payload.bin \
            -print -quit)"

          test -n "$PAYLOAD"

          cp "$PAYLOAD" work/payload.bin

          sha256sum work/payload.bin \
            | tee work/analysis/payload.sha256

      # ============================================================
      # 10. LIST PAYLOAD
      # ============================================================
      - name: List payload
        run: |
          set -euo pipefail

          python3 -m payload_dumper \
            --help \
            > work/analysis/payload_dumper_help.txt \
            || true

          python3 - <<'PY'
          from pathlib import Path

          p = Path("work/payload.bin")
          print("payload:", p)
          print("size:", p.stat().st_size)
          PY

      # ============================================================
      # 11. EXTRACT EXACT STOCK PARTITIONS
      #
      # DO NOT CHANGE THIS PARTITION LIST.
      # ============================================================
      - name: Extract stock partitions
        run: |
          set -euo pipefail

          mkdir -p work/partitions

          python3 -m payload_dumper \
            -o work/partitions \
            -p vendor vendor_dlkm odm_dlkm system system_ext product init_boot boot dtbo vendor_boot vbmeta vbmeta_system vbmeta_vendor \
            -j 8 \
            work/payload.bin

      # ============================================================
      # 12. VERIFY EXTRACTED PARTITIONS
      # ============================================================
      - name: Verify extracted partitions
        run: |
          set -euo pipefail

          for p in \
            vendor \
            vendor_dlkm \
            odm_dlkm \
            system \
            system_ext \
            product \
            init_boot \
            boot \
            dtbo \
            vendor_boot \
            vbmeta \
            vbmeta_system \
            vbmeta_vendor
          do
            test -s "work/partitions/$p.img"
          done

          find work/partitions \
            -maxdepth 1 \
            -type f \
            -printf '%f %s bytes\n' \
            | sort \
            | tee work/analysis/partition_sizes.txt

      # ============================================================
      # 13. IDENTIFY FILESYSTEMS
      # ============================================================
      - name: Identify partition filesystems
        run: |
          set -euo pipefail

          for img in work/partitions/*.img; do
            echo "===== $img ====="
            file "$img"
          done | tee work/analysis/filesystems.txt

      # ============================================================
      # 14. EXTRACT EROFS PARTITIONS
      # ============================================================
      - name: Extract EROFS partitions
        run: |
          set -euo pipefail

          for p in \
            vendor \
            vendor_dlkm \
            odm_dlkm \
            system \
            system_ext \
            product
          do
            IMG="work/partitions/$p.img"
            OUT="work/rootfs/$p"

            mkdir -p "$OUT"

            if file "$IMG" | grep -qi EROFS; then
              fsck.erofs \
                --extract="$OUT" \
                "$IMG"
            fi
          done

      # ============================================================
      # 15. EXTRACT EXT4 PARTITIONS
      # ============================================================
      - name: Extract EXT4 partitions
        run: |
          set -euo pipefail

          for p in \
            init_boot \
            boot
          do
            IMG="work/partitions/$p.img"
            OUT="work/rootfs/$p"

            mkdir -p "$OUT"

            if file "$IMG" | grep -qi 'ext4'; then
              7z x \
                -so "$IMG" \
                2>/dev/null \
                | cpio -idmu \
                    --quiet \
                    -D "$OUT" \
                || true
            fi
          done

      # ============================================================
      # 16. INSTALL AOSP UNPACK_BOOTIMG
      #
      # This fixes:
      #   unpack_bootimg not available
      #
      # We download the actual AOSP Python implementation instead
      # of assuming an Ubuntu executable exists.
      # ============================================================
      - name: Install AOSP unpack_bootimg
        run: |
          set -euo pipefail

          mkdir -p work/tools

          curl \
            --fail \
            --retry 5 \
            --retry-all-errors \
            -L \
            'https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/heads/main/unpack_bootimg.py?format=TEXT' \
            -o work/tools/unpack_bootimg.b64

          base64 -d \
            work/tools/unpack_bootimg.b64 \
            > work/tools/unpack_bootimg.py

          chmod +x work/tools/unpack_bootimg.py

          python3 \
            work/tools/unpack_bootimg.py \
            --help

      # ============================================================
      # 17. UNPACK VENDOR_BOOT
      # ============================================================
      - name: Unpack vendor_boot
        run: |
          set -euo pipefail

          rm -rf work/vendor_boot
          mkdir -p work/vendor_boot

          VENDOR_BOOT="work/partitions/vendor_boot.img"

          test -s "$VENDOR_BOOT"

          MAGIC="$(dd \
            if="$VENDOR_BOOT" \
            bs=1 \
            count=8 \
            2>/dev/null)"

          echo "vendor_boot magic: $MAGIC"

          test "$MAGIC" = "VNDRBOOT"

          python3 \
            work/tools/unpack_bootimg.py \
            --boot_img "$VENDOR_BOOT" \
            --out work/vendor_boot \
            --format=info \
            | tee work/analysis/vendor_boot_info.txt

          find work/vendor_boot \
            -maxdepth 2 \
            -type f \
            -printf '%P %s bytes\n' \
            | sort \
            | tee work/analysis/vendor_boot_files.txt

      # ============================================================
      # 18. EXTRACT ALL VENDOR BOOT RAMDISK FRAGMENTS
      # ============================================================
      - name: Extract vendor ramdisks
        run: |
          set -euo pipefail

          rm -rf work/vendor_ramdisks
          mkdir -p work/vendor_ramdisks

          FOUND=0

          for RD in \
            work/vendor_boot/vendor_ramdisk \
            work/vendor_boot/vendor_ramdisk[0-9][0-9]
          do
            [ -f "$RD" ] || continue

            FOUND=1

            NAME="$(basename "$RD")"
            OUT="work/vendor_ramdisks/$NAME"

            mkdir -p "$OUT"

            echo "Processing $NAME"

            file "$RD" | tee "$OUT/file.txt"

            if file "$RD" | grep -Eiq 'gzip compressed|gzip data'; then
              gzip -dc "$RD" > "$OUT/ramdisk.cpio"
            elif file "$RD" | grep -Eiq 'LZ4 compressed|LZ4'; then
              lz4 -dc "$RD" > "$OUT/ramdisk.cpio"
            elif file "$RD" | grep -Eiq 'XZ compressed'; then
              xz -dc "$RD" > "$OUT/ramdisk.cpio"
            elif file "$RD" | grep -Eiq 'Zstandard compressed'; then
              zstd -dc "$RD" > "$OUT/ramdisk.cpio"
            else
              cp "$RD" "$OUT/ramdisk.cpio"
            fi

            mkdir -p "$OUT/root"

            cpio \
              -idmu \
              --quiet \
              -D "$OUT/root" \
              < "$OUT/ramdisk.cpio" \
              || {
                echo "ERROR: unable to unpack $NAME"
                exit 1
              }
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: no vendor ramdisk found"
            exit 1
          fi

          find work/vendor_ramdisks \
            -type f \
            -printf '%P %s bytes\n' \
            | sort \
            | tee work/analysis/vendor_ramdisk_files.txt

      # ============================================================
      # 19. BUILD COMPLETE STOCK SECURITY SEARCH TREE
      # ============================================================
      - name: Build stock security search tree
        run: |
          set -euo pipefail

          rm -rf work/rootfs/stock_security
          mkdir -p work/rootfs/stock_security

          # Extracted partition trees
          for p in \
            vendor \
            vendor_dlkm \
            odm_dlkm \
            system \
            system_ext \
            product
          do
            if [ -d "work/rootfs/$p" ]; then
              mkdir -p "work/rootfs/stock_security/$p"
              rsync -a \
                "work/rootfs/$p/" \
                "work/rootfs/stock_security/$p/"
            fi
          done

          # Vendor boot ramdisks
          for rd in work/vendor_ramdisks/*/root; do
            [ -d "$rd" ] || continue

            NAME="$(basename "$(dirname "$rd")")"

            mkdir -p "work/rootfs/stock_security/vendor_boot/$NAME"

            rsync -a \
              "$rd/" \
              "work/rootfs/stock_security/vendor_boot/$NAME/"
          done

          find work/rootfs/stock_security \
            -type f \
            | sort \
            > work/analysis/security_tree_files.txt

      # ============================================================
      # 20. LOCATE ACTUAL SECURITY SERVICE ROOTS
      # ============================================================
      - name: Locate KeyMint Gatekeeper TEE roots
        run: |
          set -euo pipefail

          ROOTS="work/analysis/security_roots.txt"
          : > "$ROOTS"

          SEARCH="work/rootfs/stock_security"

          for name in \
            android.hardware.security.keymint@1.0-service.mitee \
            android.hardware.gatekeeper@1.0-service.mitee \
            tee-supplicant
          do
            find "$SEARCH" \
              -type f \
              -name "$name" \
              -print \
              >> "$ROOTS"
          done

          sort -u "$ROOTS" -o "$ROOTS"

          cat "$ROOTS"

          test -s "$ROOTS"

      # ============================================================
      # 21. LOCATE SECURITY INIT DEFINITIONS
      # ============================================================
      - name: Locate security init definitions
        run: |
          set -euo pipefail

          find work/rootfs/stock_security \
            -type f \
            \( \
              -name '*.rc' \
              -o -name '*.xml' \
            \) \
            -print0 \
            | xargs -0 grep -IlE \
              'keymint|gatekeeper|tee-supplicant|mitee|trustonic|trusty' \
            | sort -u \
            > work/analysis/security_init_vintf_candidates.txt \
            || true

          cat work/analysis/security_init_vintf_candidates.txt

      # ============================================================
      # 22. CREATE SECURITY INTEGRATION ROOT
      # ============================================================
      - name: Create integration tree
        run: |
          set -euo pipefail

          rm -rf work/integration

          mkdir -p \
            work/integration/vendor/bin/hw \
            work/integration/vendor/bin \
            work/integration/vendor/lib \
            work/integration/vendor/lib64 \
            work/integration/vendor/etc/init \
            work/integration/vendor/etc/vintf \
            work/integration/vendor/etc \
            work/integration/vendor/lib/modules \
            work/integration/vendor/firmware \
            work/integration/vendor/etc/security \
            work/integration/vendor/etc/selinux \
            work/integration/sepolicy

      # ============================================================
      # 23. SECURITY SERVICE EXECUTABLES
      # ============================================================
      - name: Copy actual security service executables
        run: |
          set -euo pipefail

          while IFS= read -r src; do
            [ -f "$src" ] || continue

            rel="${src#work/rootfs/stock_security/}"

            case "$rel" in
              vendor/*)
                dst="work/integration/$rel"
                ;;
              vendor_boot/*)
                dst="work/integration/vendor/$(basename "$src")"
                ;;
              *)
                continue
                ;;
            esac

            mkdir -p "$(dirname "$dst")"
            cp -a "$src" "$dst"
          done < work/analysis/security_roots.txt

          find work/integration/vendor/bin \
            -type f \
            -print \
            | sort \
            | tee work/analysis/integrated_security_binaries.txt

      # ============================================================
      # 24. RESOLVE ELF DEPENDENCY CLOSURE
      #
      # Start ONLY from actual security service executables.
      # Do not use broad Mitee filename matching.
      # ============================================================
      - name: Resolve security ELF dependency closure
        run: |
          set -euo pipefail

          SEARCH="work/rootfs/stock_security"
          OUT="work/analysis/elf_dependency_closure.txt"

          : > "$OUT"

          python3 - "$SEARCH" work/analysis/security_roots.txt "$OUT" <<'PY'
          import os
          import re
          import subprocess
          import sys
          from pathlib import Path

          search_root = Path(sys.argv[1])
          roots_file = Path(sys.argv[2])
          output = Path(sys.argv[3])

          roots = [
              Path(x.strip())
              for x in roots_file.read_text().splitlines()
              if x.strip()
          ]

          by_name = {}

          for p in search_root.rglob("*"):
              if not p.is_file():
                  continue

              by_name.setdefault(p.name, []).append(p)

          needed = set()
          queue = list(roots)
          seen = set()

          def needed_libs(path):
              try:
                  r = subprocess.run(
                      ["readelf", "-d", str(path)],
                      text=True,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.DEVNULL,
                      check=False,
                  )
              except Exception:
                  return []

              result = []

              for line in r.stdout.splitlines():
                  m = re.search(r"\(NEEDED\).*Shared library: \[(.+?)\]", line)
                  if m:
                      result.append(m.group(1))

              return result

          while queue:
              path = queue.pop()

              if path in seen:
                  continue

              seen.add(path)

              for lib in needed_libs(path):
                  needed.add(lib)

                  candidates = by_name.get(lib, [])

                  # Prefer vendor/odm over system/product.
                  candidates = sorted(
                      candidates,
                      key=lambda p: (
                          0 if "/vendor/" in str(p) else
                          1 if "/odm/" in str(p) else
                          2 if "/system/" in str(p) else
                          3
                      )
                  )

                  if candidates:
                      queue.append(candidates[0])

          with output.open("w") as f:
              for lib in sorted(needed):
                  f.write(lib + "\n")
          PY

          cat "$OUT"

      # ============================================================
      # 25. COPY RESOLVED ELF LIBRARIES
      # ============================================================
      - name: Copy resolved security ELF libraries
        run: |
          set -euo pipefail

          SEARCH="work/rootfs/stock_security"

          while IFS= read -r soname; do
            [ -n "$soname" ] || continue

            src="$(
              find "$SEARCH" \
                -type f \
                -name "$soname" \
                -print \
                | sort \
                | head -n1
            )"

            if [ -z "$src" ]; then
              echo "UNRESOLVED: $soname"
              continue
            fi

            rel="${src#work/rootfs/stock_security/}"

            case "$rel" in
              vendor/*)
                dst="work/integration/$rel"
                ;;
              *)
                # Platform libraries supplied by recovery are not copied
                # merely because a stock binary references them.
                continue
                ;;
            esac

            mkdir -p "$(dirname "$dst")"

            if [ ! -e "$dst" ]; then
              cp -a "$src" "$dst"
            fi
          done < work/analysis/elf_dependency_closure.txt

      # ============================================================
      # 26. VERIFY SECURITY ELFS
      # ============================================================
      - name: Verify security ELF dependencies
        run: |
          set -euo pipefail

          FAILED=0

          find work/integration/vendor/bin \
               work/integration/vendor/lib \
               work/integration/vendor/lib64 \
               -type f \
               2>/dev/null \
            | while IFS= read -r f; do

                if file "$f" | grep -q ELF; then
                  echo "===== $f ====="

                  readelf -d "$f" \
                    | grep NEEDED \
                    || true
                fi
              done

          echo "Security ELF verification completed."

      # ============================================================
      # 27. LOCATE SECURITY MODULE METADATA
      # ============================================================
      - name: Locate stock module metadata
        run: |
          set -euo pipefail

          : > work/analysis/security_module_sources.txt

          find work/rootfs/stock_security \
            -type f \
            \( \
              -name modules.dep \
              -o -name modules.load \
              -o -name modules.alias \
              -o -name modules.softdep \
              -o -name modules.symbols \
            \) \
            -print \
            | sort \
            | tee work/analysis/security_module_sources.txt

      # ============================================================
      # 28. RESOLVE SECURITY KERNEL MODULES
      #
      # Start with the Trusty/security modules actually present in
      # stock modules.load and then follow modules.dep.
      # ============================================================
      - name: Resolve security kernel modules
        run: |
          set -euo pipefail

          : > work/analysis/security_modules.txt

          for base in \
            gz_trusty_mod.ko \
            gz_tz_system.ko \
            gz_main_mod.ko \
            gz_ipc_mod.ko \
            gz_irq_mod.ko \
            gz_virtio_mod.ko \
            gz_log_mod.ko \
            iommu_gz.ko \
            trusted_mem.ko \
            mtk_sec_heap.ko
          do
            find work/rootfs/stock_security \
              -type f \
              -name "$base" \
              -print \
              >> work/analysis/security_modules.txt
          done

          sort -u \
            work/analysis/security_modules.txt \
            -o work/analysis/security_modules.txt

          test -s work/analysis/security_modules.txt

          cat work/analysis/security_modules.txt

      # ============================================================
      # 29. COPY SECURITY MODULE CLOSURE
      # ============================================================
      - name: Copy security kernel modules
        run: |
          set -euo pipefail

          while IFS= read -r src; do
            [ -f "$src" ] || continue

            rel="${src#work/rootfs/stock_security/}"

            case "$rel" in
              vendor/*)
                dst="work/integration/$rel"
                ;;
              vendor_boot/*)
                dst="work/integration/vendor/lib/modules/$(basename "$src")"
                ;;
              *)
                continue
                ;;
            esac

            mkdir -p "$(dirname "$dst")"

            if [ ! -e "$dst" ]; then
              cp -a "$src" "$dst"
            fi
          done < work/analysis/security_modules.txt

      # ============================================================
      # 30. COPY MODULE METADATA
      # ============================================================
      - name: Copy module metadata
        run: |
          set -euo pipefail

          for name in \
            modules.dep \
            modules.load \
            modules.alias \
            modules.softdep \
            modules.symbols
          do
            src="$(
              find work/rootfs/stock_security \
                -type f \
                -name "$name" \
                -print \
                | sort \
                | head -n1
            )"

            [ -n "$src" ] || continue

            mkdir -p work/integration/vendor/lib/modules
            cp -a "$src" "work/integration/vendor/lib/modules/$name"
          done

      # ============================================================
      # 31. COPY ACTUAL SECURITY INIT FILES
      # ============================================================
      - name: Copy security init files
        run: |
          set -euo pipefail

          while IFS= read -r src; do
            [ -f "$src" ] || continue

            if grep -Eqi \
              'keymint|gatekeeper|tee-supplicant|mitee' \
              "$src"
            then
              name="$(basename "$src")"

              mkdir -p work/integration/vendor/etc/init

              cp -a \
                "$src" \
                "work/integration/vendor/etc/init/$name"
            fi
          done < <(
            find work/rootfs/stock_security \
              -type f \
              -name '*.rc' \
              -print
          )

          find work/integration/vendor/etc/init \
            -type f \
            -print \
            | sort \
            | tee work/analysis/integrated_security_init.txt

      # ============================================================
      # 32. COPY ACTUAL VINTF SECURITY MANIFESTS
      # ============================================================
      - name: Copy security VINTF manifests
        run: |
          set -euo pipefail

          while IFS= read -r src; do
            [ -f "$src" ] || continue

            if grep -Eqi \
              'keymint|gatekeeper|keymaster' \
              "$src"
            then
              name="$(basename "$src")"

              mkdir -p work/integration/vendor/etc/vintf

              cp -a \
                "$src" \
                "work/integration/vendor/etc/vintf/$name"
            fi
          done < <(
            find work/rootfs/stock_security \
              -type f \
              \( \
                -name '*.xml' \
                -o -name '*.manifest' \
              \) \
              -print
          )

      # ============================================================
      # 33. FIND EXACT FIRMWARE / CONFIG REFERENCES
      # ============================================================
      - name: Find exact security firmware references
        run: |
          set -euo pipefail

          : > work/analysis/security_firmware_refs.txt

          find work/rootfs/stock_security \
            -type f \
            \( \
              -perm -0100 \
              -o -name '*.so' \
              -o -name '*.ko' \
              -o -name '*.rc' \
              -o -name '*.conf' \
              -o -name '*.xml' \
            \) \
            -print0 \
            | xargs -0 strings 2>/dev/null \
            | grep -E \
              '(/vendor/)?(firmware|tee|trusty|mitee|keymint|keymaster|gatekeeper)[A-Za-z0-9_./:@-]*' \
            | sort -u \
            > work/analysis/security_firmware_refs.txt \
            || true

          cat work/analysis/security_firmware_refs.txt

      # ============================================================
      # 34. COPY ONLY EXISTING REFERENCED SECURITY FIRMWARE
      # ============================================================
      - name: Copy referenced security firmware
        run: |
          set -euo pipefail

          while IFS= read -r ref; do

            case "$ref" in
              /vendor/firmware/*)
                rel="${ref#/}"
                ;;
              vendor/firmware/*)
                rel="$ref"
                ;;
              *)
                continue
                ;;
            esac

            base="$(basename "$rel")"

            [ -n "$base" ] || continue

            src="$(
              find work/rootfs/stock_security \
                -type f \
                -path "*/$rel" \
                -print \
                | sort \
                | head -n1
            )"

            if [ -z "$src" ]; then
              src="$(
                find work/rootfs/stock_security \
                  -type f \
                  -name "$base" \
                  -print \
                  | sort \
                  | head -n1
              )"
            fi

            [ -n "$src" ] || continue

            mkdir -p \
              "work/integration/$(dirname "$rel")"

            cp -a \
              "$src" \
              "work/integration/$rel"

          done < work/analysis/security_firmware_refs.txt

      # ============================================================
      # 35. STOCK FBE CONFIGURATION
      # ============================================================
      - name: Extract stock FBE configuration
        run: |
          set -euo pipefail

          : > work/analysis/stock_fbe_config.txt

          find work/rootfs/stock_security \
            -type f \
            -name 'fstab*' \
            -print0 \
            | while IFS= read -r -d '' f; do

                echo "===== $f =====" \
                  >> work/analysis/stock_fbe_config.txt

                grep -E \
                  '(/data|fileencryption|keydirectory|metadata|fsverity|inlinecrypt)' \
                  "$f" \
                  >> work/analysis/stock_fbe_config.txt \
                  || true

                echo \
                  >> work/analysis/stock_fbe_config.txt
              done

          cat work/analysis/stock_fbe_config.txt

      # ============================================================
      # 36. RECOVERY FSTAB FBE CONFIG
      #
      # Preserve existing recovery.fstab and add only the required
      # FBE-related mount flags if /data is already present.
      # ============================================================
      - name: Update recovery FBE configuration
        run: |
          set -euo pipefail

          FSTAB="recovery.fstab"

          test -f "$FSTAB"

          cp "$FSTAB" work/analysis/recovery.fstab.before

          python3 - "$FSTAB" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          lines = text.splitlines()

          out = []
          changed = False

          for line in lines:
              stripped = line.strip()

              if (
                  stripped
                  and not stripped.startswith("#")
                  and re.match(r"^\S+\s+/data\s+", stripped)
              ):
                  if "fileencryption=" not in line:
                      line += ",fileencryption=aes-256-xts:aes-256-cts:v2"

                  if "keydirectory=" not in line:
                      line += ",keydirectory=/metadata/vold/metadata_encryption"

                  if "fsverity" not in line:
                      line += ",fsverity"

                  changed = True

              out.append(line)

          if changed:
              path.write_text("\n".join(out) + "\n")
          PY

          cp "$FSTAB" work/analysis/recovery.fstab.after

          cat "$FSTAB"

      # ============================================================
      # 37. STOCK SELINUX POLICY DISCOVERY
      #
      # Do not invent a "generic perfect" policy.
      # Collect the actual stock policy references first.
      # ============================================================
      - name: Analyze stock SELinux policy
        run: |
          set -euo pipefail

          POLICY="work/analysis/stock_selinux_security.txt"

          : > "$POLICY"

          find work/rootfs/stock_security \
            -type f \
            \( \
              -name '*.te' \
              -o -name '*.cil' \
              -o -name 'file_contexts*' \
              -o -name 'service_contexts*' \
              -o -name 'hwservice_contexts*' \
              -o -name 'property_contexts*' \
              -o -name 'genfs_contexts*' \
            \) \
            -print0 \
            | while IFS= read -r -d '' f; do

                if grep -Eqi \
                  'keymint|gatekeeper|keymaster|mitee|tee|trusty' \
                  "$f"
                then
                  echo "===== $f =====" \
                    >> "$POLICY"

                  grep -Ei \
                    'keymint|gatekeeper|keymaster|mitee|tee|trusty' \
                    "$f" \
                    >> "$POLICY" \
                    || true

                  echo \
                    >> "$POLICY"
                fi
              done

          cat "$POLICY"

      # ============================================================
      # 38. BUILD RECOVERY SELINUX FROM ACTUAL EXISTING POLICY
      #
      # Only copy stock policy fragments that actually exist.
      # Never add permissive/setenforce rules.
      # ============================================================
      - name: Integrate SELinux policy
        run: |
          set -euo pipefail

          POLICY_SRC=""

          for d in \
            recovery/root/sepolicy \
            sepolicy \
            recovery/sepolicy
          do
            if [ -d "$d" ]; then
              POLICY_SRC="$d"
              break
            fi
          done

          if [ -z "$POLICY_SRC" ]; then
            echo "No standalone recovery sepolicy directory found."
            echo "Searching existing recovery policy files..."

            find recovery \
              -type f \
              \( \
                -name '*.te' \
                -o -name '*.cil' \
                -o -name '*contexts*' \
              \) \
              -print \
              | sort \
              > work/analysis/existing_recovery_policy_files.txt
          else
            find "$POLICY_SRC" \
              -type f \
              -print \
              | sort \
              > work/analysis/existing_recovery_policy_files.txt
          fi

          cat work/analysis/existing_recovery_policy_files.txt

          mkdir -p work/integration/sepolicy

          # Copy only stock policy source files that contain actual
          # security-chain references.
          find work/rootfs/stock_security \
            -type f \
            \( \
              -name '*.te' \
              -o -name '*.cil' \
              -o -name 'file_contexts*' \
              -o -name 'service_contexts*' \
              -o -name 'hwservice_contexts*' \
              -o -name 'property_contexts*' \
              -o -name 'genfs_contexts*' \
            \) \
            -print0 \
            | while IFS= read -r -d '' f; do

                if grep -Eqi \
                  'keymint|gatekeeper|keymaster|mitee|tee|trusty' \
                  "$f"
                then
                  name="$(basename "$f")"

                  cp -a \
                    "$f" \
                    "work/integration/sepolicy/$name"
                fi
              done

          # Remove duplicates by filename while preserving content.
          find work/integration/sepolicy \
            -type f \
            -printf '%f\n' \
            | sort -u \
            > work/analysis/integrated_selinux_files.txt

          cat work/analysis/integrated_selinux_files.txt

      # ============================================================
      # 39. REMOVE OF_SKIP_FBE_DECRYPTION
      # ============================================================
      - name: Enable OrangeFox FBE
        run: |
          set -euo pipefail

          FOX="fox_beryl.mk"

          test -f "$FOX"

          cp "$FOX" work/analysis/fox_beryl.mk.before

          sed -i \
            '/^[[:space:]]*OF_SKIP_FBE_DECRYPTION[[:space:]]*:=/d' \
            "$FOX"

          if grep -q \
            '^[[:space:]]*OF_SKIP_FBE_DECRYPTION' \
            "$FOX"
          then
            echo "ERROR: OF_SKIP_FBE_DECRYPTION still present"
            exit 1
          fi

          cp "$FOX" work/analysis/fox_beryl.mk.after

      # ============================================================
      # 40. COPY INTEGRATION FILES INTO RECOVERY TREE
      # ============================================================
      - name: Install security integration
        run: |
          set -euo pipefail

          mkdir -p recovery/root/vendor

          rsync -a \
            work/integration/vendor/ \
            recovery/root/vendor/

          if [ -d work/integration/sepolicy ]; then
            mkdir -p recovery/root/sepolicy

            rsync -a \
              work/integration/sepolicy/ \
              recovery/root/sepolicy/
          fi

      # ============================================================
      # 41. PRESERVE EXISTING MODULE LOAD STRUCTURE
      # ============================================================
      - name: Verify module integration
        run: |
          set -euo pipefail

          MODDIR="recovery/root/vendor/lib/modules"

          test -d "$MODDIR"

          for m in \
            gz_trusty_mod.ko \
            gz_tz_system.ko
          do
            if [ -f "$MODDIR/$m" ]; then
              echo "Present: $m"
            else
              echo "WARNING: $m not present in recovery tree"
            fi
          done

          test -f "$MODDIR/modules.load" || true

      # ============================================================
      # 42. VERIFY SECURITY SERVICES
      # ============================================================
      - name: Verify integrated security services
        run: |
          set -euo pipefail

          FOUND_KEYMINT=0
          FOUND_GATEKEEPER=0
          FOUND_TEE=0

          if find recovery/root \
            -type f \
            -name 'android.hardware.security.keymint@1.0-service.mitee' \
            | grep -q .
          then
            FOUND_KEYMINT=1
          fi

          if find recovery/root \
            -type f \
            -name 'android.hardware.gatekeeper@1.0-service.mitee' \
            | grep -q .
          then
            FOUND_GATEKEEPER=1
          fi

          if find recovery/root \
            -type f \
            -name 'tee-supplicant' \
            | grep -q .
          then
            FOUND_TEE=1
          fi

          echo "KeyMint:     $FOUND_KEYMINT"
          echo "Gatekeeper:  $FOUND_GATEKEEPER"
          echo "TEE supplicant: $FOUND_TEE"

          test "$FOUND_KEYMINT" = 1
          test "$FOUND_TEE" = 1

          # Gatekeeper is required by the stock chain if the binary
          # exists in stock. Fail only when stock actually contained it.
          if grep -q \
            'android.hardware.gatekeeper@1.0-service.mitee' \
            work/analysis/security_roots.txt
          then
            test "$FOUND_GATEKEEPER" = 1
          fi

      # ============================================================
      # 43. REJECT UNRELATED XIAOMI SERVICES
      # ============================================================
      - name: Reject unrelated Xiaomi services
        run: |
          set -euo pipefail

          BAD=0

          for name in \
            vendor.xiaomi.hardware.mfidoca \
            vendor.xiaomi.hardware.mlipay \
            vendor.xiaomi.hardware.mtdservice \
            vendor.xiaomi.hardware.tidaservice \
            vendor.xiaomi.hardware.vsimapp \
            soterservice
          do
            if find recovery/root \
              -type f \
              -name "$name" \
              | grep -q .
            then
              echo "ERROR: unrelated service copied: $name"
              BAD=1
            fi
          done

          test "$BAD" = 0

      # ============================================================
      # 44. SAFETY CHECK
      # ============================================================
      - name: Integration safety check
        run: |
          set -euo pipefail

          echo "Checking integration tree..."

          if find recovery/root/vendor \
            -type f \
            \( \
              -name '*.txt' \
              -o -name '*.sha256' \
              -o -name '*.log' \
            \) \
            | grep -q .
          then
            echo "ERROR: analysis/report file found in recovery tree"
            exit 1
          fi

          echo "No analysis files copied into recovery tree."

      # ============================================================
      # 45. SHOW CHANGES
      # ============================================================
      - name: Show changes
        run: |
          set -euo pipefail

          git status --short

          git diff -- \
            fox_beryl.mk \
            recovery.fstab \
            recovery/root \
            recovery/sepolicy \
            sepolicy \
            BoardConfig.mk \
            device.mk \
            || true

      # ============================================================
      # 46. STAGE ONLY DEVICE TREE CHANGES
      # ============================================================
      - name: Stage device tree changes
        run: |
          set -euo pipefail

          git add \
            fox_beryl.mk \
            recovery.fstab \
            recovery/root

          if [ -d recovery/sepolicy ]; then
            git add recovery/sepolicy
          fi

          if [ -d sepolicy ]; then
            git add sepolicy
          fi

          if [ -f BoardConfig.mk ]; then
            git add BoardConfig.mk
          fi

          if [ -f device.mk ]; then
            git add device.mk
          fi

          echo "===== STAGED FILES ====="

          git diff \
            --cached \
            --name-status

      # ============================================================
      # 47. ENSURE WORK IS NOT STAGED
      # ============================================================
      - name: Verify analysis is not staged
        run: |
          set -euo pipefail

          if git diff --cached --name-only | grep -E '^work/'; then
            echo "ERROR: work/ was staged"
            exit 1
          fi

          echo "No work/ files staged."

      # ============================================================
      # 48. COMMIT TO MAIN
      # ============================================================
      - name: Commit integration to main
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "beryl: integrate stock FBE security chain"

          git push origin HEAD:main

      # ============================================================
      # 49. PACKAGE ONLY ANALYSIS
      #
      # NEVER archive work/partitions.
      # ============================================================
      - name: Package analysis
        if: always()
        run: |
          set -euo pipefail

          rm -rf work/analysis_package
          mkdir -p work/analysis_package

          cp -a \
            work/analysis \
            work/analysis_package/

          cp -a \
            work/logs \
            work/analysis_package/

          tar \
            -czf \
            work/beryl-fbe-analysis.tar.gz \
            -C work \
            analysis logs

          ls -lh \
            work/beryl-fbe-analysis.tar.gz

      # ============================================================
      # 50. UPLOAD ANALYSIS ARTIFACT
      # ============================================================
      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beryl-stock-fbe-analysis
          path: |
            work/beryl-fbe-analysis.tar.gz
            work/analysis/*
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 51. FINAL STATUS
      # ============================================================
      - name: Final status
        if: always()
        run: |
          echo "================================================"
          echo "BERYL FBE INTEGRATION COMPLETE"
          echo "================================================"

          git status --short || true

          echo
          echo "Security roots:"
          cat work/analysis/security_roots.txt \
            2>/dev/null \
            || true

          echo
          echo "Security modules:"
          cat work/analysis/security_modules.txt \
            2>/dev/null \
            || true

          echo
          echo "Vendor boot:"
          cat work/analysis/vendor_boot_info.txt \
            2>/dev/null \
            || true
