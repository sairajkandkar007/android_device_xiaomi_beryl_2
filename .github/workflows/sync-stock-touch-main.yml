name: Beryl - Full Stock FBE and KeyMint Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-stock-security:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # SETUP
      # ============================================================
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            aria2 \
            unzip \
            python3 \
            python3-pip \
            e2fsprogs \
            erofs-utils \
            lz4 \
            file \
            cpio \
            rsync \
            grep \
            sed \
            awk \
            binutils \
            xz-utils \
            zstd

      - name: Install payload dumper
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install payload-dumper

      # ============================================================
      # ROM VARIABLES
      # ============================================================
      - name: Set ROM information
        run: |
          cat > rom.env <<'EOF'
          ROM_VERSION=OS1.0.4.0.UOQINXM
          ROM_FILE=miui_BERYLINGlobal_OS1.0.4.0.UOQINXM_b51bc03ea2_14.0.zip
          DEVICE=beryl
          MODEL=POCO_M7_Pro_5G
          EOF

          cat rom.env

      # ============================================================
      # FAST CDN BENCHMARK
      # ============================================================
      - name: Benchmark Xiaomi CDNs
        id: cdn
        shell: bash
        run: |
          set -e

          source rom.env

          mkdir -p benchmark

          declare -A CDNS

          CDNS["bn.d.miui.com"]="https://bn.d.miui.com/${ROM_VERSION}/${ROM_FILE}"
          CDNS["bigota.d.miui.com"]="https://bigota.d.miui.com/${ROM_VERSION}/${ROM_FILE}"
          CDNS["hugeota.d.miui.com"]="https://hugeota.d.miui.com/${ROM_VERSION}/${ROM_FILE}"

          BEST_URL=""
          BEST_SPEED=0

          echo "========================================"
          echo " FAST XIAOMI CDN BENCHMARK"
          echo "========================================"

          for CDN in "${!CDNS[@]}"; do

            URL="${CDNS[$CDN]}"

            echo
            echo "Testing: $CDN"

            START=$(date +%s.%N)

            if curl -L \
              --fail \
              --silent \
              --show-error \
              --range 0-20971519 \
              -o "benchmark/test.bin" \
              "$URL"; then

              END=$(date +%s.%N)

              SIZE=$(stat -c%s benchmark/test.bin)

              TIME=$(awk \
                "BEGIN {print $END-$START}")

              SPEED=$(awk \
                "BEGIN {printf \"%.2f\", ($SIZE/1048576)/$TIME}")

              echo "$CDN -> $SPEED MiB/s"

              echo "$SPEED $CDN $URL" \
                >> benchmark/results.txt

              if awk "BEGIN {exit !($SPEED > $BEST_SPEED)}"; then
                BEST_SPEED="$SPEED"
                BEST_URL="$URL"
              fi

            else
              echo "$CDN -> FAILED"
            fi

            rm -f benchmark/test.bin
          done

          if [ -z "$BEST_URL" ]; then
            echo "ERROR: all Xiaomi CDNs failed"
            exit 1
          fi

          echo
          echo "========================================"
          echo " FASTEST CDN"
          echo "========================================"
          echo "$BEST_SPEED MiB/s"
          echo "$BEST_URL"

          echo "BEST_URL=$BEST_URL" >> "$GITHUB_OUTPUT"
          echo "BEST_SPEED=$BEST_SPEED" >> "$GITHUB_OUTPUT"

      # ============================================================
      # DOWNLOAD ROM
      # ============================================================
      - name: Download stock ROM
        env:
          ROM_URL: ${{ steps.cdn.outputs.BEST_URL }}
        run: |
          mkdir -p stock

          echo "Downloading from:"
          echo "$ROM_URL"

          aria2c \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=20M \
            --max-tries=10 \
            --retry-wait=3 \
            --timeout=30 \
            --connect-timeout=10 \
            --continue=true \
            --file-allocation=none \
            --summary-interval=5 \
            -d stock \
            "$ROM_URL"

      # ============================================================
      # VERIFY ROM
      # ============================================================
      - name: Verify downloaded ROM
        run: |
          set -e

          ROM=$(find stock \
            -maxdepth 1 \
            -type f \
            -name '*.zip' \
            | head -1)

          test -n "$ROM"

          echo "ROM:"
          ls -lh "$ROM"

          echo
          echo "SHA256:"
          sha256sum "$ROM" | tee rom.sha256

          echo
          echo "ROM contents:"
          unzip -l "$ROM" | head -80

      # ============================================================
      # EXTRACT PAYLOAD.BIN
      # ============================================================
      - name: Extract payload.bin
        run: |
          set -e

          mkdir -p payload

          ROM=$(find stock \
            -maxdepth 1 \
            -type f \
            -name '*.zip' \
            | head -1)

          unzip -j \
            "$ROM" \
            'payload.bin' \
            -d payload

          ls -lh payload/payload.bin

      # ============================================================
      # LIST ALL PAYLOAD PARTITIONS
      # ============================================================
      - name: List payload partitions
        run: |
          mkdir -p report

          payload-dumper \
            --list \
            payload/payload.bin \
            2>&1 | tee report/payload-partitions.txt || true

      # ============================================================
      # EXTRACT ALL RELEVANT PARTITIONS
      #
      # NO SEPARATE ODM PARTITION ASSUMED
      # ============================================================
      - name: Extract stock partitions
        run: |
          set -e

          mkdir -p extracted

          payload-dumper \
            -p system \
            -p system_ext \
            -p product \
            -p vendor \
            -p vendor_dlkm \
            -p system_dlkm \
            -p init_boot \
            -o extracted \
            -j 8 \
            payload/payload.bin

          echo
          echo "Extracted partitions:"
          ls -lh extracted

      # ============================================================
      # EXTRACT VENDOR_BOOT FROM ROM ZIP IF AVAILABLE
      # ============================================================
      - name: Extract vendor_boot.img
        run: |
          set -e

          ROM=$(find stock \
            -maxdepth 1 \
            -type f \
            -name '*.zip' \
            | head -1)

          mkdir -p vendor_boot_source

          unzip -j \
            "$ROM" \
            'images/vendor_boot.img' \
            -d vendor_boot_source \
            || true

          if [ -f vendor_boot_source/vendor_boot.img ]; then
            echo "vendor_boot.img found"
            ls -lh vendor_boot_source/vendor_boot.img
          else
            echo "vendor_boot.img not directly present in ROM ZIP"
            echo "It may be contained inside another package."
          fi

      # ============================================================
      # GENERIC FILESYSTEM EXTRACTION FUNCTION
      # ============================================================
      - name: Extract partition filesystems
        shell: bash
        run: |
          set -e

          mkdir -p filesystems

          extract_image() {
            IMAGE="$1"
            NAME="$2"

            [ -f "$IMAGE" ] || return 0

            OUT="filesystems/$NAME"
            mkdir -p "$OUT"

            TYPE=$(file -b "$IMAGE")

            echo
            echo "========================================"
            echo "$NAME"
            echo "$TYPE"
            echo "========================================"

            if echo "$TYPE" | grep -qi "EROFS"; then

              fsck.erofs \
                --extract="$OUT" \
                "$IMAGE"

            elif echo "$TYPE" | grep -qi "ext4"; then

              MOUNT="/mnt/${NAME}"

              sudo mkdir -p "$MOUNT"

              sudo mount \
                -o loop,ro \
                "$IMAGE" \
                "$MOUNT"

              sudo rsync \
                -a \
                "$MOUNT/" \
                "$OUT/"

              sudo umount "$MOUNT"

            else
              echo "Unsupported filesystem: $TYPE"
            fi
          }

          extract_image extracted/system.img system
          extract_image extracted/system_ext.img system_ext
          extract_image extracted/product.img product
          extract_image extracted/vendor.img vendor
          extract_image extracted/vendor_dlkm.img vendor_dlkm
          extract_image extracted/system_dlkm.img system_dlkm

      # ============================================================
      # EXTRACT VENDOR_BOOT RAMDISK
      # ============================================================
      - name: Analyze vendor_boot
        shell: bash
        run: |
          set -e

          mkdir -p vendor_boot_analysis

          if [ ! -f vendor_boot_source/vendor_boot.img ]; then
            echo "No stock vendor_boot.img available from ROM ZIP"
            exit 0
          fi

          python3 - <<'PY'
          import struct

          path = "vendor_boot_source/vendor_boot.img"

          with open(path, "rb") as f:
              data = f.read(4096)

          if data[:8] != b"VNDRBOOT":
              raise SystemExit("Not an Android vendor_boot image")

          header_version = struct.unpack_from("<I", data, 8)[0]
          page_size = struct.unpack_from("<I", data, 12)[0]
          ramdisk_size = struct.unpack_from("<I", data, 24)[0]

          print("Vendor boot header:", header_version)
          print("Page size:", page_size)
          print("Vendor ramdisk size:", ramdisk_size)

          with open("vendor_boot_info.txt", "w") as out:
              out.write(f"header_version={header_version}\n")
              out.write(f"page_size={page_size}\n")
              out.write(f"ramdisk_size={ramdisk_size}\n")
          PY

      # ============================================================
      # GLOBAL FILE INDEX
      # ============================================================
      - name: Build complete stock file index
        run: |
          find filesystems \
            -type f \
            -o -type l \
            | sort \
            > report/all-stock-files.txt

          wc -l report/all-stock-files.txt

      # ============================================================
      # GLOBAL FSTAB SEARCH
      # ============================================================
      - name: Scan all fstab files
        shell: bash
        run: |
          {
            echo "========================================"
            echo " ALL STOCK FSTAB FILES"
            echo "========================================"

            find filesystems \
              -type f \
              \( \
                -iname 'fstab*' \
                -o \
                -iname '*fstab*' \
              \) \
              | sort

            echo
            echo "========================================"
            echo " ALL /DATA FSTAB ENTRIES"
            echo "========================================"

            grep -RniE \
              '[[:space:]]/data([[:space:]]|$)' \
              filesystems \
              2>/dev/null \
              || true

          } | tee report/FSTAB_ANALYSIS.txt

      # ============================================================
      # GLOBAL FBE SEARCH
      # ============================================================
      - name: Scan complete ROM for FBE
        shell: bash
        run: |
          {
            echo "========================================"
            echo " GLOBAL FBE SEARCH"
            echo "========================================"

            grep -RniE \
              'fileencryption|metadata_encryption|inlinecrypt|wrappedkey|keydirectory|fscrypt|cryptfs|encryptable|forceencrypt' \
              filesystems \
              2>/dev/null \
              || true

            echo
            echo "========================================"
            echo " FBE FILENAMES"
            echo "========================================"

            find filesystems \
              -type f \
              | grep -Ei \
                '(fscrypt|crypt|fbe|encryption|vold)' \
              | sort \
              || true

          } | tee report/FBE_ANALYSIS.txt

      # ============================================================
      # KEYMINT / KEYMASTER / GATEKEEPER FULL SCAN
      # ============================================================
      - name: Scan KeyMint and security stack
        shell: bash
        run: |
          {
            echo "========================================"
            echo " KEYMINT / KEYMASTER ANALYSIS"
            echo "========================================"

            echo
            echo "----- FILES -----"

            find filesystems \
              -type f \
              | grep -Ei \
                '(keymint|keymaster|gatekeeper|weaver|secure_element)' \
              | sort \
              || true

            echo
            echo "----- DIRECTORIES -----"

            find filesystems \
              -type d \
              | grep -Ei \
                '(keymint|keymaster|gatekeeper|weaver|secure_element)' \
              | sort \
              || true

            echo
            echo "----- VINTF REFERENCES -----"

            grep -RniE \
              'keymint|keymaster|gatekeeper|android.hardware.security' \
              filesystems/*/etc/vintf \
              filesystems/*/vendor/etc/vintf \
              2>/dev/null \
              || true

            echo
            echo "----- INIT REFERENCES -----"

            grep -RniE \
              'keymint|keymaster|gatekeeper|vold|keystore' \
              filesystems/*/etc/init \
              filesystems/*/vendor/etc/init \
              2>/dev/null \
              || true

          } | tee report/KEYMINT_ANALYSIS.txt

      # ============================================================
      # DETERMINE AIDL / HIDL AND VERSION REFERENCES
      # ============================================================
      - name: Determine KeyMint HAL version
        shell: bash
        run: |
          {
            echo "========================================"
            echo " KEYMINT HAL VERSION DETECTION"
            echo "========================================"

            echo
            echo "----- ANDROID.HARDWARE.SECURITY.KEYMINT -----"

            grep -RniE \
              'android\.hardware\.security\.keymint' \
              filesystems \
              2>/dev/null \
              || true

            echo
            echo "----- KEYMINT AIDL -----"

            grep -RniE \
              'android\.hardware\.security\.keymint\.IKeyMint|IKeyMint|keymint-service' \
              filesystems \
              2>/dev/null \
              || true

            echo
            echo "----- KEYMASTER HIDL -----"

            grep -RniE \
              'android\.hardware\.keymaster|IKeymaster|keymaster@' \
              filesystems \
              2>/dev/null \
              || true

            echo
            echo "----- VERSION NUMBERS NEAR KEYMINT -----"

            grep -RniE \
              'keymint.*[0-9]+\.[0-9]+|[0-9]+\.[0-9]+.*keymint|keymint.*V[0-9]+|keymint.*version' \
              filesystems \
              2>/dev/null \
              || true

          } | tee report/KEYMINT_VERSION.txt

      # ============================================================
      # VINTF MANIFEST SCAN
      # ============================================================
      - name: Scan VINTF manifests
        shell: bash
        run: |
          {
            echo "========================================"
            echo " VINTF SECURITY SERVICES"
            echo "========================================"

            find filesystems \
              -type f \
              \( \
                -name 'manifest.xml' \
                -o \
                -name '*manifest*.xml' \
                -o \
                -name '*.hal' \
              \) \
              -print \
              | sort

            echo
            echo "----- SECURITY HALS -----"

            grep -RniE \
              'keymint|keymaster|gatekeeper|security' \
              filesystems \
              2>/dev/null \
              || true

          } | tee report/VINTF_SECURITY.txt

      # ============================================================
      # VOLD / KEYSTORE / INIT SCAN
      # ============================================================
      - name: Scan vold and encryption services
        shell: bash
        run: |
          {
            echo "========================================"
            echo " VOLD / KEYSTORE / INIT"
            echo "========================================"

            find filesystems \
              -type f \
              | grep -Ei \
                '(^|/)(vold|keystore|keymint|keymaster|gatekeeper)(\.|$)' \
              | sort \
              || true

            echo
            echo "----- INIT REFERENCES -----"

            grep -RniE \
              'service .*vold|service .*keymint|service .*keymaster|service .*gatekeeper|class .*core' \
              filesystems \
              2>/dev/null \
              || true

          } | tee report/VOLD_SECURITY.txt

      # ============================================================
      # SECURITY PROPERTIES
      # ============================================================
      - name: Scan security properties
        shell: bash
        run: |
          {
            echo "========================================"
            echo " SECURITY / FBE PROPERTIES"
            echo "========================================"

            grep -RniE \
              'ro\.crypto|ro\.security|keymint|keymaster|fscrypt|vold|fbe|encrypt' \
              filesystems \
              --include='*.prop' \
              --include='*.rc' \
              --include='*.xml' \
              2>/dev/null \
              || true

          } | tee report/SECURITY_PROPERTIES.txt

      # ============================================================
      # SELINUX SECURITY SCAN
      # ============================================================
      - name: Scan SELinux security policy
        shell: bash
        run: |
          {
            echo "========================================"
            echo " SELINUX FBE / KEYMINT REFERENCES"
            echo "========================================"

            grep -RniE \
              'keymint|keymaster|gatekeeper|vold|fscrypt|keystore' \
              filesystems \
              --include='*.te' \
              --include='*.cil' \
              --include='file_contexts*' \
              --include='service_contexts*' \
              2>/dev/null \
              || true

          } | tee report/SELINUX_SECURITY.txt

      # ============================================================
      # KERNEL / MODULE CRYPTO SUPPORT
      # ============================================================
      - name: Scan stock modules for crypto and fscrypt
        shell: bash
        run: |
          {
            echo "========================================"
            echo " KERNEL MODULE SECURITY SCAN"
            echo "========================================"

            find filesystems \
              -type f \
              -name '*.ko' \
              | sort

            echo
            echo "----- CRYPTO / FSCRYPT MODULE NAMES -----"

            find filesystems \
              -type f \
              -name '*.ko' \
              | grep -Ei \
                '(crypto|fscrypt|dm-crypt|crypt|f2fs)' \
              | sort \
              || true

          } | tee report/KERNEL_CRYPTO.txt

      # ============================================================
      # STRINGS FROM KEYMINT BINARIES
      # ============================================================
      - name: Extract KeyMint binary strings
        shell: bash
        run: |
          mkdir -p report/keymint_strings

          while IFS= read -r FILE; do

            NAME=$(echo "$FILE" \
              | tr '/' '_' \
              | sed 's/^_//')

            strings "$FILE" 2>/dev/null \
              | grep -Ei \
                'keymint|keymaster|version|aidl|hidl|security' \
              | head -500 \
              > "report/keymint_strings/${NAME}.txt" \
              || true

          done < <(
            find filesystems \
              -type f \
              | grep -Ei \
                '(keymint|keymaster)'
          )

      # ============================================================
      # BUILD FINAL SUMMARY
      # ============================================================
      - name: Generate master report
        shell: bash
        run: |
          {
            echo "=================================================="
            echo " BERYL STOCK FBE + KEYMINT MASTER REPORT"
            echo "=================================================="
            echo
            echo "Device: POCO M7 Pro 5G"
            echo "Codename: beryl"
            echo "ROM: OS1.0.4.0.UOQINXM"
            echo
            echo "IMPORTANT:"
            echo "ODM is merged into vendor on this device."
            echo "No separate ODM partition is assumed."
            echo
            echo "=================================================="
            echo " FBE"
            echo "=================================================="
            cat report/FBE_ANALYSIS.txt
            echo
            echo "=================================================="
            echo " FSTAB"
            echo "=================================================="
            cat report/FSTAB_ANALYSIS.txt
            echo
            echo "=================================================="
            echo " KEYMINT"
            echo "=================================================="
            cat report/KEYMINT_ANALYSIS.txt
            echo
            echo "=================================================="
            echo " KEYMINT VERSION"
            echo "=================================================="
            cat report/KEYMINT_VERSION.txt
            echo
            echo "=================================================="
            echo " VINTF"
            echo "=================================================="
            cat report/VINTF_SECURITY.txt
            echo
            echo "=================================================="
            echo " VOLD / SECURITY"
            echo "=================================================="
            cat report/VOLD_SECURITY.txt

          } > report/MASTER_FBE_KEYMINT_REPORT.txt

      # ============================================================
      # CREATE ARCHIVE
      # ============================================================
      - name: Package analysis
        run: |
          tar -czf \
            beryl-fbe-keymint-analysis.tar.gz \
            report/

          ls -lh \
            beryl-fbe-keymint-analysis.tar.gz

      # ============================================================
      # UPLOAD REPORT
      # ============================================================
      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beryl-fbe-keymint-analysis
          path: |
            report/
            beryl-fbe-keymint-analysis.tar.gz
            rom.sha256
          retention-days: 7
