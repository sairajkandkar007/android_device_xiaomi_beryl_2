name: Beryl - Full Stock FBE and KeyMint Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-stock-security:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout device tree
        uses: actions/checkout@v4

      # ============================================================
      # INSTALL TOOLS
      # IMPORTANT:
      # Do NOT install awk. Ubuntu runner already provides awk/mawk.
      # ============================================================
      - name: Install tools
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            aria2 \
            unzip \
            python3 \
            python3-pip \
            e2fsprogs \
            erofs-utils \
            lz4 \
            file \
            cpio \
            rsync \
            binutils \
            xz-utils \
            zstd

          echo "========================================"
          echo " TOOL CHECK"
          echo "========================================"

          command -v aria2c
          command -v python3
          command -v file
          command -v awk
          command -v grep
          command -v sed
          command -v strings

          python3 --version
          aria2c --version | head -1
          file --version | head -1

          echo
          echo "Disk:"
          df -h /

      # ============================================================
      # INSTALL PAYLOAD DUMPER
      # ============================================================
      - name: Install payload dumper
        run: |
          set -e

          python3 -m pip install --upgrade pip
          python3 -m pip install payload-dumper

          echo
          echo "payload-dumper:"
          command -v payload-dumper
          payload-dumper --help | head -40

      # ============================================================
      # ROM INFORMATION
      # ============================================================
      - name: Set ROM information
        run: |
          cat > rom.env <<'EOF'
          ROM_VERSION=OS1.0.4.0.UOQINXM
          ROM_FILE=miui_BERYLINGlobal_OS1.0.4.0.UOQINXM_b51bc03ea2_14.0.zip
          DEVICE=beryl
          MODEL=POCO_M7_PRO_5G
          EOF

          cat rom.env

      # ============================================================
      # FAST XIAOMI CDN BENCHMARK
      #
      # Uses Python for speed calculation so no awk dependency.
      # ============================================================
      - name: Benchmark Xiaomi CDNs
        id: cdn
        shell: bash
        run: |
          set -e

          source rom.env

          mkdir -p benchmark

          declare -A CDNS

          CDNS["bn.d.miui.com"]="https://bn.d.miui.com/${ROM_VERSION}/${ROM_FILE}"
          CDNS["bigota.d.miui.com"]="https://bigota.d.miui.com/${ROM_VERSION}/${ROM_FILE}"
          CDNS["hugeota.d.miui.com"]="https://hugeota.d.miui.com/${ROM_VERSION}/${ROM_FILE}"

          BEST_URL=""
          BEST_SPEED=0

          echo "========================================"
          echo " FAST XIAOMI CDN BENCHMARK"
          echo "========================================"

          for CDN in "${!CDNS[@]}"; do

            URL="${CDNS[$CDN]}"

            echo
            echo "Testing: $CDN"
            echo "$URL"

            rm -f benchmark/test.bin

            START=$(python3 -c 'import time; print(time.time())')

            if curl \
              -L \
              --fail \
              --silent \
              --show-error \
              --range 0-20971519 \
              -o benchmark/test.bin \
              "$URL"; then

              END=$(python3 -c 'import time; print(time.time())')

              SPEED=$(python3 - "$START" "$END" <<'PY'
          import sys
          import os

          start = float(sys.argv[1])
          end = float(sys.argv[2])

          size = os.path.getsize("benchmark/test.bin")
          elapsed = max(end - start, 0.001)

          speed = (size / 1024 / 1024) / elapsed

          print(f"{speed:.2f}")
          PY
          )

              echo "$CDN -> $SPEED MiB/s"

              echo "$SPEED|$CDN|$URL" \
                >> benchmark/results.txt

              IS_BETTER=$(python3 - "$SPEED" "$BEST_SPEED" <<'PY'
          import sys

          current = float(sys.argv[1])
          best = float(sys.argv[2])

          print("yes" if current > best else "no")
          PY
          )

              if [ "$IS_BETTER" = "yes" ]; then
                BEST_SPEED="$SPEED"
                BEST_URL="$URL"
              fi

            else
              echo "$CDN -> FAILED"
            fi

            rm -f benchmark/test.bin
          done

          if [ -z "$BEST_URL" ]; then
            echo "ERROR: All Xiaomi CDNs failed."
            exit 1
          fi

          echo
          echo "========================================"
          echo " FASTEST CDN"
          echo "========================================"
          echo "Speed: $BEST_SPEED MiB/s"
          echo "URL:   $BEST_URL"

          {
            echo "FASTEST_CDN_SPEED=$BEST_SPEED"
            echo "FASTEST_CDN_URL=$BEST_URL"
          } > benchmark/fastest.txt

          echo "BEST_URL=$BEST_URL" >> "$GITHUB_OUTPUT"
          echo "BEST_SPEED=$BEST_SPEED" >> "$GITHUB_OUTPUT"

      # ============================================================
      # DOWNLOAD STOCK ROM
      # ============================================================
      - name: Download stock ROM
        env:
          ROM_URL: ${{ steps.cdn.outputs.BEST_URL }}
        run: |
          set -e

          mkdir -p stock

          echo "========================================"
          echo " DOWNLOADING STOCK ROM"
          echo "========================================"

          echo "URL:"
          echo "$ROM_URL"

          aria2c \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=20M \
            --max-tries=10 \
            --retry-wait=3 \
            --timeout=30 \
            --connect-timeout=10 \
            --continue=true \
            --file-allocation=none \
            --summary-interval=5 \
            --console-log-level=notice \
            -d stock \
            "$ROM_URL"

      # ============================================================
      # VERIFY ROM
      # ============================================================
      - name: Verify downloaded ROM
        run: |
          set -e

          ROM=$(find stock \
            -maxdepth 1 \
            -type f \
            -name '*.zip' \
            | head -1)

          if [ -z "$ROM" ]; then
            echo "ERROR: ROM ZIP not found."
            exit 1
          fi

          echo "ROM:"
          ls -lh "$ROM"

          echo
          echo "SHA256:"
          sha256sum "$ROM" | tee rom.sha256

          echo
          echo "ZIP entries related to partitions:"
          unzip -l "$ROM" \
            | grep -Ei \
              'payload\.bin|vendor_boot|init_boot|boot\.img|super\.img' \
            | head -100 \
            || true

      # ============================================================
      # EXTRACT PAYLOAD
      # ============================================================
      - name: Extract payload.bin
        run: |
          set -e

          mkdir -p payload

          ROM=$(find stock \
            -maxdepth 1 \
            -type f \
            -name '*.zip' \
            | head -1)

          unzip -j \
            "$ROM" \
            'payload.bin' \
            -d payload

          test -f payload/payload.bin

          ls -lh payload/payload.bin

      # ============================================================
      # GET PAYLOAD PARTITION INFORMATION
      # ============================================================
      - name: Inspect payload
        run: |
          set -e

          mkdir -p report

          echo "========================================"
          echo " PAYLOAD DUMPER HELP"
          echo "========================================"

          payload-dumper --help \
            > report/payload-dumper-help.txt \
            2>&1 \
            || true

          cat report/payload-dumper-help.txt

          echo
          echo "========================================"
          echo " PAYLOAD PARTITION INFORMATION"
          echo "========================================"

          python3 - <<'PY' \
            > report/payload-partitions.txt \
            2>&1 \
            || true
          from pathlib import Path

          p = Path("payload/payload.bin")

          print("payload.bin:")
          print("size =", p.stat().st_size)
          print()

          try:
              from payload_dumper import payload
              print("payload_dumper Python module detected.")
              print("Module:", payload)
          except Exception as e:
              print("Python payload module inspection unavailable:", e)
          PY

          cat report/payload-partitions.txt

      # ============================================================
      # EXTRACT USEFUL STOCK PARTITIONS
      #
      # We intentionally don't assume a separate ODM partition.
      # Vendor contains the merged vendor/ODM environment.
      # ============================================================
      - name: Extract stock partitions
        run: |
          set -e

          mkdir -p extracted

          echo "========================================"
          echo " EXTRACTING STOCK PARTITIONS"
          echo "========================================"

          payload-dumper \
            -p system \
            -p system_ext \
            -p product \
            -p vendor \
            -p vendor_dlkm \
            -p system_dlkm \
            -p init_boot \
            -o extracted \
            -j 8 \
            payload/payload.bin

          echo
          echo "Extracted:"
          ls -lh extracted

      # ============================================================
      # EXTRACT vendor_boot FROM ROM ZIP
      # ============================================================
      - name: Extract vendor_boot from ROM
        shell: bash
        run: |
          set -e

          mkdir -p vendor_boot_source

          ROM=$(find stock \
            -maxdepth 1 \
            -type f \
            -name '*.zip' \
            | head -1)

          echo "Searching ROM ZIP for vendor_boot..."

          unzip -l "$ROM" \
            | grep -Ei \
              '(^|/)vendor_boot(\.img)?$|vendor_boot\.img' \
            || true

          ZIP_ENTRY=$(unzip -Z1 "$ROM" \
            | grep -Ei \
              '(^|/)vendor_boot\.img$' \
            | head -1 \
            || true)

          if [ -n "$ZIP_ENTRY" ]; then

            echo "Found:"
            echo "$ZIP_ENTRY"

            unzip -j \
              "$ROM" \
              "$ZIP_ENTRY" \
              -d vendor_boot_source

          else

            echo "vendor_boot.img not directly found in ROM ZIP."

          fi

          ls -lh vendor_boot_source \
            || true

      # ============================================================
      # GENERIC FILESYSTEM EXTRACTION
      # ============================================================
      - name: Extract partition filesystems
        shell: bash
        run: |
          set -e

          mkdir -p filesystems

          extract_image() {

            IMAGE="$1"
            NAME="$2"

            if [ ! -f "$IMAGE" ]; then
              echo
              echo "Skipping missing: $IMAGE"
              return 0
            fi

            OUT="filesystems/$NAME"

            mkdir -p "$OUT"

            TYPE=$(file -b "$IMAGE")

            echo
            echo "========================================"
            echo "$NAME"
            echo "$TYPE"
            echo "========================================"

            if echo "$TYPE" | grep -qi "EROFS"; then

              fsck.erofs \
                --extract="$OUT" \
                "$IMAGE"

            elif echo "$TYPE" | grep -qi "ext4"; then

              MOUNT="/mnt/${NAME}"

              sudo mkdir -p "$MOUNT"

              sudo mount \
                -o loop,ro \
                "$IMAGE" \
                "$MOUNT"

              sudo rsync \
                -a \
                "$MOUNT/" \
                "$OUT/"

              sudo umount "$MOUNT"

            else

              echo "Unsupported filesystem:"
              echo "$TYPE"

            fi
          }

          extract_image extracted/system.img system
          extract_image extracted/system_ext.img system_ext
          extract_image extracted/product.img product
          extract_image extracted/vendor.img vendor
          extract_image extracted/vendor_dlkm.img vendor_dlkm
          extract_image extracted/system_dlkm.img system_dlkm

      # ============================================================
      # GLOBAL FILE INDEX
      # ============================================================
      - name: Build complete stock file index
        run: |
          set -e

          find filesystems \
            \( -type f -o -type l \) \
            -print \
            | sort \
            > report/all-stock-files.txt

          echo "Total indexed files:"
          wc -l report/all-stock-files.txt

      # ============================================================
      # FIND ALL FSTAB FILES
      # ============================================================
      - name: Scan all stock fstab files
        shell: bash
        run: |
          {
            echo "=================================================="
            echo " ALL STOCK FSTAB FILES"
            echo "=================================================="

            find filesystems \
              -type f \
              \( \
                -iname 'fstab*' \
                -o \
                -iname '*fstab*' \
              \) \
              -print \
              | sort

            echo
            echo "=================================================="
            echo " ALL /DATA ENTRIES"
            echo "=================================================="

            grep -RniE \
              '[[:space:]]/data([[:space:]]|$)' \
              filesystems \
              2>/dev/null \
              || true

            echo
            echo "=================================================="
            echo " FSTAB CONTENT"
            echo "=================================================="

            while IFS= read -r FILE; do

              echo
              echo "----- $FILE -----"

              cat "$FILE"

            done < <(
              find filesystems \
                -type f \
                \( \
                  -iname 'fstab*' \
                  -o \
                  -iname '*fstab*' \
                \) \
                | sort
            )

          } | tee report/FSTAB_ANALYSIS.txt

      # ============================================================
      # GLOBAL FBE SCAN
      # ============================================================
      - name: Scan complete stock ROM for FBE
        shell: bash
        run: |
          {
            echo "=================================================="
            echo " GLOBAL FBE SCAN"
            echo "=================================================="

            echo
            echo "----- FBE PARAMETERS -----"

            grep -RniE \
              'fileencryption|metadata_encryption|inlinecrypt|wrappedkey|keydirectory|fscrypt|cryptfs|encryptable|forceencrypt' \
              filesystems \
              2>/dev/null \
              || true

            echo
            echo "----- ENCRYPTION RELATED FILES -----"

            find filesystems \
              -type f \
              | grep -Ei \
                '(fscrypt|crypt|fbe|encryption|vold)' \
              | sort \
              || true

            echo
            echo "----- ENCRYPTION PROPERTIES -----"

            grep -RniE \
              'ro\.crypto|ro\.security|ro\.fscrypt|vold.*encrypt|fbe' \
              filesystems \
              --include='*.prop' \
              --include='*.rc' \
              --include='*.xml' \
              2>/dev/null \
              || true

          } | tee report/FBE_ANALYSIS.txt

      # ============================================================
      # KEYMINT / KEYMASTER / GATEKEEPER
      # ============================================================
      - name: Scan KeyMint security stack
        shell: bash
        run: |
          {
            echo "=================================================="
            echo " KEYMINT / KEYMASTER / GATEKEEPER"
            echo "=================================================="

            echo
            echo "----- SECURITY COMPONENT FILES -----"

            find filesystems \
              -type f \
              | grep -Ei \
                '(keymint|keymaster|gatekeeper|weaver|secure_element)' \
              | sort \
              || true

            echo
            echo "----- SECURITY COMPONENT DIRECTORIES -----"

            find filesystems \
              -type d \
              | grep -Ei \
                '(keymint|keymaster|gatekeeper|weaver|secure_element)' \
              | sort \
              || true

            echo
            echo "----- KEYMINT REFERENCES -----"

            grep -RniE \
              'android\.hardware\.security\.keymint|IKeyMint|keymint-service|keymint' \
              filesystems \
              2>/dev/null \
              || true

            echo
            echo "----- KEYMASTER REFERENCES -----"

            grep -RniE \
              'android\.hardware\.keymaster|IKeymaster|keymaster@|keymaster[0-9]' \
              filesystems \
              2>/dev/null \
              || true

            echo
            echo "----- GATEKEEPER REFERENCES -----"

            grep -RniE \
              'android\.hardware\.gatekeeper|IGatekeeper|gatekeeper' \
              filesystems \
              2>/dev/null \
              || true

          } | tee report/KEYMINT_ANALYSIS.txt

      # ============================================================
      # KEYMINT VERSION / AIDL / HIDL
      # ============================================================
      - name: Determine KeyMint version
        shell: bash
        run: |
          {
            echo "=================================================="
            echo " KEYMINT VERSION ANALYSIS"
            echo "=================================================="

            echo
            echo "----- AIDL KEYMINT -----"

            grep -RniE \
              'android\.hardware\.security\.keymint' \
              filesystems \
              2>/dev/null \
              || true

            echo
            echo "----- IKeyMint -----"

            grep -RniE \
              'IKeyMint|IKeyMintDevice|IKeyMintOperation' \
              filesystems \
              2>/dev/null \
              || true

            echo
            echo "----- KEYMINT SERVICE -----"

            grep -RniE \
              'keymint-service|keymint_service|keymint-service\.trusty' \
              filesystems \
              2>/dev/null \
              || true

            echo
            echo "----- VERSION STRINGS -----"

            grep -RniE \
              'keymint[^[:cntrl:]]{0,100}(v[0-9]+|[0-9]+\.[0-9]+|version)' \
              filesystems \
              2>/dev/null \
              || true

            echo
            echo "----- HIDL KEYMASTER -----"

            grep -RniE \
              'android\.hardware\.keymaster@|IKeymasterDevice' \
              filesystems \
              2>/dev/null \
              || true

          } | tee report/KEYMINT_VERSION.txt

      # ============================================================
      # VINTF
      # ============================================================
      - name: Scan VINTF manifests
        shell: bash
        run: |
          {
            echo "=================================================="
            echo " VINTF SECURITY SERVICES"
            echo "=================================================="

            echo
            echo "----- MANIFEST FILES -----"

            find filesystems \
              -type f \
              \( \
                -name 'manifest.xml' \
                -o \
                -name '*manifest*.xml' \
              \) \
              -print \
              | sort

            echo
            echo "----- KEYMINT / KEYMASTER / GATEKEEPER -----"

            grep -RniE \
              'keymint|keymaster|gatekeeper|android\.hardware\.security' \
              filesystems \
              2>/dev/null \
              || true

            echo
            echo "----- HAL FORMAT -----"

            grep -RniE \
              'format="aidl"|format="hidl"|<hal>' \
              filesystems \
              2>/dev/null \
              | grep -Ei \
                'keymint|keymaster|gatekeeper|format=' \
              || true

          } | tee report/VINTF_SECURITY.txt

      # ============================================================
      # VOLD / INIT / KEYSTORE
      # ============================================================
      - name: Scan vold and security services
        shell: bash
        run: |
          {
            echo "=================================================="
            echo " VOLD / KEYSTORE / SECURITY SERVICES"
            echo "=================================================="

            echo
            echo "----- BINARIES -----"

            find filesystems \
              -type f \
              | grep -Ei \
                '(^|/)(vold|keystore|keystore2|keymint|keymaster|gatekeeper)(\.|$)' \
              | sort \
              || true

            echo
            echo "----- INIT SERVICE DEFINITIONS -----"

            grep -RniE \
              'service .*vold|service .*keystore|service .*keymint|service .*keymaster|service .*gatekeeper' \
              filesystems \
              2>/dev/null \
              || true

            echo
            echo "----- VOLD REFERENCES -----"

            grep -RniE \
              'vold|fscrypt|cryptfs' \
              filesystems \
              --include='*.rc' \
              --include='*.xml' \
              --include='*.prop' \
              2>/dev/null \
              || true

          } | tee report/VOLD_SECURITY.txt

      # ============================================================
      # SELINUX
      # ============================================================
      - name: Scan SELinux security policy
        shell: bash
        run: |
          {
            echo "=================================================="
            echo " SELINUX SECURITY REFERENCES"
            echo "=================================================="

            grep -RniE \
              'keymint|keymaster|gatekeeper|keystore|vold|fscrypt' \
              filesystems \
              --include='*.te' \
              --include='*.cil' \
              --include='file_contexts*' \
              --include='service_contexts*' \
              2>/dev/null \
              || true

          } | tee report/SELINUX_SECURITY.txt

      # ============================================================
      # KERNEL / CRYPTO MODULE SCAN
      # ============================================================
      - name: Scan kernel crypto and fscrypt modules
        shell: bash
        run: |
          {
            echo "=================================================="
            echo " KERNEL CRYPTO / FSCRYPT MODULES"
            echo "=================================================="

            find filesystems \
              -type f \
              -name '*.ko' \
              | sort

            echo
            echo "----- CRYPTO / FBE RELATED -----"

            find filesystems \
              -type f \
              -name '*.ko' \
              | grep -Ei \
                '(crypto|fscrypt|dm-crypt|crypt|f2fs|inline)' \
              | sort \
              || true

          } | tee report/KERNEL_CRYPTO.txt

      # ============================================================
      # SECURITY LIBRARY / BINARY INVENTORY
      # ============================================================
      - name: Inventory security binaries and libraries
        shell: bash
        run: |
          {
            echo "=================================================="
            echo " SECURITY BINARIES AND LIBRARIES"
            echo "=================================================="

            find filesystems \
              -type f \
              | grep -Ei \
                '(keymint|keymaster|gatekeeper|keystore|vold|fscrypt|cryptfs)' \
              | sort \
              || true

          } | tee report/SECURITY_COMPONENTS.txt

      # ============================================================
      # EXTRACT STRINGS FROM KEYMINT BINARIES
      # ============================================================
      - name: Extract KeyMint binary strings
        shell: bash
        run: |
          set -e

          mkdir -p report/keymint_strings

          while IFS= read -r FILE; do

            SAFE_NAME=$(echo "$FILE" \
              | tr '/' '_' \
              | sed 's/^_//')

            strings "$FILE" \
              2>/dev/null \
              | grep -Ei \
                'keymint|keymaster|version|aidl|hidl|security' \
              | head -500 \
              > "report/keymint_strings/${SAFE_NAME}.txt" \
              || true

          done < <(
            find filesystems \
              -type f \
              | grep -Ei \
                '(keymint|keymaster)'
          )

      # ============================================================
      # GENERATE MASTER REPORT
      # ============================================================
      - name: Generate master report
        shell: bash
        run: |
          set -e

          {
            echo "============================================================"
            echo " BERYL STOCK FBE + KEYMINT MASTER REPORT"
            echo "============================================================"
            echo
            echo "Device: POCO M7 Pro 5G"
            echo "Codename: beryl"
            echo "ROM: OS1.0.4.0.UOQINXM"
            echo "Android userspace: Android 14"
            echo
            echo "IMPORTANT:"
            echo "This device does NOT use a separate ODM partition."
            echo "ODM content is merged into vendor."
            echo
            echo "============================================================"
            echo " FSTAB"
            echo "============================================================"
            cat report/FSTAB_ANALYSIS.txt
            echo
            echo "============================================================"
            echo " FBE"
            echo "============================================================"
            cat report/FBE_ANALYSIS.txt
            echo
            echo "============================================================"
            echo " KEYMINT"
            echo "============================================================"
            cat report/KEYMINT_ANALYSIS.txt
            echo
            echo "============================================================"
            echo " KEYMINT VERSION"
            echo "============================================================"
            cat report/KEYMINT_VERSION.txt
            echo
            echo "============================================================"
            echo " VINTF"
            echo "============================================================"
            cat report/VINTF_SECURITY.txt
            echo
            echo "============================================================"
            echo " VOLD"
            echo "============================================================"
            cat report/VOLD_SECURITY.txt
            echo
            echo "============================================================"
            echo " SELINUX"
            echo "============================================================"
            cat report/SELINUX_SECURITY.txt
            echo
            echo "============================================================"
            echo " KERNEL CRYPTO"
            echo "============================================================"
            cat report/KERNEL_CRYPTO.txt
            echo
            echo "============================================================"
            echo " SECURITY COMPONENTS"
            echo "============================================================"
            cat report/SECURITY_COMPONENTS.txt

          } > report/MASTER_FBE_KEYMINT_REPORT.txt

          echo
          echo "Master report generated:"
          wc -l report/MASTER_FBE_KEYMINT_REPORT.txt

      # ============================================================
      # PACKAGE REPORT
      # ============================================================
      - name: Package analysis
        run: |
          tar \
            -czf \
            beryl-fbe-keymint-analysis.tar.gz \
            report/

          ls -lh \
            beryl-fbe-keymint-analysis.tar.gz

      # ============================================================
      # UPLOAD RESULTS
      # ============================================================
      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beryl-stock-fbe-keymint-analysis
          path: |
            report/
            beryl-fbe-keymint-analysis.tar.gz
            rom.sha256
            benchmark/
          retention-days: 7
