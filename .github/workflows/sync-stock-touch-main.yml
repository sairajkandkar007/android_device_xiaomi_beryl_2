name: Beryl - Sync Stock Touch Files to Main

on:
  workflow_dispatch:
    inputs:
      ROM_VERSION:
        description: "Xiaomi stock ROM version"
        required: true
        default: "OS1.0.4.0.UOQINXM"
      ROM_FILENAME:
        description: "Xiaomi recovery ROM filename"
        required: true
        default: "miui_BERYLINGlobal_OS1.0.4.0.UOQINXM_b51bc03ea2_14.0.zip"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            aria2 \
            p7zip-full \
            file \
            binutils \
            kmod \
            lz4 \
            erofs-utils

          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            android-payload-dumper

          payload-dumper --version

      - name: Find fastest Xiaomi CDN
        id: cdn
        shell: bash
        env:
          ROM_VERSION: ${{ inputs.ROM_VERSION }}
          ROM_FILENAME: ${{ inputs.ROM_FILENAME }}
        run: |
          set -euo pipefail

          mkdir -p work/benchmark
          : > work/benchmark/results.txt

          candidates=(
            "https://bigota.d.miui.com/${ROM_VERSION}/${ROM_FILENAME}"
            "https://bn.d.miui.com/${ROM_VERSION}/${ROM_FILENAME}"
            "https://hugeota.d.miui.com/${ROM_VERSION}/${ROM_FILENAME}"
          )

          for url in "${candidates[@]}"; do
            name="$(echo "$url" | sed -E 's#https://([^./]+).*#\1#')"
            out="work/benchmark/${name}.bin"
            start_ns="$(date +%s%N)"

            if curl -L --fail --silent --show-error \
              --range 0-16777215 \
              --max-time 60 \
              -o "$out" "$url"; then

              end_ns="$(date +%s%N)"
              bytes="$(stat -c%s "$out")"
              elapsed_ns=$((end_ns-start_ns))

              if (( elapsed_ns > 0 )); then
                speed="$(awk -v b="$bytes" -v n="$elapsed_ns" \
                  'BEGIN { printf "%.4f", b/1048576/(n/1000000000) }')"
              else
                speed="0"
              fi

              echo "$speed $url" | tee -a work/benchmark/results.txt
            else
              echo "0 $url" | tee -a work/benchmark/results.txt
            fi
          done

          best="$(sort -nr work/benchmark/results.txt | head -n1)"
          speed="$(echo "$best" | awk '{print $1}')"
          url="$(echo "$best" | cut -d' ' -f2-)"

          if [[ -z "$url" || "$speed" == "0" ]]; then
            echo "::error::No Xiaomi CDN responded."
            exit 1
          fi

          echo "Selected Xiaomi CDN: $url"
          echo "Measured speed: ${speed} MiB/s"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Download stock ROM
        shell: bash
        env:
          ROM_URL: ${{ steps.cdn.outputs.url }}
          ROM_FILENAME: ${{ inputs.ROM_FILENAME }}
        run: |
          set -euo pipefail

          mkdir -p work/rom
          start_ns="$(date +%s%N)"

          aria2c \
            --allow-overwrite=true \
            --auto-file-renaming=false \
            --continue=true \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=1M \
            --file-allocation=none \
            --disk-cache=128M \
            --enable-http-pipelining=true \
            --reuse-uri=true \
            --summary-interval=5 \
            --timeout=30 \
            --connect-timeout=15 \
            --max-tries=8 \
            --retry-wait=1 \
            --out="$ROM_FILENAME" \
            --dir=work/rom \
            "$ROM_URL"

          end_ns="$(date +%s%N)"
          size="$(stat -c%s "work/rom/$ROM_FILENAME")"
          elapsed_ns=$((end_ns-start_ns))
          [[ "$elapsed_ns" -gt 0 ]] || elapsed_ns=1

          echo "Downloaded: $((size/1048576)) MiB"
          awk -v b="$size" -v n="$elapsed_ns" \
            'BEGIN { printf "Average download speed: %.2f MiB/s\n", b/1048576/(n/1000000000) }'

          sha256sum "work/rom/$ROM_FILENAME" | tee work/rom/SHA256SUMS

      - name: Extract payload.bin
        shell: bash
        env:
          ROM_FILENAME: ${{ inputs.ROM_FILENAME }}
        run: |
          set -euo pipefail

          mkdir -p work/rom

          7z e "work/rom/$ROM_FILENAME" \
            payload.bin \
            -so > work/rom/payload.bin

          test -s work/rom/payload.bin
          ls -lh work/rom/payload.bin

      - name: Extract required partitions
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/partitions

          payload-dumper \
            work/rom/payload.bin \
            -o work/partitions \
            -p vendor vendor_dlkm odm_dlkm vendor_boot boot dtbo vbmeta vbmeta_system vbmeta_vendor \
            -j 8

          ls -lh work/partitions

      - name: Extract vendor and vendor_dlkm
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/vendor work/vendor_dlkm

          test -f work/partitions/vendor.img
          test -f work/partitions/vendor_dlkm.img

          file work/partitions/vendor.img
          fsck.erofs --extract=work/vendor work/partitions/vendor.img

          file work/partitions/vendor_dlkm.img
          fsck.erofs --extract=work/vendor_dlkm work/partitions/vendor_dlkm.img

      - name: Verify exact stock touch files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/required/modules work/required/firmware

          modules=(
            fts_touch_i2c.ko
            xiaomi_tp.ko
            lct_tp.ko
            scp.ko
            mtk-afe-external.ko
            mtk_tinysys_ipi.ko
            mtk_rpmsg_mbox.ko
            mtk-mbox.ko
          )

          for name in "${modules[@]}"; do
            src="$(find work/vendor_dlkm -type f -name "$name" -print -quit)"
            if [[ -z "$src" ]]; then
              echo "::error::Missing required stock module: $name"
              exit 1
            fi
            cp -Lf "$src" "work/required/modules/$name"
          done

          firmware=(
            Conf_MultipleTest_ft3519t.ini
            focaltech_ts_fw_samsung_ft3519t.bin
          )

          for name in "${firmware[@]}"; do
            src="$(find work/vendor -type f -name "$name" -print -quit)"
            if [[ -z "$src" ]]; then
              echo "::error::Missing required stock firmware: $name"
              exit 1
            fi
            cp -Lf "$src" "work/required/firmware/$name"
          done

          echo "===== Required stock files ====="
          find work/required -type f -printf '%p %s bytes\n' | sort

          echo
          echo "===== SHA256 ====="
          find work/required -type f -print0 | sort -z | xargs -0 sha256sum \
            | tee work/required/SHA256SUMS

          echo
          echo "===== Module metadata ====="
          for module in work/required/modules/*.ko; do
            echo "--- $(basename "$module")"
            echo "vermagic: $(modinfo -F vermagic "$module" 2>/dev/null || true)"
            echo "depends:  $(modinfo -F depends "$module" 2>/dev/null || true)"
          done

      - name: Install verified stock files into device tree
        shell: bash
        run: |
          set -euo pipefail

          # This repository IS the beryl device tree.
          # Do not use device/xiaomi/beryl/ prefixes here.
          mkdir -p prebuilt/modules
          mkdir -p prebuilt/firmware

          cp -Lf work/required/modules/*.ko prebuilt/modules/
          cp -Lf work/required/firmware/*.bin prebuilt/firmware/
          cp -Lf work/required/firmware/*.ini prebuilt/firmware/

          {
            echo "Beryl stock touch provenance"
            echo "============================"
            echo "ROM version: ${{ inputs.ROM_VERSION }}"
            echo "ROM filename: ${{ inputs.ROM_FILENAME }}"
            echo "Repository: $GITHUB_REPOSITORY"
            echo
            echo "Required stock modules:"
            find prebuilt/modules -maxdepth 1 -type f -printf '%f\n' | sort
            echo
            echo "Required stock firmware:"
            find prebuilt/firmware -maxdepth 1 -type f -printf '%f\n' | sort
            echo
            echo "SHA256:"
            sha256sum prebuilt/modules/*.ko prebuilt/firmware/*
          } > prebuilt/STOCK_TOUCH_PROVENANCE.txt

      - name: Verify device tree integration
        shell: bash
        run: |
          set -euo pipefail

          test -f device.mk
          test -f BoardConfig.mk

          grep -F \
            'TW_LOAD_VENDOR_MODULES := "fts_touch_i2c.ko xiaomi_tp.ko lct_tp.ko scp.ko mtk-afe-external.ko mtk_tinysys_ipi.ko mtk_rpmsg_mbox.ko mtk-mbox.ko"' \
            device.mk

          grep -F 'Conf_MultipleTest_ft3519t.ini' device.mk
          grep -F 'focaltech_ts_fw_samsung_ft3519t.bin' device.mk

          for name in \
            fts_touch_i2c.ko \
            xiaomi_tp.ko \
            lct_tp.ko \
            scp.ko \
            mtk-afe-external.ko \
            mtk_tinysys_ipi.ko \
            mtk_rpmsg_mbox.ko \
            mtk-mbox.ko; do
            test -f "prebuilt/modules/$name"
          done

          test -f prebuilt/firmware/Conf_MultipleTest_ft3519t.ini
          test -f prebuilt/firmware/focaltech_ts_fw_samsung_ft3519t.bin

          echo "Device-tree integration verified."

      - name: Show pending changes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff -- device.mk BoardConfig.mk
          git diff --stat

      - name: Commit verified stock files directly to main
        shell: bash
        run: |
          set -euo pipefail

          # Only this repository's root paths are staged.
          git add \
            device.mk \
            BoardConfig.mk \
            prebuilt/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "beryl: sync stock FT3519T touch files"

          # Commit directly to main.
          git push origin HEAD:main

      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beryl-stock-touch-verification
          path: |
            work/rom/SHA256SUMS
            work/benchmark/results.txt
            work/required/
            prebuilt/STOCK_TOUCH_PROVENANCE.txt
          if-no-files-found: warn
          compression-level: 9
