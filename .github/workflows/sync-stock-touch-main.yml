name: Beryl - Full Stock FBE + KeyMint Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-stock-security:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout device tree
        uses: actions/checkout@v4

      # ============================================================
      # INSTALL SYSTEM TOOLS
      # ============================================================
      - name: Install tools
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            aria2 \
            unzip \
            python3 \
            python3-pip \
            e2fsprogs \
            erofs-utils \
            lz4 \
            file \
            cpio \
            rsync \
            binutils \
            xz-utils \
            zstd

          echo "===== TOOL CHECK ====="

          command -v aria2c
          command -v python3
          command -v file
          command -v awk
          command -v grep
          command -v sed
          command -v strings

          python3 --version
          aria2c --version | head -1

      # ============================================================
      # INSTALL PYTHON PAYLOAD DUMPER
      #
      # IMPORTANT:
      # Use the Python payload-dumper package.
      # Do NOT use android_payload_dumper.
      # ============================================================
      - name: Install Python payload dumper
        run: |
          set -e

          python3 -m pip install \
            --upgrade \
            pip

          python3 -m pip install \
            payload-dumper

          echo "===== PAYLOAD DUMPER ====="

          command -v payload-dumper

          payload-dumper --help

      # ============================================================
      # ROM INFORMATION
      # ============================================================
      - name: Set ROM information
        run: |
          cat > rom.env <<'EOF'
          ROM_VERSION=OS1.0.4.0.UOQINXM
          ROM_FILE=miui_BERYLINGlobal_OS1.0.4.0.UOQINXM_b51bc03ea2_14.0.zip
          DEVICE=beryl
          MODEL=POCO_M7_PRO_5G
          EOF

          cat rom.env

      # ============================================================
      # FAST XIAOMI CDN BENCHMARK
      # ============================================================
      - name: Benchmark Xiaomi CDNs
        id: cdn
        shell: bash
        run: |
          set -e

          source rom.env

          mkdir -p benchmark

          declare -A CDNS

          CDNS["bn.d.miui.com"]="https://bn.d.miui.com/${ROM_VERSION}/${ROM_FILE}"
          CDNS["bigota.d.miui.com"]="https://bigota.d.miui.com/${ROM_VERSION}/${ROM_FILE}"
          CDNS["hugeota.d.miui.com"]="https://hugeota.d.miui.com/${ROM_VERSION}/${ROM_FILE}"

          BEST_URL=""
          BEST_SPEED=0

          echo "========================================"
          echo " FAST XIAOMI CDN BENCHMARK"
          echo "========================================"

          for CDN in "${!CDNS[@]}"; do

            URL="${CDNS[$CDN]}"

            echo
            echo "Testing: $CDN"
            echo "$URL"

            rm -f benchmark/test.bin

            START=$(python3 -c 'import time; print(time.time())')

            if curl \
              -L \
              --fail \
              --silent \
              --show-error \
              --range 0-20971519 \
              -o benchmark/test.bin \
              "$URL"; then

              END=$(python3 -c 'import time; print(time.time())')

              SPEED=$(python3 - "$START" "$END" <<'PY'
          import sys
          import os

          start = float(sys.argv[1])
          end = float(sys.argv[2])

          size = os.path.getsize("benchmark/test.bin")
          elapsed = max(end - start, 0.001)

          speed = (size / 1024 / 1024) / elapsed

          print(f"{speed:.2f}")
          PY
          )

              echo "$CDN -> $SPEED MiB/s"

              echo "$SPEED|$CDN|$URL" \
                >> benchmark/results.txt

              BETTER=$(python3 - "$SPEED" "$BEST_SPEED" <<'PY'
          import sys

          current = float(sys.argv[1])
          best = float(sys.argv[2])

          print("yes" if current > best else "no")
          PY
          )

              if [ "$BETTER" = "yes" ]; then
                BEST_SPEED="$SPEED"
                BEST_URL="$URL"
              fi

            else
              echo "$CDN -> FAILED"
            fi

            rm -f benchmark/test.bin

          done

          if [ -z "$BEST_URL" ]; then
            echo "ERROR: All Xiaomi CDNs failed."
            exit 1
          fi

          echo
          echo "========================================"
          echo " FASTEST CDN"
          echo "========================================"
          echo "Speed: $BEST_SPEED MiB/s"
          echo "URL:   $BEST_URL"

          {
            echo "FASTEST_CDN_SPEED=$BEST_SPEED"
            echo "FASTEST_CDN_URL=$BEST_URL"
          } > benchmark/fastest.txt

          echo "BEST_URL=$BEST_URL" >> "$GITHUB_OUTPUT"
          echo "BEST_SPEED=$BEST_SPEED" >> "$GITHUB_OUTPUT"

      # ============================================================
      # DOWNLOAD ROM WITH ARIA2
      #
      # 16 connections/server
      # 16 splits
      # ============================================================
      - name: Download stock ROM
        env:
          ROM_URL: ${{ steps.cdn.outputs.BEST_URL }}
        run: |
          set -e

          mkdir -p stock

          echo "========================================"
          echo " DOWNLOADING STOCK ROM"
          echo "========================================"

          echo "$ROM_URL"

          aria2c \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=20M \
            --max-tries=10 \
            --retry-wait=3 \
            --timeout=30 \
            --connect-timeout=10 \
            --continue=true \
            --file-allocation=none \
            --summary-interval=5 \
            --console-log-level=notice \
            -d stock \
            "$ROM_URL"

      # ============================================================
      # VERIFY ROM
      # ============================================================
      - name: Verify ROM
        run: |
          set -e

          ROM=$(find stock \
            -maxdepth 1 \
            -type f \
            -name '*.zip' \
            | head -1)

          if [ -z "$ROM" ]; then
            echo "ERROR: ROM ZIP not found."
            exit 1
          fi

          echo "ROM:"
          ls -lh "$ROM"

          echo
          echo "SHA256:"
          sha256sum "$ROM" | tee rom.sha256

          echo
          echo "Important ZIP entries:"
          unzip -l "$ROM" \
            | grep -Ei \
              'payload\.bin|vendor_boot|init_boot|boot\.img' \
            | head -100 \
            || true

      # ============================================================
      # EXTRACT PAYLOAD.BIN
      # ============================================================
      - name: Extract payload.bin
        run: |
          set -e

          mkdir -p payload

          ROM=$(find stock \
            -maxdepth 1 \
            -type f \
            -name '*.zip' \
            | head -1)

          unzip -j \
            "$ROM" \
            'payload.bin' \
            -d payload

          test -f payload/payload.bin

          echo "payload.bin:"
          ls -lh payload/payload.bin

      # ============================================================
      # EXTRACT STOCK PARTITIONS USING PYTHON PAYLOAD-DUMPER
      #
      # No separate ODM partition.
      # ============================================================
      - name: Extract stock partitions
        run: |
          set -e

          mkdir -p extracted

          echo "========================================"
          echo " PYTHON PAYLOAD-DUMPER"
          echo "========================================"

          payload-dumper \
            -p system \
            -p system_ext \
            -p product \
            -p vendor \
            -p vendor_dlkm \
            -p system_dlkm \
            -p init_boot \
            -o extracted \
            -j 8 \
            payload/payload.bin

          echo
          echo "========================================"
          echo " EXTRACTED PARTITIONS"
          echo "========================================"

          ls -lh extracted

      # ============================================================
      # EXTRACT VENDOR_BOOT IF PRESENT IN ROM ZIP
      # ============================================================
      - name: Extract vendor_boot from ROM ZIP
        shell: bash
        run: |
          set -e

          mkdir -p vendor_boot_source

          ROM=$(find stock \
            -maxdepth 1 \
            -type f \
            -name '*.zip' \
            | head -1)

          ENTRY=$(unzip -Z1 "$ROM" \
            | grep -Ei \
              '(^|/)vendor_boot\.img$' \
            | head -1 \
            || true)

          if [ -n "$ENTRY" ]; then

            echo "Found vendor_boot:"
            echo "$ENTRY"

            unzip -j \
              "$ROM" \
              "$ENTRY" \
              -d vendor_boot_source

          else

            echo "No standalone vendor_boot.img in ROM ZIP."

          fi

          ls -lh vendor_boot_source \
            || true

      # ============================================================
      # EXTRACT PARTITION FILESYSTEMS
      # ============================================================
      - name: Extract partition filesystems
        shell: bash
        run: |
          set -e

          mkdir -p filesystems

          extract_image() {

            IMAGE="$1"
            NAME="$2"

            if [ ! -f "$IMAGE" ]; then
              echo "Skipping missing $IMAGE"
              return 0
            fi

            OUT="filesystems/$NAME"

            mkdir -p "$OUT"

            TYPE=$(file -b "$IMAGE")

            echo
            echo "========================================"
            echo "$NAME"
            echo "$TYPE"
            echo "========================================"

            if echo "$TYPE" | grep -qi "EROFS"; then

              fsck.erofs \
                --extract="$OUT" \
                "$IMAGE"

            elif echo "$TYPE" | grep -qi "ext4"; then

              MOUNT="/mnt/${NAME}"

              sudo mkdir -p "$MOUNT"

              sudo mount \
                -o loop,ro \
                "$IMAGE" \
                "$MOUNT"

              sudo rsync \
                -a \
                "$MOUNT/" \
                "$OUT/"

              sudo umount "$MOUNT"

            else

              echo "Unsupported filesystem: $TYPE"

            fi
          }

          extract_image extracted/system.img system
          extract_image extracted/system_ext.img system_ext
          extract_image extracted/product.img product
          extract_image extracted/vendor.img vendor
          extract_image extracted/vendor_dlkm.img vendor_dlkm
          extract_image extracted/system_dlkm.img system_dlkm

      # ============================================================
      # COMPLETE FILE INDEX
      # ============================================================
      - name: Build complete file index
        run: |
          set -e

          mkdir -p report

          find filesystems \
            \( -type f -o -type l \) \
            -print \
            | sort \
            > report/all-stock-files.txt

          echo "Indexed files:"
          wc -l report/all-stock-files.txt

      # ============================================================
      # FSTAB SCAN
      # ============================================================
      - name: Scan all fstab files
        shell: bash
        run: |
          {
            echo "=================================================="
            echo " ALL STOCK FSTAB FILES"
            echo "=================================================="

            find filesystems \
              -type f \
              \( \
                -iname 'fstab*' \
                -o \
                -iname '*fstab*' \
              \) \
              -print \
              | sort

            echo
            echo "=================================================="
            echo " ALL /DATA ENTRIES"
            echo "=================================================="

            grep -RniE \
              '[[:space:]]/data([[:space:]]|$)' \
              filesystems \
              2>/dev/null \
              || true

            echo
            echo "=================================================="
            echo " FSTAB CONTENT"
            echo "=================================================="

            while IFS= read -r FILE; do

              echo
              echo "----- $FILE -----"

              cat "$FILE"

            done < <(
              find filesystems \
                -type f \
                \( \
                  -iname 'fstab*' \
                  -o \
                  -iname '*fstab*' \
                \) \
                | sort
            )

          } | tee report/FSTAB_ANALYSIS.txt

      # ============================================================
      # FULL FBE SCAN
      # ============================================================
      - name: Scan complete ROM for FBE
        shell: bash
        run: |
          {
            echo "=================================================="
            echo " GLOBAL FBE SCAN"
            echo "=================================================="

            echo
            echo "----- FBE PARAMETERS -----"

            grep -RniE \
              'fileencryption|metadata_encryption|inlinecrypt|wrappedkey|keydirectory|fscrypt|cryptfs|encryptable|forceencrypt' \
              filesystems \
              2>/dev/null \
              || true

            echo
            echo "----- FBE RELATED FILES -----"

            find filesystems \
              -type f \
              | grep -Ei \
                '(fscrypt|crypt|fbe|encryption|vold)' \
              | sort \
              || true

            echo
            echo "----- FBE PROPERTIES -----"

            grep -RniE \
              'ro\.crypto|ro\.security|ro\.fscrypt|vold.*encrypt|fbe' \
              filesystems \
              --include='*.prop' \
              --include='*.rc' \
              --include='*.xml' \
              2>/dev/null \
              || true

          } | tee report/FBE_ANALYSIS.txt

      # ============================================================
      # KEYMINT / KEYMASTER / GATEKEEPER
      # ============================================================
      - name: Scan KeyMint security stack
        shell: bash
        run: |
          {
            echo "=================================================="
            echo " KEYMINT / KEYMASTER / GATEKEEPER"
            echo "=================================================="

            echo
            echo "----- FILES -----"

            find filesystems \
              -type f \
              | grep -Ei \
                '(keymint|keymaster|gatekeeper|weaver|secure_element)' \
              | sort \
              || true

            echo
            echo "----- DIRECTORIES -----"

            find filesystems \
              -type d \
              | grep -Ei \
                '(keymint|keymaster|gatekeeper|weaver|secure_element)' \
              | sort \
              || true

            echo
            echo "----- KEYMINT REFERENCES -----"

            grep -RniE \
              'android\.hardware\.security\.keymint|IKeyMint|IKeyMintDevice|keymint-service|keymint' \
              filesystems \
              2>/dev/null \
              || true

            echo
            echo "----- KEYMASTER REFERENCES -----"

            grep -RniE \
              'android\.hardware\.keymaster|IKeymaster|keymaster@|keymaster[0-9]' \
              filesystems \
              2>/dev/null \
              || true

            echo
            echo "----- GATEKEEPER REFERENCES -----"

            grep -RniE \
              'android\.hardware\.gatekeeper|IGatekeeper|gatekeeper' \
              filesystems \
              2>/dev/null \
              || true

          } | tee report/KEYMINT_ANALYSIS.txt

      # ============================================================
      # KEYMINT VERSION / AIDL / HIDL
      # ============================================================
      - name: Determine KeyMint version
        shell: bash
        run: |
          {
            echo "=================================================="
            echo " KEYMINT VERSION ANALYSIS"
            echo "=================================================="

            echo
            echo "----- KEYMINT HAL -----"

            grep -RniE \
              'android\.hardware\.security\.keymint' \
              filesystems \
              2>/dev/null \
              || true

            echo
            echo "----- IKeyMint -----"

            grep -RniE \
              'IKeyMint|IKeyMintDevice|IKeyMintOperation' \
              filesystems \
              2>/dev/null \
              || true

            echo
            echo "----- KEYMINT SERVICE -----"

            grep -RniE \
              'keymint-service|keymint_service|keymint-service\.trusty' \
              filesystems \
              2>/dev/null \
              || true

            echo
            echo "----- KEYMINT VERSION STRINGS -----"

            grep -RniE \
              'keymint[^[:cntrl:]]{0,100}(v[0-9]+|[0-9]+\.[0-9]+|version)' \
              filesystems \
              2>/dev/null \
              || true

            echo
            echo "----- KEYMASTER HIDL -----"

            grep -RniE \
              'android\.hardware\.keymaster@|IKeymasterDevice' \
              filesystems \
              2>/dev/null \
              || true

          } | tee report/KEYMINT_VERSION.txt

      # ============================================================
      # VINTF
      # ============================================================
      - name: Scan VINTF
        shell: bash
        run: |
          {
            echo "=================================================="
            echo " VINTF SECURITY SERVICES"
            echo "=================================================="

            echo
            echo "----- MANIFEST FILES -----"

            find filesystems \
              -type f \
              \( \
                -name 'manifest.xml' \
                -o \
                -name '*manifest*.xml' \
              \) \
              -print \
              | sort

            echo
            echo "----- SECURITY HALS -----"

            grep -RniE \
              'keymint|keymaster|gatekeeper|android\.hardware\.security' \
              filesystems \
              2>/dev/null \
              || true

            echo
            echo "----- AIDL / HIDL -----"

            grep -RniE \
              'format="aidl"|format="hidl"' \
              filesystems \
              2>/dev/null \
              || true

          } | tee report/VINTF_SECURITY.txt

      # ============================================================
      # VOLD / KEYSTORE / INIT
      # ============================================================
      - name: Scan vold and security services
        shell: bash
        run: |
          {
            echo "=================================================="
            echo " VOLD / KEYSTORE / SECURITY SERVICES"
            echo "=================================================="

            echo
            echo "----- SECURITY BINARIES -----"

            find filesystems \
              -type f \
              | grep -Ei \
                '(^|/)(vold|keystore|keystore2|keymint|keymaster|gatekeeper)(\.|$)' \
              | sort \
              || true

            echo
            echo "----- INIT SERVICE DEFINITIONS -----"

            grep -RniE \
              'service .*vold|service .*keystore|service .*keymint|service .*keymaster|service .*gatekeeper' \
              filesystems \
              2>/dev/null \
              || true

            echo
            echo "----- VOLD / FSCRYPT REFERENCES -----"

            grep -RniE \
              'vold|fscrypt|cryptfs' \
              filesystems \
              --include='*.rc' \
              --include='*.xml' \
              --include='*.prop' \
              2>/dev/null \
              || true

          } | tee report/VOLD_SECURITY.txt

      # ============================================================
      # SELINUX
      # ============================================================
      - name: Scan SELinux security policy
        shell: bash
        run: |
          {
            echo "=================================================="
            echo " SELINUX SECURITY REFERENCES"
            echo "=================================================="

            grep -RniE \
              'keymint|keymaster|gatekeeper|keystore|vold|fscrypt' \
              filesystems \
              --include='*.te' \
              --include='*.cil' \
              --include='file_contexts*' \
              --include='service_contexts*' \
              2>/dev/null \
              || true

          } | tee report/SELINUX_SECURITY.txt

      # ============================================================
      # KERNEL CRYPTO / FSCRYPT MODULES
      # ============================================================
      - name: Scan crypto and fscrypt modules
        shell: bash
        run: |
          {
            echo "=================================================="
            echo " KERNEL CRYPTO / FSCRYPT"
            echo "=================================================="

            echo
            echo "----- ALL MODULES -----"

            find filesystems \
              -type f \
              -name '*.ko' \
              | sort

            echo
            echo "----- CRYPTO / FSCRYPT RELATED -----"

            find filesystems \
              -type f \
              -name '*.ko' \
              | grep -Ei \
                '(crypto|fscrypt|dm-crypt|crypt|f2fs|inline)' \
              | sort \
              || true

          } | tee report/KERNEL_CRYPTO.txt

      # ============================================================
      # SECURITY COMPONENT INVENTORY
      # ============================================================
      - name: Security component inventory
        shell: bash
        run: |
          {
            echo "=================================================="
            echo " SECURITY COMPONENT INVENTORY"
            echo "=================================================="

            find filesystems \
              -type f \
              | grep -Ei \
                '(keymint|keymaster|gatekeeper|keystore|vold|fscrypt|cryptfs)' \
              | sort \
              || true

          } | tee report/SECURITY_COMPONENTS.txt

      # ============================================================
      # EXTRACT KEYMINT STRINGS
      # ============================================================
      - name: Extract KeyMint binary strings
        shell: bash
        run: |
          set -e

          mkdir -p report/keymint_strings

          while IFS= read -r FILE; do

            SAFE_NAME=$(echo "$FILE" \
              | tr '/' '_' \
              | sed 's/^_//')

            strings "$FILE" \
              2>/dev/null \
              | grep -Ei \
                'keymint|keymaster|version|aidl|hidl|security' \
              | head -500 \
              > "report/keymint_strings/${SAFE_NAME}.txt" \
              || true

          done < <(
            find filesystems \
              -type f \
              | grep -Ei \
                '(keymint|keymaster)'
          )

      # ============================================================
      # GENERATE MASTER REPORT
      # ============================================================
      - name: Generate master report
        shell: bash
        run: |
          set -e

          {
            echo "============================================================"
            echo " BERYL STOCK FBE + KEYMINT MASTER REPORT"
            echo "============================================================"
            echo
            echo "Device: POCO M7 Pro 5G"
            echo "Codename: beryl"
            echo "ROM: OS1.0.4.0.UOQINXM"
            echo "Android userspace: Android 14"
            echo
            echo "ODM MODEL:"
            echo "No separate ODM partition."
            echo "ODM content is merged into vendor."
            echo
            echo "============================================================"
            echo " FSTAB"
            echo "============================================================"
            cat report/FSTAB_ANALYSIS.txt

            echo
            echo "============================================================"
            echo " FBE"
            echo "============================================================"
            cat report/FBE_ANALYSIS.txt

            echo
            echo "============================================================"
            echo " KEYMINT"
            echo "============================================================"
            cat report/KEYMINT_ANALYSIS.txt

            echo
            echo "============================================================"
            echo " KEYMINT VERSION"
            echo "============================================================"
            cat report/KEYMINT_VERSION.txt

            echo
            echo "============================================================"
            echo " VINTF"
            echo "============================================================"
            cat report/VINTF_SECURITY.txt

            echo
            echo "============================================================"
            echo " VOLD / SECURITY"
            echo "============================================================"
            cat report/VOLD_SECURITY.txt

            echo
            echo "============================================================"
            echo " SELINUX"
            echo "============================================================"
            cat report/SELINUX_SECURITY.txt

            echo
            echo "============================================================"
            echo " KERNEL CRYPTO"
            echo "============================================================"
            cat report/KERNEL_CRYPTO.txt

            echo
            echo "============================================================"
            echo " SECURITY COMPONENTS"
            echo "============================================================"
            cat report/SECURITY_COMPONENTS.txt

          } > report/MASTER_FBE_KEYMINT_REPORT.txt

          echo "Master report:"
          wc -l report/MASTER_FBE_KEYMINT_REPORT.txt

      # ============================================================
      # PACKAGE EVERYTHING
      # ============================================================
      - name: Package analysis
        run: |
          tar \
            -czf \
            beryl-fbe-keymint-analysis.tar.gz \
            report/

          ls -lh \
            beryl-fbe-keymint-analysis.tar.gz

      # ============================================================
      # UPLOAD RESULTS
      # ============================================================
      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beryl-stock-fbe-keymint-analysis
          path: |
            report/
            beryl-fbe-keymint-analysis.tar.gz
            rom.sha256
            benchmark/
          retention-days: 7
