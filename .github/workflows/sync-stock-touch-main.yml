name: Beryl Stock FBE KeyMint Analysis

on:
  workflow_dispatch:
    inputs:
      ROM_VERSION:
        description: "Xiaomi stock ROM version"
        required: true
        default: "OS1.0.4.0.UOQINXM"

      ROM_FILENAME:
        description: "Xiaomi recovery ROM filename"
        required: true
        default: "miui_BERYLINGlobal_OS1.0.4.0.UOQINXM_b51bc03ea2_14.0.zip"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # INSTALL TOOLS
      # ============================================================

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            aria2 \
            unzip \
            file \
            binutils \
            kmod \
            lz4 \
            erofs-utils \
            e2fsprogs \
            cpio \
            rsync \
            xz-utils \
            zstd \
            android-sdk-libsparse-utils

          python3 -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --user \
            android-payload-dumper==2.3.0

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"

          echo
          echo "===== TOOL CHECK ====="

          command -v aria2c
          command -v fsck.erofs
          command -v simg2img
          command -v lz4
          command -v cpio
          command -v strings

          echo
          echo "===== PAYLOAD DUMPER ====="

          python3 -m payload_dumper --version

          echo
          echo "Tools installed successfully."


      # ============================================================
      # FASTEST XIAOMI CDN
      # SAME LOGIC AS PREVIOUS WORKFLOW
      # ============================================================

      - name: Find fastest Xiaomi CDN
        id: cdn
        shell: bash
        env:
          ROM_VERSION: ${{ inputs.ROM_VERSION }}
          ROM_FILENAME: ${{ inputs.ROM_FILENAME }}

        run: |
          set -euo pipefail

          mkdir -p work/benchmark
          : > work/benchmark/results.txt

          candidates=(
            "https://bigota.d.miui.com/${ROM_VERSION}/${ROM_FILENAME}"
            "https://bn.d.miui.com/${ROM_VERSION}/${ROM_FILENAME}"
            "https://hugeota.d.miui.com/${ROM_VERSION}/${ROM_FILENAME}"
          )

          for url in "${candidates[@]}"; do

            name="$(echo "$url" | sed -E 's#https://([^/]+)/.*#\1#')"

            output="work/benchmark/${name}.bin"

            echo
            echo "========================================"
            echo "Testing: $name"
            echo "========================================"

            start="$(date +%s)"

            if curl \
              -L \
              --fail \
              --silent \
              --show-error \
              --range 0-6677215 \
              --max-time 60 \
              -o "$output" \
              "$url"; then

              end="$(date +%s)"

              bytes="$(stat -c %s "$output")"

              elapsed=$((end - start))

              if [ "$elapsed" -le 0 ]; then
                elapsed=1
              fi

              speed="$(
                awk \
                  -v bytes="$bytes" \
                  -v elapsed="$elapsed" \
                  'BEGIN {
                    printf "%.4f", bytes / 1048576 / elapsed
                  }'
              )"

              echo "$speed $url" \
                | tee -a work/benchmark/results.txt

            else

              echo "FAILED $url" \
                | tee -a work/benchmark/results.txt

            fi

            rm -f "$output"

          done

          echo
          echo "========================================"
          echo "CDN RESULTS"
          echo "========================================"

          cat work/benchmark/results.txt

          best="$(
            grep -E '^[0-9]' work/benchmark/results.txt \
              | sort -nr \
              | head -n1
          )"

          if [ -z "$best" ]; then
            echo "No working Xiaomi CDN found."
            exit 1
          fi

          speed="$(echo "$best" | cut -d' ' -f1)"
          url="$(echo "$best" | cut -d' ' -f2-)"

          echo
          echo "FASTEST CDN:"
          echo "$url"
          echo "Speed: $speed MiB/s"

          echo "BEST_URL=$url" >> "$GITHUB_OUTPUT"
          echo "BEST_SPEED=$speed" >> "$GITHUB_OUTPUT"

      # ============================================================
      # DOWNLOAD ROM
      # SAME ARIA2 LOGIC
      # ============================================================

      - name: Download stock ROM
        shell: bash
        env:
          ROM_URL: ${{ steps.cdn.outputs.BEST_URL }}
          ROM_FILENAME: ${{ inputs.ROM_FILENAME }}

        run: |
          set -euo pipefail

          mkdir -p work/rom

          aria2c \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=20M \
            --max-tries=10 \
            --retry-wait=3 \
            --timeout=60 \
            --connect-timeout=15 \
            --continue=true \
            --file-allocation=none \
            --summary-interval=5 \
            --console-log-level=notice \
            -d work/rom \
            -o "$ROM_FILENAME" \
            "$ROM_URL"

          echo
          ls -lh "work/rom/$ROM_FILENAME"


      # ============================================================
      # VERIFY ROM
      # ============================================================

      - name: Verify ROM
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            "work/rom/${{ inputs.ROM_FILENAME }}" \
            | tee work/rom.sha256

          unzip -t \
            "work/rom/${{ inputs.ROM_FILENAME }}" \
            > work/rom-zip-test.txt

          echo "ROM ZIP verified."


      # ============================================================
      # EXTRACT PAYLOAD.BIN
      # ============================================================

      - name: Extract payload.bin
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/payload

          unzip -j \
            "work/rom/${{ inputs.ROM_FILENAME }}" \
            "payload.bin" \
            -d work/payload

          test -f work/payload/payload.bin

          ls -lh work/payload/payload.bin


      # ============================================================
      # LIST PAYLOAD PARTITIONS
      #
      # THIS PREVENTS FAILURE IF A REQUESTED PARTITION IS NOT
      # PRESENT IN THIS PARTICULAR OTA.
      # ============================================================

      - name: List payload partitions
        shell: bash
        run: |
          set -euo pipefail

          python3 -m payload_dumper \
            work/payload/payload.bin \
            -l \
            --json \
            > work/payload/partitions.json

          cat work/payload/partitions.json


      # ============================================================
      # SELECT PARTITIONS
      #
      # SAME TARGETS AS PREVIOUS WORKFLOW.
      # ODM IS NOT REQUESTED BECAUSE BERYL HAS MERGED ODM.
      # ============================================================

      - name: Select available partitions
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json

          with open("work/payload/partitions.json", "r") as f:
              data = json.load(f)

          names = set()

          def walk(obj):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      if k in ("name", "partition", "partition_name"):
                          if isinstance(v, str):
                              names.add(v)
                      walk(v)

              elif isinstance(obj, list):
                  for item in obj:
                      walk(item)

          walk(data)

          wanted = [
              "vendor",
              "vendor_dlkm",
              "system",
              "system_ext",
              "product",
              "system_dlkm",
              "init_boot",
              "boot",
              "vendor_boot",
              "dtbo",
              "vbmeta",
              "vbmeta_system",
              "vbmeta_vendor",
          ]

          selected = [x for x in wanted if x in names]

          if not selected:
              raise SystemExit("No requested partitions were found.")

          print("Available requested partitions:")

          for item in selected:
              print(item)

          with open("work/payload/selected.txt", "w") as f:
              f.write(" ".join(selected))
          PY

          echo
          echo "===== SELECTED ====="
          cat work/payload/selected.txt


      # ============================================================
      # PAYLOAD DUMPER
      #
      # SAME LOGIC:
      #
      # payload.bin
      #     ↓
      # payload-dumper
      #     ↓
      # selected .img files
      #
      # We invoke it through Python so PATH cannot break the job.
      # ============================================================

      - name: Extract stock partitions
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/partitions

          read -r -a PARTITIONS < work/payload/selected.txt

          python3 -m payload_dumper \
            work/payload/payload.bin \
            -o work/partitions \
            -p "${PARTITIONS[@]}" \
            -j 8

          echo
          echo "========================================"
          echo "EXTRACTED PARTITIONS"
          echo "========================================"

          find work/partitions \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort


      # ============================================================
      # EXTRACT FILESYSTEMS
      # SAME EROFS LOGIC USED FOR VENDOR_DLKMS
      # ============================================================

      - name: Extract partition filesystems
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/extracted

          extract_partition() {

            image="$1"
            name="$2"

            if [ ! -f "$image" ]; then
              echo "SKIP: $image"
              return 0
            fi

            mkdir -p "work/extracted/$name"

            type="$(file -b "$image")"

            echo
            echo "========================================"
            echo "$name"
            echo "$type"
            echo "========================================"

            if echo "$type" | grep -qi "EROFS"; then

              fsck.erofs \
                --extract="work/extracted/$name" \
                "$image"

            elif echo "$type" | grep -qi "Android sparse"; then

              raw="work/extracted/${name}.raw.img"

              simg2img \
                "$image" \
                "$raw"

              mountpoint="/mnt/beryl_$name"

              sudo mkdir -p "$mountpoint"

              sudo mount \
                -o loop,ro \
                "$raw" \
                "$mountpoint"

              sudo rsync \
                -a \
                "$mountpoint/" \
                "work/extracted/$name/"

              sudo umount "$mountpoint"

              rm -f "$raw"

            elif echo "$type" | grep -qi "ext4"; then

              mountpoint="/mnt/beryl_$name"

              sudo mkdir -p "$mountpoint"

              sudo mount \
                -o loop,ro \
                "$image" \
                "$mountpoint"

              sudo rsync \
                -a \
                "$mountpoint/" \
                "work/extracted/$name/"

              sudo umount "$mountpoint"

            else

              echo "No filesystem extraction for: $type"

            fi
          }

          extract_partition \
            work/partitions/vendor.img \
            vendor

          extract_partition \
            work/partitions/vendor_dlkm.img \
            vendor_dlkm

          extract_partition \
            work/partitions/system.img \
            system

          extract_partition \
            work/partitions/system_ext.img \
            system_ext

          extract_partition \
            work/partitions/product.img \
            product

          extract_partition \
            work/partitions/system_dlkm.img \
            system_dlkm


      # ============================================================
      # COMPLETE FILE INVENTORY
      # ============================================================

      - name: Create file inventory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/report

          find work/extracted \
            -print \
            | sort \
            > work/report/all-files.txt

          echo "Total entries:"
          wc -l work/report/all-files.txt


      # ============================================================
      # VENDOR_DLKMS MODULE ANALYSIS
      # ============================================================

      - name: Analyze vendor_dlkm modules
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=============================================="
            echo "BERYL VENDOR_DLKMS MODULE ANALYSIS"
            echo "=============================================="

            echo
            echo "===== MODULE COUNT ====="

            find work/extracted/vendor_dlkm \
              -type f \
              -name "*.ko" \
              | wc -l

            echo
            echo "===== MODULES ====="

            find work/extracted/vendor_dlkm \
              -type f \
              -name "*.ko" \
              | sort

            echo
            echo "===== MODULES.LOAD ====="

            find work/extracted/vendor_dlkm \
              -type f \
              -name "modules.load" \
              -print \
              -exec cat {} \;

            echo
            echo "===== MODULES.DEP ====="

            find work/extracted/vendor_dlkm \
              -type f \
              -name "modules.dep" \
              -print \
              -exec cat {} \;

          } > work/report/vendor-dlkm-analysis.txt


      # ============================================================
      # MODULE VERMAGIC
      # ============================================================

      - name: Analyze module vermagic
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=============================================="
            echo "MODULE VERMAGIC"
            echo "=============================================="

            while IFS= read -r module; do

              echo
              echo "----- $module -----"

              modinfo \
                -F vermagic \
                "$module" \
                2>/dev/null \
                || true

            done < <(
              find work/extracted \
                -type f \
                -name "*.ko" \
                | sort
            )

          } > work/report/module-vermagic.txt


      # ============================================================
      # MODULE DEPENDENCIES
      # ============================================================

      - name: Analyze module dependencies
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=============================================="
            echo "MODULE DEPENDENCIES"
            echo "=============================================="

            while IFS= read -r dep; do

              echo
              echo "----- $dep -----"

              cat "$dep"

            done < <(
              find work/extracted \
                -type f \
                -name "modules.dep" \
                | sort
            )

          } > work/report/module-dependencies.txt


      # ============================================================
      # FIRMWARE REFERENCES FROM MODULES
      # ============================================================

      - name: Analyze module firmware references
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/report/firmware-references

          while IFS= read -r module; do

            name="$(basename "$module")"

            strings "$module" \
              2>/dev/null \
              | grep -Ei \
                'request_firmware|firmware|/odm/firmware|/vendor/firmware|\.bin|\.fw' \
              | sort -u \
              > "work/report/firmware-references/$name.txt" \
              || true

          done < <(
            find work/extracted \
              -type f \
              -name "*.ko" \
              | sort
          )


      # ============================================================
      # FSTAB
      # ============================================================

      - name: Analyze fstab
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=============================================="
            echo "ALL FSTAB FILES"
            echo "=============================================="

            find work/extracted \
              -type f \
              \( \
                -iname "fstab*" \
                -o \
                -iname "*fstab*" \
              \) \
              | sort

            echo
            echo "=============================================="
            echo "FSTAB CONTENT"
            echo "=============================================="

            while IFS= read -r file; do

              echo
              echo "----- $file -----"

              cat "$file"

            done < <(
              find work/extracted \
                -type f \
                \( \
                  -iname "fstab*" \
                  -o \
                  -iname "*fstab*" \
                \) \
                | sort
            )

          } > work/report/fstab-analysis.txt


      # ============================================================
      # FBE
      # ============================================================

      - name: Analyze FBE configuration
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=============================================="
            echo "FBE CONFIGURATION"
            echo "=============================================="

            echo
            echo "===== fileencryption ====="

            grep -RniE \
              "fileencryption" \
              work/extracted \
              2>/dev/null \
              || true

            echo
            echo "===== metadata_encryption ====="

            grep -RniE \
              "metadata_encryption" \
              work/extracted \
              2>/dev/null \
              || true

            echo
            echo "===== keydirectory ====="

            grep -RniE \
              "keydirectory" \
              work/extracted \
              2>/dev/null \
              || true

            echo
            echo "===== inlinecrypt ====="

            grep -RniE \
              "inlinecrypt" \
              work/extracted \
              2>/dev/null \
              || true

            echo
            echo "===== wrappedkey ====="

            grep -RniE \
              "wrappedkey" \
              work/extracted \
              2>/dev/null \
              || true

            echo
            echo "===== fscrypt ====="

            grep -RniE \
              "fscrypt" \
              work/extracted \
              2>/dev/null \
              || true

            echo
            echo "===== cryptfs ====="

            grep -RniE \
              "cryptfs" \
              work/extracted \
              2>/dev/null \
              || true

          } > work/report/fbe-analysis.txt


      # ============================================================
      # VOLD
      # ============================================================

      - name: Analyze vold
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=============================================="
            echo "VOLD ANALYSIS"
            echo "=============================================="

            echo
            echo "===== VOLD FILES ====="

            find work/extracted \
              -type f \
              | grep -E '/vold$|/vold\.' \
              | sort \
              || true

            echo
            echo "===== VOLD REFERENCES ====="

            grep -RniE \
              "vold|fscrypt|cryptfs|mount_all|post-fs-data" \
              work/extracted \
              2>/dev/null \
              || true

          } > work/report/vold-analysis.txt


      # ============================================================
      # KEYMINT / KEYMASTER / GATEKEEPER
      # ============================================================

      - name: Analyze KeyMint security stack
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=============================================="
            echo "KEYMINT / KEYMASTER / GATEKEEPER"
            echo "=============================================="

            echo
            echo "===== KEYMINT FILES ====="

            find work/extracted \
              -type f \
              | grep -Ei "keymint" \
              | sort \
              || true

            echo
            echo "===== KEYMASTER FILES ====="

            find work/extracted \
              -type f \
              | grep -Ei "keymaster" \
              | sort \
              || true

            echo
            echo "===== GATEKEEPER FILES ====="

            find work/extracted \
              -type f \
              | grep -Ei "gatekeeper" \
              | sort \
              || true

            echo
            echo "===== KEYSTORE FILES ====="

            find work/extracted \
              -type f \
              | grep -Ei "keystore" \
              | sort \
              || true

            echo
            echo "===== KEYMINT INTERFACES ====="

            grep -RniE \
              "android\.hardware\.security\.keymint|IKeyMint|IKeyMintDevice|keymint-service" \
              work/extracted \
              2>/dev/null \
              || true

            echo
            echo "===== KEYMASTER INTERFACES ====="

            grep -RniE \
              "android\.hardware\.keymaster|IKeymaster|keymaster@" \
              work/extracted \
              2>/dev/null \
              || true

          } > work/report/keymint-analysis.txt


      # ============================================================
      # KEYMINT VERSION
      # ============================================================

      - name: Determine KeyMint version
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=============================================="
            echo "KEYMINT VERSION"
            echo "=============================================="

            echo
            echo "===== AIDL KEYMINT ====="

            grep -RniE \
              "android\.hardware\.security\.keymint" \
              work/extracted \
              2>/dev/null \
              || true

            echo
            echo "===== KEYMINT VERSION REFERENCES ====="

            grep -RniE \
              "KeyMint|keymint.*version|version.*keymint|IKeyMint" \
              work/extracted \
              2>/dev/null \
              || true

            echo
            echo "===== HIDL KEYMASTER ====="

            grep -RniE \
              "android\.hardware\.keymaster@[0-9]+\.[0-9]+" \
              work/extracted \
              2>/dev/null \
              || true

          } > work/report/keymint-version.txt


      # ============================================================
      # VINTF
      # ============================================================

      - name: Analyze VINTF
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=============================================="
            echo "VINTF SECURITY SERVICES"
            echo "=============================================="

            echo
            echo "===== MANIFEST FILES ====="

            find work/extracted \
              -type f \
              \( \
                -name "manifest.xml" \
                -o \
                -name "*manifest*.xml" \
              \) \
              | sort

            echo
            echo "===== SECURITY HALS ====="

            grep -RniE \
              "keymint|keymaster|gatekeeper|android\.hardware\.security" \
              work/extracted \
              2>/dev/null \
              || true

          } > work/report/vintf-analysis.txt


      # ============================================================
      # INIT SECURITY SERVICES
      # ============================================================

      - name: Analyze security init
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=============================================="
            echo "SECURITY INIT SERVICES"
            echo "=============================================="

            grep -RniE \
              "service .*vold|service .*keymint|service .*keymaster|service .*gatekeeper|service .*keystore" \
              work/extracted \
              2>/dev/null \
              || true

            echo
            echo "===== POST-FS-DATA ====="

            grep -RniE \
              "post-fs-data|post-fs" \
              work/extracted \
              --include="*.rc" \
              2>/dev/null \
              || true

          } > work/report/init-security.txt


      # ============================================================
      # SELINUX
      # ============================================================

      - name: Analyze SELinux security
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=============================================="
            echo "SELINUX SECURITY"
            echo "=============================================="

            grep -RniE \
              "keymint|keymaster|gatekeeper|keystore|vold|fscrypt" \
              work/extracted \
              --include="*.te" \
              --include="*.cil" \
              --include="file_contexts*" \
              --include="service_contexts*" \
              2>/dev/null \
              || true

          } > work/report/selinux-security.txt


      # ============================================================
      # CRYPTO MODULES
      # ============================================================

      - name: Analyze crypto modules
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=============================================="
            echo "CRYPTO / FBE KERNEL MODULES"
            echo "=============================================="

            find work/extracted \
              -type f \
              -name "*.ko" \
              | grep -Ei \
                "crypto|fscrypt|dm-crypt|crypt|f2fs|inline" \
              | sort \
              || true

          } > work/report/crypto-modules.txt


      # ============================================================
      # FIRMWARE
      # ============================================================

      - name: Inventory firmware
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=============================================="
            echo "FIRMWARE INVENTORY"
            echo "=============================================="

            find work/extracted \
              -type f \
              | grep -Ei \
                "/firmware/|\.bin$|\.fw$|\.mbn$" \
              | sort \
              || true

          } > work/report/firmware-inventory.txt


      # ============================================================
      # MERGED ODM
      # ============================================================

      - name: Check merged ODM
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "=============================================="
            echo "MERGED ODM"
            echo "=============================================="

            echo
            echo "===== vendor/odm ====="

            find work/extracted/vendor \
              -path "*vendor/odm*" \
              -print \
              2>/dev/null \
              | sort \
              || true

            echo
            echo "===== ODM REFERENCES ====="

            grep -RniE \
              "/odm/|vendor/odm" \
              work/extracted/vendor \
              2>/dev/null \
              | head -1000 \
              || true

          } > work/report/merged-odm.txt


      # ============================================================
      # MASTER REPORT
      # ============================================================

      - name: Generate master report
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "============================================================"
            echo "BERYL STOCK FBE + KEYMINT ANALYSIS"
            echo "============================================================"
            echo
            echo "Device: POCO M7 Pro 5G"
            echo "Codename: beryl"
            echo "ROM: ${{ inputs.ROM_VERSION }}"
            echo "Android: 14"
            echo
            echo "Fastest CDN:"
            echo "${{ steps.cdn.outputs.BEST_URL }}"
            echo
            echo "Benchmark:"
            echo "${{ steps.cdn.outputs.BEST_SPEED }} MiB/s"
            echo

            echo "============================================================"
            echo "FSTAB"
            echo "============================================================"
            cat work/report/fstab-analysis.txt

            echo
            echo "============================================================"
            echo "FBE"
            echo "============================================================"
            cat work/report/fbe-analysis.txt

            echo
            echo "============================================================"
