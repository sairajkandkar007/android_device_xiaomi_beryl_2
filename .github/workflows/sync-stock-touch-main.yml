name: Analyze Stock FBE KeyMint Stack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04

    env:
      ROM_VERSION: "OS1.0.4.0.UOQINXM"
      ROM_FILENAME: "miui_BERYLINGlobal_OS1.0.4.0.UOQINXM_b51bc03ea2_14.0.zip"

    steps:

      # ============================================================
      # 1. BASIC SETUP
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required tools
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
          aria2 \
          unzip \
          zip \
          p7zip-full \
          file \
          lz4 \
          cpio \
          e2fsprogs \
          erofs-utils \
          android-sdk-libsparse-utils \
          binutils \
          grep \
          sed \
          jq \
          python3 \
          python3-pip

          python3 --version
          aria2c --version
          file --version
          extract.erofs --help | head -20 || true


      # ============================================================
      # 2. INSTALL PAYLOAD DUMPER
      # ============================================================
      - name: Install android-payload-dumper
        run: |
          set -euxo pipefail

          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade android-payload-dumper==2.3.0

          python3 -m payload_dumper --version || true
          payload-dumper --version || true


      # ============================================================
      # 3. CREATE WORK DIRECTORIES
      # ============================================================
      - name: Prepare workspace
        run: |
          set -euxo pipefail

          rm -rf work
          mkdir -p \
            work/download \
            work/payload \
            work/partitions \
            work/extracted \
            work/analysis \
            work/logs


      # ============================================================
      # 4. BUILD MIUI CDN URLS
      # ============================================================
      - name: Prepare ROM URLs
        run: |
          set -euxo pipefail

          cat > work/cdn_urls.txt <<EOF
          https://bn.d.miui.com/${ROM_VERSION}/${ROM_FILENAME}
          https://bigota.d.miui.com/${ROM_VERSION}/${ROM_FILENAME}
          EOF

          cat work/cdn_urls.txt


      # ============================================================
      # 5. BENCHMARK MIUI CDNS
      # ============================================================
      - name: Benchmark Xiaomi CDNs
        shell: bash
        run: |
          set -uo pipefail

          : > work/cdn_benchmark.txt

          while IFS= read -r URL; do
            echo "Testing: $URL"

            RESULT=$(
              curl -L \
                --connect-timeout 15 \
                --max-time 30 \
                -r 0-10485759 \
                -o /dev/null \
                -sS \
                -w "%{http_code} %{speed_download}\n" \
                "$URL" 2>/dev/null
            ) || RESULT="000 0"

            CODE=$(echo "$RESULT" | awk '{print $1}')
            SPEED=$(echo "$RESULT" | awk '{print $2}')

            echo "$SPEED $CODE $URL" | tee -a work/cdn_benchmark.txt

          done < work/cdn_urls.txt

          echo
          echo "===== CDN BENCHMARK ====="
          sort -nr work/cdn_benchmark.txt || true


      # ============================================================
      # 6. SELECT FASTEST WORKING CDN
      # ============================================================
      - name: Select fastest CDN
        shell: bash
        run: |
          set -euo pipefail

          BEST_URL=$(
            awk '$2 ~ /^2/ && $1 > 0 {print $1 " " $3}' \
              work/cdn_benchmark.txt |
            sort -nr |
            head -1 |
            cut -d' ' -f2-
          )

          if [ -z "$BEST_URL" ]; then
            echo "No working Xiaomi CDN was found."
            cat work/cdn_benchmark.txt
            exit 1
          fi

          echo "Selected CDN:"
          echo "$BEST_URL"

          echo "ROM_URL=$BEST_URL" >> "$GITHUB_ENV"


      # ============================================================
      # 7. DOWNLOAD FULL STOCK ROM
      # ============================================================
      - name: Download stock ROM
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/download

          aria2c \
            --file-allocation=none \
            --continue=true \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=10M \
            --max-tries=10 \
            --retry-wait=5 \
            --timeout=60 \
            --connect-timeout=30 \
            --dir=work/download \
            --out="$ROM_FILENAME" \
            "$ROM_URL"

          ls -lh work/download/


      # ============================================================
      # 8. VERIFY ZIP
      # ============================================================
      - name: Verify downloaded ROM
        run: |
          set -euxo pipefail

          ROM="work/download/$ROM_FILENAME"

          test -f "$ROM"
          test -s "$ROM"

          file "$ROM"
          sha256sum "$ROM" | tee work/logs/rom.sha256

          unzip -t "$ROM" > work/logs/zip_test.txt

          tail -5 work/logs/zip_test.txt


      # ============================================================
      # 9. EXTRACT PAYLOAD.BIN
      # ============================================================
      - name: Extract payload.bin
        shell: bash
        run: |
          set -euo pipefail

          ROM="work/download/$ROM_FILENAME"

          unzip -l "$ROM" | grep -E '(^|/)payload\.bin$' || {
            echo "payload.bin was not found in the ROM."
            exit 1
          }

          unzip -p "$ROM" payload.bin > work/payload/payload.bin

          test -s work/payload/payload.bin

          ls -lh work/payload/payload.bin
          file work/payload/payload.bin

          sha256sum work/payload/payload.bin \
            | tee work/logs/payload.sha256


      # ============================================================
      # 10. LIST PAYLOAD PARTITIONS
      # ============================================================
      - name: List payload partitions
        shell: bash
        run: |
          set -euo pipefail

          python3 -m payload_dumper \
            work/payload/payload.bin \
            -l \
            > work/logs/payload_partitions.txt

          cat work/logs/payload_partitions.txt


      # ============================================================
      # 11. SELECT ONLY PARTITIONS ACTUALLY PRESENT
      # ============================================================
      - name: Select available analysis partitions
        shell: bash
        run: |
          set -euo pipefail

          declare -a REQUESTED=(
            vendor
            vendor_dlkm
            odm
            odm_dlkm
            system
            system_ext
            product
            system_dlkm
            init_boot
            boot
            dtbo
            vendor_boot
            vbmeta
            vbmeta_system
            vbmeta_vendor
          )

          : > work/logs/selected_partitions.txt
          : > work/logs/missing_partitions.txt

          for PART in "${REQUESTED[@]}"; do
            if grep -Eq "│[[:space:]]*$PART[[:space:]]*│" \
              work/logs/payload_partitions.txt; then

              echo "$PART" | tee -a work/logs/selected_partitions.txt

            else

              echo "$PART" | tee -a work/logs/missing_partitions.txt

            fi
          done

          echo
          echo "===== AVAILABLE ====="
          cat work/logs/selected_partitions.txt

          echo
          echo "===== MISSING ====="
          cat work/logs/missing_partitions.txt || true

          if [ ! -s work/logs/selected_partitions.txt ]; then
            echo "No requested partitions were found."
            exit 1
          fi


      # ============================================================
      # 12. EXTRACT STOCK PARTITIONS
      # ============================================================
      - name: Extract stock partitions
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t PARTITIONS < work/logs/selected_partitions.txt

          echo "Extracting:"
          printf '  %s\n' "${PARTITIONS[@]}"

          python3 -m payload_dumper \
            work/payload/payload.bin \
            -o work/partitions \
            -p "${PARTITIONS[@]}" \
            -j 8

          echo
          echo "===== EXTRACTED IMAGES ====="

          find work/partitions \
            -maxdepth 1 \
            -type f \
            -name '*.img' \
            -printf '%f %s bytes\n' \
            | sort


      # ============================================================
      # 13. IDENTIFY FILESYSTEM TYPES
      # ============================================================
      - name: Identify partition filesystems
        shell: bash
        run: |
          set -euo pipefail

          : > work/logs/filesystems.txt

          for IMG in work/partitions/*.img; do
            [ -f "$IMG" ] || continue

            echo "===== $(basename "$IMG") =====" \
              | tee -a work/logs/filesystems.txt

            file "$IMG" \
              | tee -a work/logs/filesystems.txt

            echo \
              | tee -a work/logs/filesystems.txt
          done


      # ============================================================
      # 14. EXTRACT EROFS FILESYSTEMS
      # ============================================================
      - name: Extract EROFS partitions
        shell: bash
        run: |
          set -u

          for IMG in \
            vendor \
            vendor_dlkm \
            odm \
            odm_dlkm \
            system \
            system_ext \
            product \
            system_dlkm
          do

            SRC="work/partitions/${IMG}.img"

            if [ ! -f "$SRC" ]; then
              continue
            fi

            if file "$SRC" | grep -qi "EROFS"; then

              echo "Extracting EROFS: $IMG"

              mkdir -p "work/extracted/$IMG"

              extract.erofs \
                -i "$SRC" \
                -x \
                -T0 \
                -f \
                -o "$PWD/work/extracted/$IMG" \
                > "work/logs/${IMG}_extract.log" 2>&1 \
                || {
                  echo "EROFS extraction failed for $IMG"
                  cat "work/logs/${IMG}_extract.log"
                }

            else

              echo "Skipping $IMG: not detected as EROFS"

            fi
          done


      # ============================================================
      # 15. EXTRACT EXT4 FILESYSTEMS IF PRESENT
      # ============================================================
      - name: Extract EXT4 partitions
        shell: bash
        run: |
          set -u

          for IMG in \
            vendor \
            vendor_dlkm \
            odm \
            odm_dlkm \
            system \
            system_ext \
            product \
            system_dlkm
          do

            SRC="work/partitions/${IMG}.img"

            if [ ! -f "$SRC" ]; then
              continue
            fi

            if file "$SRC" | grep -qiE "ext4 filesystem"; then

              echo "Extracting EXT4: $IMG"

              mkdir -p "work/extracted/$IMG"

              debugfs \
                -R "rdump / $PWD/work/extracted/$IMG" \
                "$SRC" \
                > "work/logs/${IMG}_debugfs.log" 2>&1 \
                || {
                  echo "EXT4 extraction failed for $IMG"
                  cat "work/logs/${IMG}_debugfs.log"
                }

            fi
          done


      # ============================================================
      # 16. EXTRACT VENDOR_BOOT RAMDISK
      # ============================================================
      - name: Analyze vendor_boot
        shell: bash
        run: |
          set -euo pipefail

          IMG="work/partitions/vendor_boot.img"

          if [ ! -f "$IMG" ]; then
            echo "vendor_boot.img not present in payload."
            exit 0
          fi

          file "$IMG" | tee work/logs/vendor_boot.file.txt

          mkdir -p work/extracted/vendor_boot


          # Try Android boot image tools if available.
          if command -v unpack_bootimg >/dev/null 2>&1; then

            unpack_bootimg \
              --boot_img="$IMG" \
              --out=work/extracted/vendor_boot \
              > work/logs/vendor_boot_unpack.txt 2>&1 \
              || true

          fi


          find work/extracted/vendor_boot \
            -maxdepth 2 \
            -type f \
            -printf '%p\n' \
            | sort \
            > work/logs/vendor_boot_files.txt

          cat work/logs/vendor_boot_files.txt || true


      # ============================================================
      # 17. SEARCH FBE CONFIGURATION
      # ============================================================
      - name: Analyze FBE configuration
        shell: bash
        run: |
          set -u

          OUT="work/analysis/fbe_configuration.txt"

          {
            echo "=========================================="
            echo "STOCK FBE CONFIGURATION ANALYSIS"
            echo "Device: POCO M7 Pro 5G / beryl"
            echo "ROM: $ROM_VERSION"
            echo "=========================================="
            echo

            echo "### FSTAB FILES"
            find work/extracted \
              -type f \
              \( -iname 'fstab*' -o -iname '*fstab*' \) \
              -print \
              | sort

            echo
            echo "### FSTAB CONTENT"
            find work/extracted \
              -type f \
              \( -iname 'fstab*' -o -iname '*fstab*' \) \
              -print0 |
            while IFS= read -r -d '' F; do
              echo
              echo "----- $F -----"
              cat "$F"
            done

            echo
            echo "### FBE / FILEENCRYPTION REFERENCES"
            grep -RniE \
              'fileencryption|metadata_encryption|keydirectory|wrappedkey|keyref|fscrypt|inlinecrypt|emmc_optimized|f2fs' \
              work/extracted \
              2>/dev/null \
              | head -1000 || true

            echo
            echo "### METADATA REFERENCES"
            grep -RniE \
              'metadata' \
              work/extracted/vendor/etc \
              work/extracted/system/etc \
              work/extracted/system_ext/etc \
              2>/dev/null \
              | head -500 || true

          } > "$OUT"

          cat "$OUT"


      # ============================================================
      # 18. ANALYZE VOLD
      # ============================================================
      - name: Analyze vold and fscrypt
        shell: bash
        run: |
          set -u

          OUT="work/analysis/vold_fscrypt.txt"

          {
            echo "=========================================="
            echo "VOLD / FSCRYPT ANALYSIS"
            echo "=========================================="

            echo
            echo "### VOLD BINARIES"

            find work/extracted \
              -type f \
              \( \
                -name 'vold' \
                -o -name '*fscrypt*' \
                -o -name '*cryptfs*' \
              \) \
              -print \
              | sort

            echo
            echo "### VOLD STRINGS"

            while IFS= read -r F; do
              echo
              echo "----- $F -----"

              strings "$F" 2>/dev/null |
                grep -iE \
                'fscrypt|fileencryption|metadata|keymaster|keymint|gatekeeper|wrapped|inlinecrypt|fbe|cryptfs' \
                | head -500 || true

            done < <(
              find work/extracted \
                -type f \
                \( -name 'vold' -o -name '*fscrypt*' \) \
                -print
            )

          } > "$OUT"

          cat "$OUT"


      # ============================================================
      # 19. FIND KEYMINT / KEYMASTER / GATEKEEPER
      # ============================================================
      - name: Analyze KeyMint stack
        shell: bash
        run: |
          set -u

          OUT="work/analysis/keymint.txt"

          {
            echo "=========================================="
            echo "KEYMINT / KEYMASTER / GATEKEEPER ANALYSIS"
            echo "=========================================="

            echo
            echo "### POSSIBLE KEYMINT FILES"

            find work/extracted \
              -type f \
              \( \
                -iname '*keymint*' \
                -o -iname '*keymaster*' \
                -o -iname '*gatekeeper*' \
                -o -iname '*secure*element*' \
                -o -iname '*weaver*' \
              \) \
              -print \
              | sort

            echo
            echo "### KEYMINT REFERENCES"

            grep -RniE \
              'android\.hardware\.security\.keymint|keymint|keymaster|gatekeeper|weaver' \
              work/extracted \
              2>/dev/null \
              | head -2000 || true

            echo
            echo "### KEYMINT BINARIES AND LIBRARIES"

            find work/extracted \
              -type f \
              \( \
                -name 'android.hardware.security.keymint*' \
                -o -name '*keymint*.so' \
                -o -name '*keymaster*.so' \
                -o -name '*gatekeeper*.so' \
              \) \
              -print \
              | sort

          } > "$OUT"

          cat "$OUT"


      # ============================================================
      # 20. ANALYZE INIT SERVICES
      # ============================================================
      - name: Analyze crypto init services
        shell: bash
        run: |
          set -u

          OUT="work/analysis/init_crypto_services.txt"

          {
            echo "=========================================="
            echo "CRYPTO / KEYMINT INIT SERVICES"
            echo "=========================================="

            grep -RniE \
              'keymint|keymaster|gatekeeper|vold|cryptfs|fscrypt|keystore2|tee|trustonic|trusty' \
              work/extracted \
              --include='*.rc' \
              --include='*.xml' \
              2>/dev/null \
              | head -3000 || true

          } > "$OUT"

          cat "$OUT"


      # ============================================================
      # 21. ANALYZE VINTF HAL DECLARATIONS
      # ============================================================
      - name: Analyze security HALs
        shell: bash
        run: |
          set -u

          OUT="work/analysis/security_hal_vintf.txt"

          {
            echo "=========================================="
            echo "SECURITY HAL / VINTF ANALYSIS"
            echo "=========================================="

            find work/extracted \
              -type f \
              \( \
                -name '*manifest*.xml' \
                -o -name '*matrix*.xml' \
                -o -path '*/etc/vintf/*' \
              \) \
              -print \
              | sort

            echo
            echo "### SECURITY HAL REFERENCES"

            grep -RniE \
              'keymint|keymaster|gatekeeper|weaver|secure_element' \
              work/extracted \
              --include='*.xml' \
              2>/dev/null \
              | head -3000 || true

          } > "$OUT"

          cat "$OUT"


      # ============================================================
      # 22. ANALYZE SECURITY PROPERTIES
      # ============================================================
      - name: Analyze security properties
        shell: bash
        run: |
          set -u

          OUT="work/analysis/security_properties.txt"

          {
            echo "=========================================="
            echo "SECURITY / FBE PROPERTIES"
            echo "=========================================="

            find work/extracted \
              -type f \
              \( \
                -name 'build.prop' \
                -o -name '*.prop' \
              \) \
              -print0 |
            while IFS= read -r -d '' F; do

              echo
              echo "----- $F -----"

              grep -E \
                'ro\.crypto|ro\.security|ro\.boot\.verifiedboot|ro\.build\.version|keymint|keymaster|fscrypt|fbe|vold' \
                "$F" \
                2>/dev/null \
                || true

            done

          } > "$OUT"

          cat "$OUT"


      # ============================================================
      # 23. ANALYZE CRYPTO LIBRARIES
      # ============================================================
      - name: Analyze crypto libraries
        shell: bash
        run: |
          set -u

          OUT="work/analysis/crypto_libraries.txt"

          {
            echo "=========================================="
            echo "CRYPTO LIBRARY ANALYSIS"
            echo "=========================================="

            find work/extracted \
              -type f \
              \( \
                -name 'libcrypto*' \
                -o -name 'libkeymaster*' \
                -o -name 'libkeymint*' \
                -o -name '*keystore*.so' \
                -o -name '*fscrypt*.so' \
              \) \
              -print \
              | sort

            echo
            echo "### SYMBOL / STRING REFERENCES"

            find work/extracted \
              -type f \
              \( \
                -name 'libkeymaster*' \
                -o -name 'libkeymint*' \
                -o -name '*keystore*.so' \
              \) \
              -print0 |
            while IFS= read -r -d '' F; do

              echo
              echo "----- $F -----"

              strings "$F" 2>/dev/null |
                grep -iE \
                'keymint|keymaster|keystore|secure|fscrypt|crypto|hardware' \
                | head -300 || true

            done

          } > "$OUT"

          cat "$OUT"


      # ============================================================
      # 24. ANALYZE SELINUX SECURITY LABELS
      # ============================================================
      - name: Analyze SELinux security files
        shell: bash
        run: |
          set -u

          OUT="work/analysis/selinux_security.txt"

          {
            echo "=========================================="
            echo "SELINUX SECURITY ANALYSIS"
            echo "=========================================="

            find work/extracted \
              -type f \
              \( \
                -name 'file_contexts*' \
                -o -name '*sepolicy*' \
                -o -name 'property_contexts' \
                -o -name 'service_contexts' \
              \) \
              -print \
              | sort

            echo
            echo "### KEYMINT / VOLD SELINUX REFERENCES"

            grep -RniE \
              'keymint|keymaster|gatekeeper|vold|keystore|metadata' \
              work/extracted \
              --include='*context*' \
              2>/dev/null \
              | head -2000 || true

          } > "$OUT"

          cat "$OUT"


      # ============================================================
      # 25. ANALYZE VENDOR_DLKM
      # ============================================================
      - name: Analyze vendor_dlkm
        shell: bash
        run: |
          set -u

          OUT="work/analysis/vendor_dlkm.txt"

          {
            echo "=========================================="
            echo "VENDOR_DLKM ANALYSIS"
            echo "=========================================="

            if [ -d work/extracted/vendor_dlkm ]; then

              echo
              echo "### MODULES"

              find work/extracted/vendor_dlkm \
                -type f \
                -name '*.ko' \
                -print \
                | sort

              echo
              echo "### MODULES.LOAD"

              find work/extracted/vendor_dlkm \
                -type f \
                -name 'modules.load*' \
                -print0 |
              while IFS= read -r -d '' F; do
                echo
                echo "----- $F -----"
                cat "$F"
              done

              echo
              echo "### MODULES.DEP"

              find work/extracted/vendor_dlkm \
                -type f \
                -name 'modules.dep*' \
                -print0 |
              while IFS= read -r -d '' F; do
                echo
                echo "----- $F -----"
                cat "$F"
              done

            fi

          } > "$OUT"

          cat "$OUT"


      # ============================================================
      # 26. FIND FIRMWARE / TEE MATERIAL
      # ============================================================
      - name: Analyze firmware and TEE references
        shell: bash
        run: |
          set -u

          OUT="work/analysis/firmware_tee.txt"

          {
            echo "=========================================="
            echo "FIRMWARE / TEE ANALYSIS"
            echo "=========================================="

            echo
            echo "### SECURITY-RELATED FIRMWARE"

            find work/extracted \
              -type f \
              \( \
                -iname '*keymint*' \
                -o -iname '*keymaster*' \
                -o -iname '*trusty*' \
                -o -iname '*tee*' \
                -o -iname '*tz*' \
                -o -iname '*km*' \
              \) \
              -print \
              | sort

            echo
            echo "### FIRMWARE DIRECTORIES"

            find work/extracted \
              -type d \
              \( \
                -path '*/firmware*' \
                -o -path '*/tee*' \
                -o -path '*/trusty*' \
              \) \
              -print \
              | sort

          } > "$OUT"

          cat "$OUT"


      # ============================================================
      # 27. CREATE MACHINE-READABLE FILE INVENTORY
      # ============================================================
      - name: Create file inventory
        shell: bash
        run: |
          set -euo pipefail

          find work/extracted \
            -type f \
            -printf '%p\t%s bytes\n' \
            | sort \
            > work/analysis/file_inventory.txt

          find work/partitions \
            -maxdepth 1 \
            -type f \
            -printf '%f\t%s bytes\n' \
            | sort \
            > work/analysis/partition_inventory.txt


      # ============================================================
      # 28. GENERATE FINAL SUMMARY
      # ============================================================
      - name: Generate FBE analysis summary
        shell: bash
        run: |
          set -euo pipefail

          OUT="work/analysis/FBE_KEYMINT_SUMMARY.txt"

          {
            echo "============================================================"
            echo "POCO M7 PRO 5G / BERYL"
            echo "STOCK FBE + KEYMINT ANALYSIS"
            echo "============================================================"
            echo
            echo "ROM_VERSION : $ROM_VERSION"
            echo "ROM_FILENAME: $ROM_FILENAME"
            echo
            echo "============================================================"
            echo "PARTITIONS"
            echo "============================================================"
            cat work/logs/selected_partitions.txt
            echo
            echo "Missing requested partitions:"
            cat work/logs/missing_partitions.txt || true

            echo
            echo "============================================================"
            echo "FBE CONFIGURATION"
            echo "============================================================"
            cat work/analysis/fbe_configuration.txt

            echo
            echo "============================================================"
            echo "VOLD / FSCRYPT"
            echo "============================================================"
            cat work/analysis/vold_fscrypt.txt

            echo
            echo "============================================================"
            echo "KEYMINT"
            echo "============================================================"
            cat work/analysis/keymint.txt

            echo
            echo "============================================================"
            echo "INIT CRYPTO SERVICES"
            echo "============================================================"
            cat work/analysis/init_crypto_services.txt

            echo
            echo "============================================================"
            echo "SECURITY HAL / VINTF"
            echo "============================================================"
            cat work/analysis/security_hal_vintf.txt

            echo
            echo "============================================================"
            echo "SECURITY PROPERTIES"
            echo "============================================================"
            cat work/analysis/security_properties.txt

            echo
            echo "============================================================"
            echo "CRYPTO LIBRARIES"
            echo "============================================================"
            cat work/analysis/crypto_libraries.txt

            echo
            echo "============================================================"
            echo "SELINUX"
            echo "============================================================"
            cat work/analysis/selinux_security.txt

            echo
            echo "============================================================"
            echo "VENDOR_DLKM"
            echo "============================================================"
            cat work/analysis/vendor_dlkm.txt

            echo
            echo "============================================================"
            echo "FIRMWARE / TEE"
            echo "============================================================"
            cat work/analysis/firmware_tee.txt

          } > "$OUT"

          cat "$OUT"


      # ============================================================
      # 29. PACKAGE ANALYSIS
      # ============================================================
      - name: Package analysis results
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/result

          cp -a work/analysis \
            work/logs \
            work/result/

          cp work/logs/payload_partitions.txt \
            work/result/

          cp work/logs/selected_partitions.txt \
            work/result/

          cp work/logs/missing_partitions.txt \
            work/result/

          tar -czf \
            stock-fbe-keymint-analysis.tar.gz \
            -C work/result .

          ls -lh stock-fbe-keymint-analysis.tar.gz


      # ============================================================
      # 30. UPLOAD RESULTS
      # ============================================================
      - name: Upload FBE KeyMint analysis
        uses: actions/upload-artifact@v4
        with:
          name: beryl-stock-fbe-keymint-analysis
          path: |
            stock-fbe-keymint-analysis.tar.gz
            work/analysis/FBE_KEYMINT_SUMMARY.txt
            work/logs/payload_partitions.txt
            work/logs/selected_partitions.txt
            work/logs/missing_partitions.txt
          if-no-files-found: error
          retention-days: 14
